# Default rate card — OVERRIDE PER PROJECT.
#
# Day rates in EUR, net, per productive 8-hour man-day.
# Anchored on the local offer corpus:
#   - Huawei WMS (enterprise, international): 600 EUR/day blended
#   - Sunbloom (SME, Hungary):                423 EUR/day
#   - Nearshore CEE market bands 2025/26:     senior 30-70 EUR/h => ~240-560 EUR/day
#
# To override: copy this file into the project, edit, and pass --rates <file>,
# or set `rates_file: ./rates.yaml` in the estimate input.

rates:
