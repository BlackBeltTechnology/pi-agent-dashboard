<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme SSO — Signed out</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #241a2f 0%, #0b0810 60%);
        color: #efe8f8;
      }
      main { width: min(30rem, 92vw); padding: 2.25rem; border-radius: 1rem;
        background: #16101f; border: 1px solid #40304f;
        box-shadow: 0 24px 60px -24px #000; }
      .kicker { margin: 0 0 1.25rem; font-size: .72rem; letter-spacing: .14em;
        text-transform: uppercase; color: #c39bf0; }
      h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
      p { margin: 0 0 1rem; color: #b6a8c9; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .82em; background: #241a30; padding: .12em .4em; border-radius: .3rem; color: #e4d6ff; }
      a.btn { display: block; margin: 1.25rem 0 .5rem; padding: .8rem 1rem; text-align: center;
        border-radius: .6rem; background: #b98cf0; color: #1c0f2b; font-weight: 650; text-decoration: none; }
      a.btn:hover { background: #c9a4f5; }
      .meta { margin: .75rem 0 0; font-size: .8rem; color: #8274a0; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">separate view · identity-smoke plugin</p>
      <h1>You are signed out</h1>
      <p>
        Core routed <code>/logout</code> here because the descriptor carried <code>logoutUrl</code>.
        A real provider would now run RP-initiated logout (clear tokens, then hit the IdP's
        <code>end_session_endpoint</code>).
      </p>
      <a class="btn" href="/">Back to dashboard</a>
      <p class="meta">served by <code>GET /identity-smoke/logout</code></p>
    </main>
  </body>
</html>
