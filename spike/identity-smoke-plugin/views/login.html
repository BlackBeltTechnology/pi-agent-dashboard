<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme SSO — Sign in</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #10233b 0%, #070c14 60%);
        color: #e7eefc;
      }
      main { width: min(30rem, 92vw); padding: 2.25rem; border-radius: 1rem;
        background: #0d1626; border: 1px solid #23405f;
        box-shadow: 0 24px 60px -24px #000; }
      .kicker { margin: 0 0 1.25rem; font-size: .72rem; letter-spacing: .14em;
        text-transform: uppercase; color: #6fd1c0; }
      h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
      p { margin: 0 0 1rem; color: #a8bcd6; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .82em; background: #16233a; padding: .12em .4em; border-radius: .3rem; color: #cfe3ff; }
      button { width: 100%; margin: 1.25rem 0 .5rem; padding: .8rem 1rem; border: 0;
        border-radius: .6rem; background: #2fd4b0; color: #06231d; font: inherit; font-weight: 650; cursor: pointer; }
      button:hover { background: #45e0be; }
      .meta { margin: .75rem 0 0; font-size: .8rem; color: #6c86a6; }
      .stub { margin-top: 1rem; padding: .7rem .85rem; border-radius: .5rem;
        background: #1b1a0f; border: 1px solid #5d5326; color: #e8d9a0; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">separate view · identity-smoke plugin</p>
      <h1>Sign in</h1>
      <p>
        This page is <strong>not</strong> part of the dashboard bundle. Core read the browser-login
        descriptor, saw <code>loginUrl</code>, and redirected here.
      </p>
      <form method="get" action="/">
        <button type="submit">Continue to dashboard</button>
      </form>
      <p class="meta">served by <code>GET /identity-smoke/login</code></p>
      <p class="stub">Smoke stub — no token is minted or handed to the SPA.</p>
    </main>
  </body>
</html>
