<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Folder-card pills: light-theme contrast — as-built vs proposed</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mockup.css" />
<link rel="stylesheet" href="board.css" />
<link rel="stylesheet" href="pills.css" />
<script src="icons.js"></script>
<script src="surfaces.js"></script>
<script src="probe.js"></script>
</head>
<body data-view="both">
<div class="toolbar" role="toolbar" aria-label="Board controls">
  <h1>Folder-card pills · contrast</h1>
  <span class="seg-label" id="lbl-theme">Theme</span>
  <div class="seg" aria-labelledby="lbl-theme" data-group="theme">
    <button aria-pressed="false" data-v="base-dark">Base dark</button>
    <button aria-pressed="true" data-v="base-light">Base light</button>
    <button aria-pressed="false" data-v="nord-dark">Nord dark</button>
    <button aria-pressed="false" data-v="nord-light">Nord light</button>
  </div>
  <span class="seg-label" id="lbl-v">Show</span>
  <div class="seg" aria-labelledby="lbl-v" data-group="view">
    <button aria-pressed="true" data-v="both">Both</button>
    <button aria-pressed="false" data-v="asbuilt">As-built</button>
    <button aria-pressed="false" data-v="proposed">Proposed</button>
  </div>
</div>
<div class="shell">
  <nav class="nav" aria-label="Surfaces" id="nav"></nav>
  <main id="board"></main>
</div>
<script>
const codeify = (s) => esc(s).replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
const DECISIONS = `<div class="decision"><h3>Decisions — approved: D1, D2 (info), D3-A, D4, D5</h3><ul>
  <li><b>D1 Banner shape</b> — every hook rung = icon + message + one <code>border-current</code> action (setup-rung template). New copy: “Init hook changed since you last trusted it”, “Init hook hasn’t run in this checkout”.</li>
  <li><b>D2 Done rung</b> — recommended: stays info, check icon + text inherit the info <code>-fg</code>. Alternative: own <code>success</code> triple — blocked by F15 (<code>--severity-success-fg</code> 4.47:1 in Nord light).</li>
  <li><b>D3 Slot glyphs</b> — A: map onto the 6 host hue tokens (recommended) · B: neutral glyph, hue only on error · C: add indigo/cyan/teal tokens (54 palette values).</li>
  <li><b>D4 Type floor</b> — touched controls 10/11 → 12 px (button floor); slot-pill unit + state markers and init-stack mono 10/10.5 → 11 px (text floor).</li>
  <li><b>D5 Guard</b> — new <code>rawPalette</code> arm in <code>scripts/theme-token-guard.mjs</code>: ratchet over <code>(text|bg|border|from|via|to|ring|fill|stroke)-&lt;hue&gt;-&lt;n&gt;</code> per file; today's 1,211 hits in 176 files / 399 file::hue sites = baseline; new ones fail; fixed files shrink it.</li>
</ul></div>`;
function renderNav(cur) {
  document.getElementById("nav").innerHTML = `<h2>Surfaces</h2>` + SURFACES.map((s, i) =>
    `<a href="#${s.id}" ${s.id === cur ? 'aria-current="page"' : ""}>${ic(s.icon)}S${i + 1} ${esc(s.title)}</a>`).join("");
}
function renderSurface(id) {
  _n = 0;
  const s = SURFACES.find((x) => x.id === id) || SURFACES[0];
  const rows = s.rows.map(([name, ab, pr, note]) => `<section class="row" data-row="${esc(name)}">
      <div class="rh"><h3>${esc(name)}</h3><span class="note">${codeify(note || "")}</span></div>
      <div class="col asbuilt"><p class="tag">As-built <span class="pill neutral rb"></span></p>${ab()}<ul class="ratios"></ul></div>
      <div class="col proposed"><p class="tag">Proposed · tokens only <span class="pill neutral rb"></span></p>${pr()}<ul class="ratios"></ul></div></section>`).join("");
  document.getElementById("board").innerHTML = `<div class="surface-h"><h2>S${SURFACES.indexOf(s) + 1} ${esc(s.title)}</h2><span class="pill neutral" id="probe-badge">probe…</span></div>
    <p class="surface-lead">${codeify(s.lead)}</p>
    <div class="cites">Sources: ${s.cites.map(([f, n]) => `<span><code>${esc(f)}</code> ${codeify(n)}</span>`).join(" · ")}</div>
    <ul class="finds-list">${s.finds.map(([fid, t]) => `<li><code class="id">${fid}</code>${codeify(t)}</li>`).join("")}</ul>
    ${DECISIONS}<div class="rows" style="margin-top:14px">${rows}</div>`;
  renderNav(s.id); requestAnimationFrame(probeAll);
}
function probeCols() {
  let ab = 0, pr = 0;
  document.querySelectorAll(".row .col").forEach((col) => {
    const fails = window.__probeRoot(col);
    const isPr = col.classList.contains("proposed");
    isPr ? (pr += fails.length) : (ab += fails.length);
    col.querySelector(".ratios").innerHTML = fails.map((f) => `<li class="bad">✕ ${esc(f)}</li>`).join("") || `<li>✓ 0 failures</li>`;
    const rb = col.querySelector(".rb"); rb.className = `pill ${fails.length ? "error" : "success"} rb`; rb.textContent = fails.length ? `${fails.length} fail` : "pass";
  });
  return { ab, pr };
}
function probeAll() {
  const { ab, pr } = probeCols();
  const b = document.getElementById("probe-badge");
  b.className = `pill ${pr ? "error" : "success"}`;
  b.textContent = `As-built ${ab} · Proposed ${pr} failures`;
}
/* headless: every surface × current theme → {surface: {ab, pr, fails[]}} */
window.__probeAllSurfaces = () => {
  const cur = location.hash.slice(1); const res = {};
  for (const s of SURFACES) { renderSurface(s.id); const r = probeCols();
    res[s.id] = { ...r, proposedFails: [...document.querySelectorAll(".row .col.proposed")].flatMap((c) => window.__probeRoot(c).map((f) => `${c.closest(".row").dataset.row}: ${f}`)) }; }
  renderSurface(cur || SURFACES[0].id); return res;
};
function route() { renderSurface(location.hash.slice(1) || SURFACES[0].id); }
addEventListener("hashchange", route);
function applyTheme(v) {
  const [pal, mode] = v.split("-"), html = document.documentElement;
  mode === "light" ? html.setAttribute("data-theme", "light") : html.removeAttribute("data-theme");
  pal === "nord" ? html.setAttribute("data-palette", "nord") : html.removeAttribute("data-palette");
}
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (seg.dataset.group === "theme") { applyTheme(b.dataset.v); route(); }
  if (seg.dataset.group === "view") document.body.dataset.view = b.dataset.v;
}));
applyTheme("base-light");
route();
const params = new URLSearchParams(location.search);
for (const g of ["theme", "view"]) if (params.get(g)) document.querySelector(`.seg[data-group="${g}"] button[data-v="${params.get(g)}"]`)?.click();
</script>
</body>
</html>
