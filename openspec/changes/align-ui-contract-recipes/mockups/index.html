<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI contract recipes — as-built vs proposed</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mockup.css" />
<link rel="stylesheet" href="board.css" />
<link rel="stylesheet" href="recipes.css" />
<script src="icons.js"></script>
<script src="recipes.js"></script>
<script src="surfaces.js"></script>
<script src="probe.js"></script>
</head>
<body data-view="both">
<div class="toolbar" role="toolbar" aria-label="Board controls">
  <h1>UI contract recipes</h1>
  <span class="seg-label" id="lbl-theme">Theme</span>
  <div class="seg" aria-labelledby="lbl-theme" data-group="theme">
    <button aria-pressed="true" data-v="base-dark">Base dark</button>
    <button aria-pressed="false" data-v="base-light">Base light</button>
    <button aria-pressed="false" data-v="nord-dark">Nord dark</button>
  </div>
  <span class="seg-label" id="lbl-w">Frame</span>
  <div class="seg" aria-labelledby="lbl-w" data-group="width">
    <button aria-pressed="false" data-v="375">375</button>
    <button aria-pressed="false" data-v="768">768</button>
    <button aria-pressed="true" data-v="full">Full</button>
  </div>
  <span class="seg-label" id="lbl-v">Show</span>
  <div class="seg" aria-labelledby="lbl-v" data-group="view">
    <button aria-pressed="true" data-v="both">Side by side</button>
    <button aria-pressed="false" data-v="asbuilt">As-built</button>
    <button aria-pressed="false" data-v="proposed">Proposed</button>
  </div>
</div>
<div class="shell">
  <nav class="nav" aria-label="Recipes" id="nav"></nav>
  <main id="board"></main>
</div>
<script>
const VERDICT = { consolidate: ["warning", "Consolidate"], "new row": ["info", "New row"], fix: ["error", "Fix debt"] };
const byId = Object.fromEntries(RECIPES.map((r) => [r.id, r]));
const codeify = (s) => s.replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`);

function renderNav(cur) {
  document.getElementById("nav").innerHTML = `<h2>Recipes</h2>` + RECIPES.map((r, i) => {
    const [tone, word] = VERDICT[r.verdict];
    return `<a href="#${r.id}" ${r.id === cur ? 'aria-current="page"' : ""}>${ic(r.icon)}R${i + 1} ${r.title}<span class="v pill ${tone}">${word}</span></a>`;
  }).join("") + `<h2>Surfaces · fixed in code</h2>` + SURFACES.map((s, i) => `<a href="#${s.id}" ${s.id === cur ? 'aria-current="page"' : ""}>${ic(s.icon)}S${i + 1} ${s.title}</a>`).join("") + `<h2>Rows</h2><a href="#rows" ${cur === "rows" ? 'aria-current="page"' : ""}>${ic("TextBoxOutline")}All proposed contract rows</a>`;
}
function renderRecipe(id) {
  _id = 0;
  if (id === "rows") {
    document.getElementById("board").innerHTML = `<div class="surface-h"><h2>Proposed ui-contract.md rows</h2></div>
      <p class="surface-lead">These replace or extend the "Component invariants" table. Copy-ready.</p>` +
      RECIPES.map((r, i) => `<h3 class="sec" style="margin-top:16px">R${i + 1} ${r.title}</h3><pre class="row-text">${esc(r.row)}</pre>`).join("");
    renderNav("rows"); return;
  }
  const s = SURFACES.find((x) => x.id === id);
  if (s) {
    document.getElementById("board").innerHTML = `<div class="surface-h"><h2>${s.title}</h2><span class="pill error">Fix in code</span><span class="pill neutral probe-badge" id="probe-badge">probe…</span></div>
      <p class="surface-lead">${codeify(s.lead)}</p>
      <ul class="finds-list">${s.finds.map(([fid, t]) => `<li><code class="id">${fid}</code>${codeify(t)}</li>`).join("")}</ul>
      <div class="sf-stack"><div class="col built"><p class="tag">As-built · shipped classes, verbatim</p><div class="frame demo">${s.built()}</div></div>
      <div class="col prop"><p class="tag">Proposed</p><div class="frame">${s.prop()}</div></div></div>`;
    renderNav(s.id); badge(); return;
  }
  const r = byId[id] || RECIPES[0]; const [tone, word] = VERDICT[r.verdict];
  const built = r.asbuilt().join("");
  const prop = r.proposed().map(([name, html, on2]) => `<div class="pstate"><div class="src"><code>${name}</code></div><div class="frame ${on2 ? "on2" : ""}">${html}</div></div>`).join("");
  document.getElementById("board").innerHTML = `<div class="surface-h"><h2>${r.title}</h2><span class="pill ${tone}">${word}</span><span class="pill neutral probe-badge" id="probe-badge">probe…</span></div>
    <p class="surface-lead">${codeify(r.lead)}</p>
    <div class="cites">${r.cites.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}</div>
    <ul class="finds-list">${r.finds.map(([fid, t]) => `<li><code class="id">${fid}</code>${codeify(t)}</li>`).join("")}</ul>
    <div class="rc-grid"><div class="col built"><p class="tag">As-built · shipped classes, verbatim</p>${built}</div>
      <div class="col prop"><p class="tag">Proposed · one recipe</p>${prop}</div></div>
    <h3 class="sec" style="margin-top:16px">Contract row</h3><pre class="row-text">${esc(r.row)}</pre>`;
  renderNav(r.id);
  badge();
}
function badge() {
  requestAnimationFrame(() => {
    const fails = [...document.querySelectorAll(".col.prop .frame")].flatMap(window.__probeRoot);
    const b = document.getElementById("probe-badge");
    b.className = `pill ${fails.length ? "error" : "success"} probe-badge`;
    b.textContent = fails.length ? `Proposed: ${fails.length} probe failure${fails.length > 1 ? "s" : ""}` : "Proposed: 0 probe failures";
    b.title = fails.join("\n");
  });
}
function route() { renderRecipe(location.hash.slice(1) || "pill"); window.scrollTo(0, 0); }
addEventListener("hashchange", route);
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const group = seg.dataset.group, v = b.dataset.v, html = document.documentElement;
  if (group === "theme") {
    const [pal, mode] = v.split("-");
    mode === "light" ? html.setAttribute("data-theme", "light") : html.removeAttribute("data-theme");
    pal === "nord" ? html.setAttribute("data-palette", "nord") : html.removeAttribute("data-palette");
    route();
  }
  if (group === "width") { document.body.style.setProperty("--frame-w", v === "full" ? "100%" : `${v}px`); document.body.dataset.w = v; }
  if (group === "view") document.body.dataset.view = v;
}));
route();
const params = new URLSearchParams(location.search);
for (const g of ["theme", "width", "view"]) if (params.get(g)) document.querySelector(`.seg[data-group="${g}"] button[data-v="${params.get(g)}"]`)?.click();
</script>
</body>
</html>
