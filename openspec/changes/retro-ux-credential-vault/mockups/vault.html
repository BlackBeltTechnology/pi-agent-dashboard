<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retro UX — credential vault (#882)</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mockup.css" />
<link rel="stylesheet" href="asbuilt.css" />
<link rel="stylesheet" href="vault.css" />
<script src="icons.js"></script>
</head>
<body data-view="both">
<div class="toolbar" role="toolbar" aria-label="Board controls">
  <h1>Credential vault — as-built vs proposed</h1>
  <span class="seg-label" id="lbl-theme">Theme</span>
  <div class="seg" aria-labelledby="lbl-theme" data-group="theme">
    <button aria-pressed="true" data-v="base-dark">Base dark</button>
    <button aria-pressed="false" data-v="base-light">Base light</button>
    <button aria-pressed="false" data-v="nord-dark">Nord dark</button>
  </div>
  <span class="seg-label" id="lbl-w">Frame</span>
  <div class="seg" aria-labelledby="lbl-w" data-group="width">
    <button aria-pressed="false" data-v="375">375</button>
    <button aria-pressed="false" data-v="768">768</button>
    <button aria-pressed="true" data-v="1440">1440</button>
  </div>
  <span class="seg-label" id="lbl-v">Show</span>
  <div class="seg" aria-labelledby="lbl-v" data-group="view">
    <button aria-pressed="true" data-v="both">Side by side</button>
    <button aria-pressed="false" data-v="asbuilt">As-built</button>
    <button aria-pressed="false" data-v="proposed">Proposed</button>
  </div>
</div>
<main id="board"></main>

<script>
/* ── helpers ─────────────────────────────────────────────── */
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let uid = 0; const nid = (p) => `${p}-${++uid}`;

/* ── data (real product nouns; repo keys normalised per docs/credential-vault.md §3) ── */
const ACCOUNTS = [
  { id: "acc_g1", provider: "gemini", label: "personal" },
  { id: "acc_g2", provider: "gemini", label: "work" },
  { id: "acc_s1", provider: "soniox", label: "personal" },
  { id: "acc_o1", provider: "openai", label: "work" },
];
const acc = (id) => ACCOUNTS.find((a) => a.id === id);
const accName = (id) => (acc(id) ? `${acc(id).provider} / ${acc(id).label}` : "revoked account");
const REPO_DASH = "github.com/blackbelt-technology/pi-agent-dashboard";
const REPO_DECK = "github.com/robson/deck3d";
const DIR_VIDEO = "/Users/robson/Movies/video-feliratozas";
const BINDINGS = [
  { name: "GEMINI_API_KEY", def: "acc_g1" },
  { name: "SONIOX_API_KEY", def: "acc_s1" },
  { name: "OPENAI_API_KEY", def: undefined },
];
const GRANTS = [
  { subject: `repo:${REPO_DASH}`, binding: "GEMINI_API_KEY", state: "ok" },
  { subject: `repo:${REPO_DECK}`, binding: "GEMINI_API_KEY", account: "acc_g2", state: "ok" },
  { subject: `dir:hub:${DIR_VIDEO}`, binding: "SONIOX_API_KEY", state: "ok" },
  { subject: `dir:hub:${DIR_VIDEO}`, binding: "GEMINI_API_KEY", account: "acc_g2", state: "ok" },
];
const CONFIRMS = [
  { deviceId: "hub", dir: "/Users/robson/Project/pi-agent-dashboard", repoKey: REPO_DASH },
  { deviceId: "hub", dir: "/Users/robson/Project/pi-agent-dashboard/.worktrees/os-add-credential-vault", repoKey: REPO_DASH },
];
const PLUGINS = [{ pluginId: "demo", displayName: "Demo Plugin (fixture)", declared: ["POLY_PIZZA_KEY"] }];
const CANDIDATES = [
  { id: "skill-env:nano-banana-imagegen", label: "skill nano-banana-imagegen (.env)" },
  { id: "skill-env:video-transcription", label: "skill video-transcription (.env)" },
  { id: "system-one-auth", label: "system-one auth.json" },
];
const PROPOSAL = { items: ["GEMINI_API_KEY", "SONIOX_API_KEY", "ASSEMBLYAI_API_KEY"], skipped: [["PATH", "not a valid variable name"], ["DEBUG_TOKEN", "value shorter than 8 characters"]] };
const LIVE = [
  { kind: "repo", name: "pi-agent-dashboard", key: REPO_DASH, where: "2 sessions · this dashboard (hub)" },
  { kind: "repo", name: "deck3d", key: REPO_DECK, where: "1 session · this dashboard (hub)" },
  { kind: "dir", name: "video-feliratozas", key: DIR_VIDEO, where: "1 session · this dashboard (hub) · no git remote" },
  { kind: "dir", name: "edge-lab", key: "/home/robson/edge-lab", where: "1 session · mac-mini-iroda", blocked: "Sessions on other devices get no keys yet: remote delivery is off (transport-insecure)." },
];
const RECENT = [
  { kind: "repo", name: "compsychletter", key: "github.com/robson/compsychletter", where: "last seen 3 days ago · this dashboard (hub)" },
  { kind: "dir", name: "scratch", key: "/Users/robson/scratch", where: "last seen 9 days ago · this dashboard (hub)" },
];
const subjOf = (s) => s.startsWith("repo:") ? { kind: "repo", key: s.slice(5), name: s.slice(5).split("/").pop() }
  : { kind: "dir", key: s.split(":").slice(2).join(":"), device: s.split(":")[1], name: s.split("/").pop() };

/* ════════════ AS-BUILT (VaultSection + panels, 1:1) ════════════ */
const abHeader = () => `<div><h2 class="h2">Credential vault</h2>
  <p class="hint">Keys live on this dashboard. A key reaches a session only when its project is granted it, and the dashboard never shows a stored value again after you save it.</p>
  <p class="hint">Grants scope which sessions get a key; they are not a security boundary against code running in that project.</p></div>`;
const abPanel = (title, hint, body) => `<section class="space-2"><div><h3 class="p-title">${title}</h3>${hint ? `<p class="p-hint">${hint}</p>` : ""}</div>${body}</section>`;
const abErr = (e) => (e ? `<div role="alert" class="err-xs">${esc(e)}</div>` : "");
const abAccOpts = (sel) => `<option value="">no default</option>${ACCOUNTS.map((a) => `<option ${a.id === sel ? "selected" : ""}>${a.provider} / ${a.label}</option>`).join("")}`;

function abAccounts(o = {}) {
  const list = o.accounts ?? ACCOUNTS;
  return abPanel("Accounts", "Keys of at least 8 characters. You can keep several accounts per provider, for example personal and work.", `
    ${abErr(o.error)}
    <div class="list">${list.length === 0 ? `<div class="empty">No accounts yet.</div>` : list.map((a) => `<div class="row">
      <span class="xs tert">${a.provider}</span><span class="xs fw5 prim grow">${a.label}</span>
      ${o.rotating === a.id ? `<input type="password" aria-label="New value" value="••••••••••"><button class="btn">Save</button><button class="btn">Cancel</button>` : `<button class="btn">Rotate</button>`}
      <button class="dbtn">Revoke</button></div>`).join("")}</div>
    ${o.other ? `<p class="xs tert">${o.other} account(s) of another kind are kept and not shown here.</p>` : ""}
    <div class="form"><input placeholder="Provider (e.g. gemini)" aria-label="Provider (e.g. gemini)" ${o.prefill ? 'value="gemini"' : ""}><input placeholder="Label (e.g. personal)" aria-label="Label (e.g. personal)" ${o.prefill ? 'value="work"' : ""}>
      <input type="password" placeholder="Key" aria-label="Key" ${o.prefill ? 'value="AIzaSyD-ex"' : ""}><button class="btn" ${o.prefill ? "" : "disabled"}>Add account</button></div>`);
}
function abImport(o = {}) {
  return abPanel("Import keys", "Reads only what you select and never changes the source file. After importing, delete the original copies yourself.", `
    ${abErr(o.error)}
    ${o.done ? `<div class="ok-xs">Imported ${o.done} account(s). Remember to delete the original files.</div>` : ""}
    ${o.proposal ? `<div class="space-2"><div class="list">${PROPOSAL.items.map((n) => `<label class="row"><input type="checkbox" checked><span class="xs mono prim">${n}</span></label>`).join("")}
      ${PROPOSAL.skipped.map(([n, r]) => `<div class="row"><span class="xs mono tert">${n}</span><span class="xs tert">${r}</span></div>`).join("")}</div>
      <div class="form"><button class="btn">Import selected</button><button class="btn">Cancel</button></div></div>`
    : `<div class="space-2"><div class="list">${(o.noCandidates ? [] : CANDIDATES).length === 0 ? `<div class="empty">No known key files found.</div>` : CANDIDATES.map((c) => `<div class="row"><span class="xs sec grow">${c.label}</span><button class="btn">Review</button></div>`).join("")}</div>
      <label class="xs sec" style="display:flex;align-items:center;gap:8px">Or pick a .env / JSON file:<input type="file"></label></div>`}`);
}
function abBindings(o = {}) {
  const bs = o.bindings ?? BINDINGS, gs = o.grants ?? GRANTS, cs = o.confirms ?? CONFIRMS;
  return `<div class="space-6">${abErr(o.error)}
  ${abPanel("Environment bindings", "The variable a granted session sees, and the account it uses by default.", `
    <div class="list">${bs.length === 0 ? `<div class="empty">No bindings yet.</div>` : bs.map((b) => `<div class="row"><span class="xs mono prim">${b.name}</span>
      <select aria-label="Default account">${abAccOpts(b.def)}</select>${b.def ? "" : `<span class="warn-xs">needs an account</span>`}<button class="dbtn">Delete</button></div>`).join("")}</div>
    <div class="form"><input class="mono" placeholder="GEMINI_API_KEY" aria-label="Variable name" ${o.badName ? `value="${o.badName}"` : ""}><select aria-label="Default account">${abAccOpts()}</select><button class="btn" ${o.badName ? "" : "disabled"}>Add binding</button></div>`)}
  ${abPanel("Project grants", "Nothing is delivered to a project until you grant it. A repository grant also needs each checkout confirmed.", `
    <div class="list">${gs.length === 0 ? `<div class="empty">No grants yet. No project receives a key.</div>` : gs.map((g) => { const s = subjOf(g.subject); return `<div class="row">
      <span class="xs mono prim">${g.binding}</span><span class="xs tert">→</span><span class="xs sec grow" title="${s.key}">${s.kind === "repo" ? "repository" : "directory"} ${s.kind === "repo" ? s.key : `${s.device}:${s.key}`}</span>
      ${g.account ? `<span class="xs tert">${accName(g.account)}</span>` : ""}${g.state === "no-account" ? `<span class="warn-xs">no account: delivers nothing</span>` : ""}<button class="dbtn">Delete</button></div>`; }).join("")}</div>
    <div class="form"><select aria-label="Variable name"><option>binding…</option>${bs.map((b) => `<option>${b.name}</option>`).join("")}</select>
      <select aria-label="Project kind"><option ${o.dirForm ? "" : "selected"}>repository</option><option ${o.dirForm ? "selected" : ""}>directory</option></select>
      ${o.dirForm ? `<input placeholder="hub" aria-label="Device id" value="hub"><input class="mono" placeholder="/work/project" aria-label="directory">` : `<input class="mono" placeholder="github.com/acme/app" aria-label="Repository">`}
      <select aria-label="Account for this project"><option>binding default</option>${ACCOUNTS.map((a) => `<option>${a.provider} / ${a.label}</option>`).join("")}</select><button class="btn" disabled>Grant</button></div>`)}
  ${abPanel("Confirmed checkouts", "A repository grant is honoured only in a checkout you confirmed (from the session's Vault chip). Revoking one withdraws the values.", `
    <div class="list">${cs.length === 0 ? `<div class="empty">No confirmed checkouts.</div>` : cs.map((c) => `<div class="row"><span class="xs mono prim">${c.repoKey}</span><span class="xs tert grow" title="${c.dir}">${c.dir} @ ${c.deviceId}</span><button class="dbtn">Revoke</button></div>`).join("")}</div>`)}
  </div>`;
}
function abPlugins(o = {}) {
  return abPanel("Plugin access", "Plugins read the default account of a binding they declare, for the whole server rather than one project. Approve each declaration.", `
    <div class="list">${PLUGINS.flatMap((p) => p.declared.map((n) => `<div class="row"><span class="xs sec">${p.displayName}</span><span class="xs mono prim grow">${n}</span>
      <label class="chk"><input type="checkbox" ${o.approved ? "checked" : ""}>${o.approved ? "Approved" : "Not approved"}</label></div>`)).join("")}</div>`);
}
function abPage(o = {}) {
  return `<div class="ab space-6">${abHeader()}
    ${o.loadError ? `<div role="alert" class="err-sm">Couldn't load the vault: ${o.loadError}</div>` : ""}
    ${o.corrupt ? `<div role="alert" class="corrupt">The vault file is corrupt and writes are refused. A byte-exact backup was kept (/Users/robson/.pi/dashboard/vault.json.corrupt-1760339462). Sessions keep the values they already hold for a limited time.</div>` : ""}
    ${o.loading || o.loadError ? "" : `${o.only ? o.only : `${abAccounts(o.acc)}${abImport(o.imp)}${abBindings(o.bind)}${abPlugins(o.plug)}`}`}</div>`;
}

/* ════════════ PROPOSED ════════════ */
const pill = (tone, icon, text, attrs = "") => `<span class="pill ${tone}" ${attrs}>${icon ? ic(icon) : ""}${text}</span>`;
function prHeader(o = {}) {
  return `<div><h2 class="v-title">Credential vault</h2>
    <p class="v-lead">Keys live on this dashboard and are never shown again after you save them. A session gets a key only when its project is granted that key.</p>
    <ol class="flow" aria-label="How a key reaches a session">
      <li><span class="step">${ic("KeyVariant")}Account</span></li><li class="arrow" aria-hidden="true">${ic("ArrowRight")}</li>
      <li><span class="step">${ic("CogOutline")}Variable</span></li><li class="arrow" aria-hidden="true">${ic("ArrowRight")}</li>
      <li><span class="step">${ic("FolderOutline")}Project grant</span></li><li class="arrow" aria-hidden="true">${ic("ArrowRight")}</li>
      <li><span class="step">${ic("ShieldCheckOutline")}Session env</span></li>
    </ol>
    ${o.noNote ? "" : `<p class="p-meta" style="margin-top:6px">Grants decide which sessions get a key. They don't protect a key from other code running in that project.</p>`}</div>`;
}
function prTabs(active, counts = { v: BINDINGS.length, a: ACCOUNTS.length }) {
  const t = (id, label, icon, count) => `<button role="tab" class="tab" id="tab-${id}" aria-selected="${active === id}" tabindex="${active === id ? 0 : -1}" data-testid="vault-tab-${id}">${ic(icon)}${label}${count !== undefined ? `<span class="count">${count}</span>` : ""}</button>`;
  return `<div class="tabs" role="tablist" aria-label="Vault">${t("variables", "Variables", "CogOutline", counts.v)}${t("accounts", "Accounts", "KeyVariant", counts.a)}${t("import", "Import", "FileImportOutline")}</div>`;
}
const prPage = (tab, body, o = {}) => `<div class="v-page">${prHeader(o)}${tab ? prTabs(tab, o.counts) : ""}<div role="${tab ? "tabpanel" : "region"}" ${tab ? `aria-labelledby="tab-${tab}"` : 'aria-label="Vault"'} class="stack-3">${body}</div></div>`;
const prAccSelect = (id, sel, label, opts = {}) => `<select id="${id}" class="p-input" ${opts.invalid ? 'aria-invalid="true"' : ""}>
  ${opts.defaultLabel ? `<option>${opts.defaultLabel}</option>` : `<option value="" ${sel ? "" : "selected"}>No default account</option>`}
  ${ACCOUNTS.map((a) => `<option ${a.id === sel ? "selected" : ""}>${a.provider} / ${a.label}</option>`).join("")}</select>`;

/* grant row inside a variable card */
function prGrantRow(g, b, o = {}) {
  const s = subjOf(g.subject);
  const confirmed = s.kind === "repo" ? CONFIRMS.filter((c) => c.repoKey === s.key) : [];
  const usesAcc = g.account ? accName(g.account) : b.def ? `variable default (${accName(b.def)})` : "variable default (none)";
  let st, status;
  if (g.state === "no-account") { status = "no-account"; st = pill("error", "AlertCircleOutline", "No account: delivers nothing", 'data-testid="vault-grant-no-account"'); }
  else if (!g.account && !b.def) { status = "no-default"; st = pill("warning", "AlertOutline", "Delivers nothing until the variable has a default"); }
  else if (s.kind === "repo" && confirmed.length === 0) { status = "pending"; st = pill("warning", "ProgressClock", "Waiting for a checkout confirmation"); }
  else { status = "delivering"; st = pill("success", "CheckCircleOutline", "Delivering"); }
  return `<li class="grow-row" data-testid="vault-grant-row" data-state="${g.state}" data-status="${status}">${ic(s.kind === "repo" ? "SourceRepository" : "FolderOutline")}
    <div class="main"><div class="t">${esc(s.name)} ${st}</div>
      <div class="s">${s.kind === "repo" ? `Repository · ${esc(s.key)}` : `Folder on ${s.device === "hub" ? "this dashboard (hub)" : esc(s.device)} · ${esc(s.key)}`}</div>
      <div class="p-meta">Uses ${esc(usesAcc)}</div>
      ${g.state === "no-account" ? `<div class="btn-row" style="margin-top:6px"><label class="sr-only" for="fix-${b.name}">Account for ${esc(s.name)}</label>${prAccSelect(`fix-${b.name}`, "", "", { defaultLabel: "Choose an account…" }).replace('class="p-input"', 'class="p-input" style="width:auto;min-height:32px"')}<button class="p-btn sm secondary">Use variable default</button></div>` : ""}
      ${s.kind === "repo" ? (confirmed.length ? `<details class="co" ${o.openCheckouts ? "open" : ""}><summary>${ic("ChevronRight")}${confirmed.length} confirmed checkout${confirmed.length === 1 ? "" : "s"}</summary>
        <ul class="checkouts">${confirmed.map((c) => `<li><code>${esc(c.dir)}</code><span>on this dashboard (hub)</span><button class="p-btn sm ghost" aria-label="Revoke checkout ${esc(c.dir)}">Revoke</button></li>`).join("")}</ul></details>`
        : `<div class="p-meta" style="margin-top:4px">Open a session in a checkout of this repository and confirm it from the session's Vault chip.</div>`) : ""}
    </div>
    <div class="acts"><button class="p-btn sm ghost" aria-label="Remove ${esc(b.name)} from ${esc(s.name)}">${ic("Close")}Remove</button></div></li>`;
}
function prVarCard(b, o = {}) {
  const gs = (o.grants ?? GRANTS).filter((g) => g.binding === b.name);
  const plug = PLUGINS.filter((p) => p.declared.includes(b.name));
  const sel = nid("def");
  return `<article class="vcard" data-testid="vault-binding-${b.name}" aria-label="${b.name}">
    <header><span class="vname">${b.name}</span>
      ${b.def ? "" : pill("warning", "AlertOutline", "No default account", 'data-testid="vault-binding-repair"')}
      <div class="acts"><button class="p-btn sm ghost" aria-label="Delete variable ${b.name}">${ic("TrashCanOutline")}Delete</button></div></header>
    <div class="vbody">
      ${o.confirmDelete ? `<div class="callout warning" role="alertdialog" aria-labelledby="del-${b.name}" data-testid="vault-confirm-impact">${ic("AlertOutline")}<div class="body"><strong id="del-${b.name}">Delete ${b.name}?</strong>
        <ul class="impact"><li>Removes it from ${gs.length} project${gs.length === 1 ? "" : "s"}: ${gs.map((g) => esc(subjOf(g.subject).name)).join(", ")}.</li><li>Removes ${plug.length} plugin approval${plug.length === 1 ? "" : "s"}.</li><li>Connected sessions lose it within seconds. Processes already running keep the old value.</li></ul>
        <div class="btn-row"><button class="p-btn sm danger">${ic("TrashCanOutline")}Delete variable</button><button class="p-btn sm secondary">Cancel</button></div></div></div>` : ""}
      <div class="vfield"><label class="p-label" for="${sel}">Default account</label>${prAccSelect(sel, b.def)}
        <p class="p-meta">Used by every project below that doesn't pick its own account.</p></div>
      <div><h4 class="sec-title">${ic("FolderOutline")}Projects (${gs.length})</h4>
        ${gs.length ? `<ul class="glist" style="margin-top:6px">${gs.map((g) => prGrantRow(g, b, o)).join("")}</ul>` : `<p class="p-help" style="margin:6px 0 0">No project gets this variable yet.</p>`}
        ${o.picker ? `<div style="margin-top:8px">${o.picker}</div>` : `<button class="p-btn sm secondary" style="margin-top:8px">${ic("Plus")}Grant to a project</button>`}</div>
      ${plug.length ? `<div><h4 class="sec-title">${ic("PuzzleOutline")}Plugins</h4>${plug.map((p) => prPluginRow(p, b.name, o.approved)).join("")}</div>` : ""}
    </div></article>`;
}
function prPluginRow(p, name, on) {
  return `<div class="grow-row" style="margin-top:6px" data-testid="vault-plugin-${p.pluginId}-${name}">${ic("PuzzleOutline")}<div class="main"><div class="t">${esc(p.displayName)}</div>
    <div class="p-meta">Reads the default account of <code>${name}</code> for the whole server, not one project.</div></div>
    <div class="acts"><label class="switch"><input type="checkbox" role="switch" class="sw-input" data-testid="vault-plugin-approve" ${on ? "checked" : ""}><span class="track" aria-hidden="true"></span>${on ? "Approved" : "Not approved"}</label></div></div>`;
}

/* project picker — the two data sources under decision D2 */
function prOpt(p, checked, group) {
  const id = nid("pp"), off = p.blocked || p.granted;
  return `<label class="opt" for="${id}" ${off ? 'aria-disabled="true"' : ""}><input type="radio" name="${group}" id="${id}" ${checked ? "checked" : ""} ${off ? "disabled" : ""}>
    <div class="main"><div class="t">${ic(p.kind === "repo" ? "SourceRepository" : "FolderOutline")}${esc(p.name)}${p.granted ? pill("neutral", "Check", "Already granted") : ""}</div>
      <div class="s">${esc(p.key)}</div><div class="why">${esc(p.where)}</div>${p.blocked ? `<div class="why">${ic("LockOutline")} ${esc(p.blocked)}</div>` : ""}</div></label>`;
}
function prPicker(o = {}) {
  const b = BINDINGS.find((x) => x.name === (o.binding ?? "SONIOX_API_KEY"));
  const isGranted = (p) => GRANTS.some((g) => g.binding === b.name && subjOf(g.subject).key === p.key);
  const live = LIVE.map((p) => ({ ...p, granted: isGranted(p) }));
  const search = nid("ps"), acct = nid("pa"), grp = nid("proj");
  return `<div class="picker" role="group" aria-label="Grant ${b.name} to a project" data-testid="vault-grant-picker">
    ${o.manual ? prManual() : `<div><label class="p-label" for="${search}">Project</label><input id="${search}" class="p-input" type="search" placeholder="Search by name, repository or folder"></div>
    <fieldset><legend>Open sessions on this dashboard</legend>${live.map((p) => prOpt(p, p.name === "deck3d", grp)).join("")}</fieldset>
    ${o.recent ? `<fieldset><legend>Seen recently (remembered by this dashboard)</legend>${RECENT.map((p) => prOpt(p, false, grp)).join("")}</fieldset>` : ""}
    <button class="p-linkc">Not listed? Enter a repository or folder</button>`}
    <div class="vfield"><label class="p-label" for="${acct}">Account for this project</label>${prAccSelect(acct, "", "", { defaultLabel: `Variable default (${accName(b.def)})` })}</div>
    ${o.manual ? "" : `<div class="callout info">${ic("InformationOutline")}<div class="body">deck3d is a repository. Its sessions get the key after you confirm each checkout from the session's Vault chip.</div></div>`}
    <div class="btn-row"><button class="p-btn primary">${ic("Check")}Grant ${b.name}</button><button class="p-btn secondary">Cancel</button></div></div>`;
}
function prManual() {
  const r = nid("mr"), d = nid("md"), dv = nid("mdv");
  return `<div><span class="p-label" id="mk">Project kind</span><div class="seg2" role="group" aria-labelledby="mk"><button aria-pressed="true">Repository</button><button aria-pressed="false">Folder</button></div></div>

function accUsage(a) {

  if (defs.length) parts.push(`Default for ${defs.map((d) => `<code>${d}</code>`).join(", ")}`);
  if (ov.length) parts.push(`${parts.length ? "chosen" : "Chosen"} by ${ov.length} project${ov.length === 1 ? "" : "s"}`);
  return parts.length ? parts.join(" · ") : "Not used by any variable";
}

    <div class="pair"><div class="col asbuilt"><p class="tag">As-built</p><div class="frame">${ab}</div></div>

</section>`).join("");

/* ── toolbar ─────────────────────────────────────────────── */
const html = document.documentElement;
function apply(group, v) {
  if (group === "theme") {
    const [pal, mode] = v.split("-");
    mode === "light" ? html.setAttribute("data-theme", "light") : html.removeAttribute("data-theme");
    pal === "nord" ? html.setAttribute("data-palette", "nord") : html.removeAttribute("data-palette");
  }
  if (group === "width") document.body.style.setProperty("--frame-w", v === "1440" ? "100%" : `${v}px`);
  if (group === "view") document.body.dataset.view = v;
}
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  apply(seg.dataset.group, b.dataset.v);
}));
const params = new URLSearchParams(location.search);
for (const g of ["theme", "width", "view"]) if (params.get(g)) document.querySelector(`.seg[data-group="${g}"] button[data-v="${params.get(g)}"]`)?.click();
</script>
