<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vault LLM delivery — UX board (add-vault-llm-delivery 7.0)</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mockup.css" />
<link rel="stylesheet" href="vault.css" />
<link rel="stylesheet" href="llm.css" />
<script src="icons.js"></script>
</head>
<body data-view="both">
<div class="toolbar" role="toolbar" aria-label="Board controls">
  <h1>Vault: sign-in accounts and model providers (proposed)</h1>
  <span class="seg-label" id="lbl-theme">Theme</span>
  <div class="seg" aria-labelledby="lbl-theme" data-group="theme">
    <button aria-pressed="true" data-v="base-dark">Base dark</button>
    <button aria-pressed="false" data-v="base-light">Base light</button>
    <button aria-pressed="false" data-v="nord-dark">Nord dark</button>
  </div>
  <span class="seg-label" id="lbl-w">Frame</span>
  <div class="seg" aria-labelledby="lbl-w" data-group="width">
    <button aria-pressed="false" data-v="375">375</button>
    <button aria-pressed="false" data-v="768">768</button>
    <button aria-pressed="true" data-v="1440">1440</button>
  </div>
  <span class="seg-label" id="lbl-v">Show</span>
  <div class="seg" aria-labelledby="lbl-v" data-group="view">
    <button aria-pressed="true" data-v="both">Mockup + UX notes</button>
    <button aria-pressed="false" data-v="proposed">Mockup only</button>
  </div>
  <a class="p-link" href="providers.html" style="margin-left:auto">Providers board →</a>
  <a class="p-link" href="../../add-vault-reach-all-projects/mockups/reach.html">Reach board →</a>
</div>
<main id="board"></main>

<script>
/* ── helpers (same recipes as retro-ux-credential-vault/vault.html, which shipped as VaultSection) ── */
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let uid = 0; const nid = (p) => `${p}-${++uid}`;
const pill = (tone, icon, text, attrs = "") => `<span class="pill ${tone}" ${attrs}>${icon ? ic(icon) : ""}${text}</span>`;

/* ── data: real provider ids; account labels follow the vault docs (personal / work) ── */
const KEY_ACCOUNTS = [
  { id: "acc_g1", provider: "gemini", label: "personal", usage: "Default for <code>GEMINI_API_KEY</code>, <code>google</code>" },
  { id: "acc_o1", provider: "openai", label: "work", usage: "Default for <code>OPENAI_API_KEY</code>" },
];
const OAUTH = {
  oa_p: { id: "oa_p", provider: "anthropic", label: "personal", backend: "link", ident: "ro•••@gmail.com", exp: "token valid 47 min", refresh: "refreshed by pi on this dashboard" },
  oa_w: { id: "oa_w", provider: "anthropic", label: "work", backend: "vault", ident: "ro•••@blackbelt.hu", exp: "token valid 38 min", refresh: "last refresh 08:52 OK" },
  oa_c: { id: "oa_c", provider: "openai-codex", label: "team", backend: "vault", ident: null, reauth: true },
};
const oName = (id) => `${OAUTH[id].provider} / ${OAUTH[id].label}`;
const REPO_DASH = "github.com/blackbelt-technology/pi-agent-dashboard";
const REPO_DECK = "github.com/robson/deck3d";
const DIR_VIDEO = "/Users/robson/Movies/video-feliratozas";

const DELIVERY = {
  lease: { label: "Short-lived token", icon: "TimerSand", tech: "lease",
    s: "The session gets a token that lasts up to 1 hour. The dashboard renews it. The sign-in itself never leaves this dashboard.",
    caveat: "After you revoke access, a token already handed out keeps working until it expires (at most 1 hour). For your own devices." },
  proxy: { label: "Through this dashboard", icon: "LanConnect", tech: "proxy",
    s: "Requests go through this dashboard. No token or key reaches the session, and revoking takes effect immediately.",
    caveat: "Every request takes an extra hop through this dashboard." },
  key: { label: "API key", icon: "KeyVariant", tech: "key",
    s: "The session gets the key itself, in memory only. It is never written to pi's files on that machine.",
    caveat: "" },
};
const modePill = (d) => pill("neutral", DELIVERY[d].icon, DELIVERY[d].label, `title="delivery: ${DELIVERY[d].tech}"`);

/* ── page chrome (shipped VaultSection) ── */
function header() {
  return `<div><h2 class="v-title">Credential vault</h2>
    <p class="v-lead">Keys and sign-ins live on this dashboard and are never shown again after you save them. A session gets one only when its project is granted it.</p></div>`;
}
function tabs(active, counts) {
  const t = (id, label, icon, count) => `<button role="tab" class="tab" id="tab-${id}-${uid}" aria-selected="${active === id}" tabindex="${active === id ? 0 : -1}" data-testid="vault-tab-${id}">${ic(icon)}${label}${count !== undefined ? `<span class="count">${count}</span>` : ""}</button>`;
  return `<div class="tabs" role="tablist" aria-label="Vault">${t("accounts", "Accounts", "KeyVariant", counts?.a ?? 5)}${t("variables", "Variables", "CogOutline", counts?.v ?? 5)}${t("import", "Import", "FileImportOutline")}</div>`;
}
const page = (tab, body, o = {}) => `<div class="v-page">${header()}${tabs(tab, o.counts)}<div role="tabpanel" class="stack-3">${body}</div></div>`;

/* ════════════ ACCOUNTS TAB ════════════ */
function keySection() {
  return `<div class="grp"><div class="toolbar-row"><h4 class="sec-title">${ic("KeyVariant")}Keys</h4><button class="p-btn sm secondary">${ic("Plus")}Add key</button></div>
    <ul class="glist" style="margin-top:6px">${KEY_ACCOUNTS.map((a) => `<li class="grow-row" data-testid="vault-account-${a.id}">${ic("KeyVariant")}<div class="main">
      <div class="t">${a.label} ${pill("neutral", "", a.provider)}</div><div class="p-meta">${a.usage}</div></div>
      <div class="acts"><button class="p-btn sm secondary" aria-label="Rotate ${a.provider} / ${a.label}">${ic("Autorenew")}Rotate</button><button class="p-btn sm ghost" aria-label="Revoke ${a.provider} / ${a.label}">${ic("TrashCanOutline")}Revoke</button></div></li>`).join("")}</ul></div>`;
}
function oauthRow(a, o = {}) {
  const linked = a.backend === "link";
  const backend = linked ? pill("info", "LinkVariant", "Linked pi login") : pill("neutral", "ShieldKeyOutline", "Stored in vault");
  let status = "";
  if (a.reauth) status = pill("error", "AlertCircleOutline", "Needs sign-in", 'data-testid="vault-oauth-status" data-status="needs-reauth"');
  else if (o.identityChanged && a.id === "oa_p") status = pill("warning", "AccountSwitchOutline", "Different account signed in", 'data-testid="vault-oauth-status" data-status="identity-changed"');
  else status = pill("success", "CheckCircleOutline", "Signed in", 'data-testid="vault-oauth-status" data-status="ok"');
  const usage = { oa_p: "Default for <code>anthropic</code> · in pool <code>anthropic-pool</code>", oa_w: "Default for <code>anthropic-work</code> · chosen by 1 project · primary of <code>anthropic-pool</code>", oa_c: "Default for <code>openai-codex</code> · delivers nothing until you sign in again" }[a.id];
  const meta = a.reauth ? "The dashboard couldn't save a renewed sign-in. Sign in again to resume." : `${a.exp} · ${a.refresh}`;
  const acts = a.reauth ? `<button class="p-btn sm primary" aria-label="Sign in again to ${oName(a.id)}">${ic("Login")}Sign in again</button>`
    : linked ? `<button class="p-btn sm ghost" aria-label="Unlink ${oName(a.id)}">${ic("LinkVariantOff")}Unlink</button>`
    : `<button class="p-btn sm secondary" aria-label="Sign in again to ${oName(a.id)}">${ic("Login")}Sign in again</button><button class="p-btn sm ghost" aria-label="Revoke ${oName(a.id)}">${ic("TrashCanOutline")}Revoke</button>`;
  let extra = "";
  if (o.identityChanged && a.id === "oa_p") extra = `<div class="callout warning" role="alert" style="margin-top:6px" data-testid="vault-identity-changed">${ic("AccountSwitchOutline")}<div class="body"><strong>pi on this dashboard is now signed in as a different Anthropic account.</strong>
      This link was made for <code>ro•••@gmail.com</code>; the login is now <code>an•••@gmail.com</code>. <code>anthropic</code> delivers nothing to sessions until you decide.
      <div class="btn-row"><button class="p-btn sm primary">${ic("Check")}Use the new account for "personal"</button><button class="p-btn sm secondary">${ic("LinkVariantOff")}Unlink</button></div></div></div>`;
  if (o.unlinking && a.id === "oa_p") extra = `<div class="callout warning" role="alertdialog" aria-labelledby="ul-h" style="margin-top:6px" data-testid="vault-confirm-impact">${ic("AlertOutline")}<div class="body"><strong id="ul-h">Unlink anthropic / personal?</strong>
      <ul class="impact"><li><code>anthropic</code> loses its default. Its 1 project delivers nothing until you pick another account.</li>
      <li><code>anthropic-pool</code> drops this member and keeps <strong>work</strong>.</li>
      <li>Sessions stop renewing within seconds. A token already handed out keeps working until it expires, at most 47 min from now.</li>
      <li>Your pi login itself is not touched: <code>~/.pi/agent/auth.json</code> stays as it is, and pi on this dashboard keeps using it.</li></ul>
      <div class="btn-row"><button class="p-btn sm secondary" data-initial-focus>Cancel</button><button class="p-btn sm danger">${ic("LinkVariantOff")}Unlink</button></div></div></div>`;
  return `<li class="grow-row" data-testid="vault-account-${a.id}" data-backend="${a.backend}">${ic(linked ? "LinkVariant" : "AccountKeyOutline")}<div class="main">
    <div class="t">${a.label} ${pill("neutral", "", a.provider)} ${backend} ${status}</div>
    <div class="p-meta">${usage}</div><div class="p-meta">${meta}${a.ident ? ` · ${a.ident}` : ""}</div>${extra}</div>
    ${o.unlinking && a.id === "oa_p" ? "" : `<div class="acts">${acts}</div>`}</li>`;
}
function signinSection(o = {}) {
  return `<div class="grp" data-testid="vault-accounts-signin"><div class="toolbar-row"><h4 class="sec-title">${ic("AccountKeyOutline")}Sign-in accounts</h4>
      <button class="p-btn sm secondary" aria-expanded="${!!o.add}" data-testid="vault-signin-new">${ic("Plus")}Add sign-in account</button></div>
    <p class="p-help" style="margin:4px 0 0">Subscription logins such as Claude Pro or ChatGPT. You can keep several per provider. Tokens are never shown.</p>
    ${o.add ?? ""}
    <ul class="glist" style="margin-top:6px">${Object.values(o.accounts ?? OAUTH).map((a) => oauthRow(a, o)).join("")}</ul></div>`;
}
const accountsTab = (o = {}) => page("accounts", `${o.first ?? ""}${keySection()}${signinSection(o)}`);

/* add sign-in account: choose link vs sign in */
function addChoice(sel = "link") {
  const r1 = nid("ch"), r2 = nid("ch");
  return `<form class="inset stack-3" onsubmit="return false" style="margin-top:8px" data-testid="vault-signin-form">
    <fieldset style="border:0;padding:0;margin:0"><legend class="p-label">What do you want to add?</legend>
    <label class="opt" for="${r1}"><input type="radio" name="${r1}g" id="${r1}" ${sel === "link" ? "checked" : ""}><div class="main">
      <div class="t">${ic("LinkVariant")}Link this dashboard's pi login</div>
      <div class="why">Uses the login pi already has here. Nothing is copied, and pi keeps refreshing it as it does today.</div>
      <div class="why">Available: <strong>openai-codex</strong> (signed in as ro•••@blackbelt.hu). Already linked: anthropic.</div></div></label>
    <label class="opt" for="${r2}"><input type="radio" name="${r1}g" id="${r2}" ${sel === "enrol" ? "checked" : ""}><div class="main">
      <div class="t">${ic("Login")}Sign in to another account</div>
      <div class="why">For a second account of a provider, for example a work Claude subscription next to your personal one. The dashboard keeps and renews it; pi's own login is not changed.</div></div></label></fieldset>
    ${sel === "link" ? linkFields() : enrolFields()}
    </form>`;
}
function linkFields() {
  const p = nid("lp"), l = nid("ll");
  return `<div class="form-grid">
      <div><label class="p-label" for="${p}">pi login</label><select id="${p}" class="p-input"><option>openai-codex</option><option disabled>anthropic (already linked as personal)</option></select></div>
      <div><label class="p-label" for="${l}">Label</label><input id="${l}" class="p-input" value="personal"></div>
      <p class="p-meta full">${ic("InformationOutline")} openai-codex doesn't tell the dashboard which account is signed in. If someone later signs pi in with a different account, this link follows it without warning.</p>
      <div class="btn-row full"><button class="p-btn primary">${ic("LinkVariant")}Link login</button><button class="p-btn secondary">Cancel</button></div></div>`;
}
function enrolFields(o = {}) {
  const p = nid("ep"), l = nid("el");
  return `<div class="form-grid">
      <div><label class="p-label" for="${p}">Provider</label><select id="${p}" class="p-input"><option>anthropic</option><option>openai-codex</option><option>github-copilot</option></select></div>
      <div><label class="p-label" for="${l}">Label</label><input id="${l}" class="p-input" value="${o.label ?? "client-x"}" aria-describedby="${l}-h"><p id="${l}-h" class="p-meta" style="margin-top:4px">How you tell this account apart, for example work.</p></div>
      <div class="btn-row full"><button class="p-btn primary">${ic("OpenInNew")}Continue to sign-in</button><button class="p-btn secondary">Cancel</button></div></div>`;
}
function enrolWaiting() {
  return `<div class="inset stack-3" style="margin-top:8px" role="status" aria-live="polite" data-testid="vault-enrol-pending">
    <div class="signin-wait"><span class="spin" aria-hidden="true">${ic("Refresh")}</span><div><strong style="font-size:14px">Waiting for you to sign in to Anthropic…</strong>
      <div class="p-meta">Account "client-x". A sign-in page opened in a new tab. Finish there; this updates on its own.</div></div></div>
    <div class="btn-row"><button class="p-btn sm secondary">${ic("OpenInNew")}Open the sign-in page again</button><button class="p-btn sm secondary">${ic("ContentCopy")}Copy link</button><button class="p-btn sm ghost">Cancel</button></div>
    <p class="p-meta">Use the account you want stored as "client-x". To keep using your current login, cancel and link it instead.</p></div>`;
}
function enrolNoIdentity() {
  const n = nid("ni"), r = nid("ni"), c = nid("ack");
  return `<div class="callout warning" role="alertdialog" aria-labelledby="${n}-h" aria-describedby="${n}-d" style="margin-top:8px" data-testid="vault-enrol-warning">${ic("ShieldAlertOutline")}<div class="body">
    <strong id="${n}-h">Is this a new account?</strong>
    <p id="${n}-d" style="margin:4px 0">openai-codex doesn't tell the dashboard which account you signed in with, so it can't check for duplicates.</p>
    <fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">This sign-in is</legend>
      <label class="chk" for="${n}"><input type="radio" name="${n}g" id="${n}" checked><span>A new account, labelled <strong>client-x</strong></span></label>
      <label class="chk" for="${r}"><input type="radio" name="${n}g" id="${r}"><span>It replaces <strong>openai-codex / team</strong></span></label></fieldset>
    <p style="margin:8px 0 4px"><strong>If this is the account pi is already signed in with here</strong> (linked as "personal"), two parties would renew the same login. OpenAI can then revoke it, and both pi and the vault get signed out.</p>
    <label class="chk" for="${c}"><input type="checkbox" id="${c}" data-testid="vault-enrol-ack"><span>It's not the account pi uses here. I understand the risk.</span></label>
    <div class="btn-row"><button class="p-btn sm secondary" data-initial-focus>Cancel</button><button class="p-btn sm primary" disabled aria-disabled="true">Save account</button></div>
    <p class="p-meta">Your confirmation is recorded in the vault log.</p></div></div>`;
}
function enrolRefused() {
  return `<div class="callout error" role="alert" style="margin-top:8px" data-testid="vault-enrol-refused">${ic("AlertCircleOutline")}<div class="body">
    <strong>That's the account already linked as anthropic / personal.</strong> The sign-in was not saved: storing it twice would mean two renewals of one login, and Anthropic can revoke both.
    <div class="btn-row"><button class="p-btn sm secondary">${ic("Login")}Sign in with a different account</button><button class="p-btn sm ghost">Close</button></div>
    <p class="p-meta">To use "personal" in a project, grant <code>anthropic</code>. It already uses that account.</p></div></div>`;
}
function enrolReplaced() {
  return `<div class="callout info" role="status" style="margin-top:8px">${ic("CheckCircleOutline")}<div class="body"><strong>Signed in again as anthropic / work.</strong> It's the same account, so its grants are unchanged. Sessions get a fresh token within seconds.</div></div>`;
}

/* ════════════ VARIABLES TAB ════════════ */
const ENV = [{ name: "GEMINI_API_KEY", def: "gemini / personal", n: 2 }, { name: "OPENAI_API_KEY", def: "openai / work", n: 1 }];
function envCollapsed() {
  return `<div class="grp"><h4 class="sec-title">${ic("CogOutline")}Environment variables (${ENV.length})</h4>
    <ul class="glist" style="margin-top:6px">${ENV.map((e) => `<li class="grow-row">${ic("CogOutline")}<div class="main"><div class="t"><code>${e.name}</code></div><div class="p-meta">Default ${e.def} · ${e.n} project${e.n === 1 ? "" : "s"}</div></div></li>`).join("")}</ul>
    <p class="board-note" style="margin-top:6px"><strong>Board note:</strong> env cards are unchanged from the shipped page and are collapsed here so the board focuses on the new cards.</p></div>`;
}
function grantRow(g) {
  const isRepo = g.kind === "repo";
  return `<li class="grow-row" data-testid="vault-grant-row" data-status="${g.status ?? "delivering"}">${ic(isRepo ? "SourceRepository" : "FolderOutline")}
    <div class="main"><div class="t">${esc(g.name)} ${g.pill ?? pill("success", "CheckCircleOutline", "Delivering")}</div>
      <div class="s">${isRepo ? `Repository · ${esc(g.key)}` : `Folder on this dashboard (hub) · ${esc(g.key)}`}</div>
      <div class="p-meta">${g.uses}</div>${g.extra ?? ""}</div>
    ${g.noRemove ? "" : `<div class="acts"><button class="p-btn sm ghost" aria-label="Remove from ${esc(g.name)}">${ic("Close")}Remove</button></div>`}</li>`;
}
function llmCard(b, o = {}) {
  const sel = nid("def");
  const kindPill = pill("neutral", "Brain", "Model provider");
  const clone = b.base ? `<span class="ident">second name for <code>${b.base}</code></span>` : "";
  return `<article class="vcard" data-testid="vault-binding-${b.name}" data-target="llm" aria-label="${b.name} model provider">
    <header><span class="vname">${b.name}</span>${kindPill}${clone}${b.headPill ?? ""}
      <div class="acts"><button class="p-btn sm ghost" aria-label="Delete ${b.name}">${ic("TrashCanOutline")}Delete</button></div></header>
    <div class="vbody">
      ${b.banner ?? ""}
      <div class="vfield"><span class="p-label">Delivery</span><div class="modeline">${modePill(b.delivery)}${b.mode === "pool" ? pill("neutral", "SwapHorizontal", "Pool of " + b.members.length) : ""}<button class="p-btn sm ghost">${ic("CogOutline")}Change</button></div>
        <p class="p-meta">${DELIVERY[b.delivery].s}${DELIVERY[b.delivery].caveat ? ` ${DELIVERY[b.delivery].caveat}` : ""}</p></div>
      ${b.mode === "pool" ? poolBlock(b, o) : `<div class="vfield"><label class="p-label" for="${sel}">Default account</label>
        <select id="${sel}" class="p-input">${b.accOpts.map((x) => `<option ${x === b.def ? "selected" : ""}>${x}</option>`).join("")}</select>
        <p class="p-meta">${b.defHelp ?? "Used by every project below that doesn't pick its own account."}</p></div>`}
      <div><h4 class="sec-title">${ic("FolderOutline")}Projects (${b.grants.length})</h4>
        ${b.grants.length ? `<ul class="glist" style="margin-top:6px">${b.grants.map(grantRow).join("")}</ul>` : `<p class="p-help" style="margin:6px 0 0">No project gets this provider yet.</p>`}
        ${o.removeConfirm ?? `<button class="p-btn sm secondary" style="margin-top:8px">${ic("Plus")}Grant to a project</button>`}</div>
    </div></article>`;
}
function poolBlock(b, o = {}) {
  const sw = nid("fo");
  const on = o.failover === "on";
  return `<div class="vfield"><span class="p-label" id="${sw}-l">Accounts, in order</span>
    <ol class="pool" aria-labelledby="${sw}-l">${b.members.map((m, i) => `<li><span class="n" aria-hidden="true">${i + 1}</span><span class="t">${m.label}</span>${i === 0 ? pill("info", "", "Primary") : ""}${m.state ?? ""}
      <span class="acts"><button class="p-btn sm ghost icon" aria-label="Move ${m.label} up" ${i === 0 ? "disabled" : ""}>${ic("ArrowUp")}</button><button class="p-btn sm ghost icon" aria-label="Move ${m.label} down" ${i === b.members.length - 1 ? "disabled" : ""}>${ic("ArrowDown")}</button></span></li>`).join("")}</ol>
    <p class="p-meta">Projects can't pick their own account in a pool; they all use this order.</p></div>
    <div class="vfield"><span class="p-label">Failover</span>
      <div><label class="switch" for="${sw}"><input type="checkbox" role="switch" class="sw-input" id="${sw}" ${on ? "checked" : ""} data-testid="vault-pool-failover"><span class="track" aria-hidden="true"></span>${on ? "On" : "Off"}</label>
      <p class="p-meta">${on ? "When the account in use is rate-limited before it answers, the request moves to the next account. Turned on 09:02 by robson; the provider-terms notice was accepted."
        : "Off: only <strong>work</strong> (the primary) is used. Turn on to move a rate-limited request to the next account."}</p>
      ${o.ack ?? ""}${o.lastFailover ?? ""}</div></div>`;
}
const ANTHROPIC = { name: "anthropic", delivery: "lease", mode: "single", def: "anthropic / personal (linked)", accOpts: ["anthropic / personal (linked)", "anthropic / work"],
  grants: [{ kind: "repo", name: "pi-agent-dashboard", key: REPO_DASH, uses: "Uses variable default (anthropic / personal)" },
    { kind: "repo", name: "deck3d", key: REPO_DECK, uses: "Uses anthropic / work (chosen for this project)" }] };
const ANTHROPIC_WORK = { name: "anthropic-work", base: "anthropic", delivery: "proxy", mode: "single", def: "anthropic / work", accOpts: ["anthropic / personal (linked)", "anthropic / work"],
  grants: [{ kind: "dir", name: "video-feliratozas", key: DIR_VIDEO, uses: "Uses variable default (anthropic / work)" }] };
const GOOGLE = { name: "google", delivery: "key", mode: "single", def: "gemini / personal", accOpts: ["gemini / personal"], defHelp: "Same key as <code>GEMINI_API_KEY</code>. Rotating it updates both.",
  grants: [{ kind: "repo", name: "pi-agent-dashboard", key: REPO_DASH, uses: "Uses variable default (gemini / personal)" }] };
const POOL = { name: "anthropic-pool", base: "anthropic", delivery: "proxy", mode: "pool", members: [{ label: "work" }, { label: "personal" }],
  grants: [{ kind: "repo", name: "deck3d", key: REPO_DECK, uses: "Uses the pool: work first" }] };

function llmGroup(cards, o = {}) {
  return `<div class="grp"><div class="toolbar-row"><h4 class="sec-title">${ic("Brain")}Model providers (${cards.length})</h4>
      <button class="p-btn sm secondary" aria-expanded="${!!o.form}">${ic("Plus")}New model provider</button></div>
    <p class="p-help" style="margin:4px 0 0">Which account pi uses for a provider in a project. A session that has its own login for a provider keeps it.</p>

/* new model provider form */
function deliveryOpts(o) {
  const g = nid("dl");
  const opt = (d, extra = {}) => {
    const id = nid("do"); const off = !!extra.off;
    return `<label class="opt" for="${id}" ${off ? 'aria-disabled="true"' : ""}><input type="radio" name="${g}" id="${id}" ${extra.checked ? "checked" : ""} ${off ? "disabled" : ""} ${off ? `aria-describedby="${id}-w"` : ""}>
      <div class="main"><div class="t">${ic(DELIVERY[d].icon)}${DELIVERY[d].label}${extra.badge ?? ""}</div><div class="why">${DELIVERY[d].s}</div>
      ${DELIVERY[d].caveat && !off ? `<div class="why">${DELIVERY[d].caveat}</div>` : ""}${off ? `<div class="why" id="${id}-w">${ic("LockOutline")} ${extra.off}</div>` : ""}</div></label>`;
  };
  return `<fieldset style="border:0;padding:0;margin:0" class="full"><legend class="p-label">How sessions use it</legend>${o.opts.map(([d, e]) => opt(d, e)).join("")}${o.after ?? ""}</fieldset>`;
}
function newLlmForm(o = {}) {
  const p = nid("np"), n = nid("nn"), a = nid("na"), m = nid("nm"), cl = nid("cl");

    <div><label class="p-label" for="${p}">Provider</label><select id="${p}" class="p-input"><option ${o.provider === "anthropic" ? "selected" : ""}>anthropic</option><option ${o.provider === "openai-codex" ? "selected" : ""}>openai-codex</option><option>google</option><option>openai</option></select></div>
    <div><label class="p-label" for="${a}">Account</label><select id="${a}" class="p-input">${(o.accounts ?? ["anthropic / work"]).map((x) => `<option>${x}</option>`).join("")}</select></div>
    <label class="chk full" for="${cl}"><input type="checkbox" id="${cl}" ${o.clone ? "checked" : ""}><span>Give it a second name, so this account works next to another <code>${o.provider ?? "anthropic"}</code> account</span></label>
    ${o.clone ? `<div class="full"><label class="p-label" for="${n}">Name sessions see</label><input id="${n}" class="p-input mono" value="${o.cloneName ?? "anthropic-work"}" ${o.cloneErr ? `aria-invalid="true" aria-describedby="${n}-e"` : `aria-describedby="${n}-h"`}>
      ${o.cloneErr ? `<p id="${n}-e" class="p-meta sev-fg-error" role="alert" style="margin-top:4px">${ic("AlertCircleOutline")} <code>${o.cloneName}</code> is an existing provider, so the name would hide it. Use something like <code>anthropic-work</code>.</p>`
        : `<p id="${n}-h" class="p-meta" style="margin-top:4px">Lowercase letters, digits and dashes. Models appear in pi as <code>anthropic-work/claude-sonnet-4-5</code>.</p>`}</div>` : ""}
    ${deliveryOpts(o)}
    ${o.pool ? `<label class="chk full" for="${m}"><input type="checkbox" id="${m}" checked><span>Use several accounts in order (a pool). Only available through this dashboard.</span></label>` : ""}
    <div class="btn-row full"><button class="p-btn primary" ${o.cloneErr ? "disabled" : ""}>${ic("Plus")}Create</button><button class="p-btn secondary">Cancel</button></div></div></form>`;
}

/* ════════════ SESSION CHIP DIALOG ════════════ */
const ST = {

    <button class="vchip ${o.warn ? "pending" : ""}" aria-haspopup="dialog" data-testid="vault-chip">${ic(o.warn ? "CloudOffOutline" : "ShieldKeyOutline")}${o.warn ? "Vault: offline" : `Vault · ${env.length + llm.length}`}</button></div>

      ${o.banner ?? ""}
      <div><h4 class="sec-title">${ic("CogOutline")}Environment variables</h4>${env.map(row).join("")}</div>
      <div><h4 class="sec-title">${ic("Brain")}Model providers</h4>${llm.map(row).join("")}</div>
    </div><footer><span class="p-meta">${o.contact ?? "Last vault contact 09:14:02"}</span><a class="p-linkc" href="#">Manage in Settings → Vault ${ic("ArrowRight")}</a></footer></div></div></div>`;
}

function failoverAck() {
  const c = nid("fa");
  return `<div class="callout warning" role="alertdialog" aria-labelledby="${c}-h" aria-describedby="${c}-d" style="margin-top:6px" data-testid="vault-failover-notice">${ic("ShieldAlertOutline")}<div class="body">
    <strong id="${c}-h">Turn on failover for anthropic-pool?</strong>
    <p id="${c}-d" style="margin:4px 0">Switching between subscription accounts when one hits its limit may break the provider's terms, and the provider may suspend those accounts. Check Anthropic's terms for your plans. You decide whether this is allowed for you.</p>
    <ul class="impact"><li>A request moves to the next account only if the limit is hit before any answer arrives. Once an answer has started, an error is passed on and nothing is retried.</li><li>A rate-limited account is skipped for the time the provider asks (60 s if it doesn't say).</li></ul>
    <div class="btn-row"><button class="p-btn sm secondary" data-initial-focus>Cancel</button><button class="p-btn sm primary">${ic("Check")}I accept, turn on failover</button></div></div></div>`;
}

/* ── toolbar ─────────────────────────────────────────────── */
const html = document.documentElement;
function apply(group, v) {
  if (group === "theme") {
    const [pal, mode] = v.split("-");
    mode === "light" ? html.setAttribute("data-theme", "light") : html.removeAttribute("data-theme");
    pal === "nord" ? html.setAttribute("data-palette", "nord") : html.removeAttribute("data-palette");
  }
  if (group === "width") document.body.style.setProperty("--frame-w", v === "1440" ? "100%" : `${v}px`);
  if (group === "view") document.body.dataset.view = v;
}
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  apply(seg.dataset.group, b.dataset.v);
}));
const params = new URLSearchParams(location.search);
for (const g of ["theme", "width", "view"]) if (params.get(g)) document.querySelector(`.seg[data-group="${g}"] button[data-v="${params.get(g)}"]`)?.click();
