  - change: close-loopback-legacy-window
    reason: "MODIFIES trust-and-credential-boundaries 'Opt-in local proof for loopback trust', the requirement this change MODIFIES (local-proof cookie subject to the Origin gate first). Its delta is written on pre-close-container-loopback-impersonation text ('defaulting to false', no port-bound cookie), so this change copies the SHIPPED text and adds the Origin-gate paragraph; whichever archives second must re-copy so archiving cannot revert the shipped default-true or drop the other's additions."
