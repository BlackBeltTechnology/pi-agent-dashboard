    reason: "MODIFIES trusted-networks 'Network guard factory' (adds condition (e) 'accepted plugin capability stamp' and the 'Capability-stamped request allowed' scenario) and oauth-authentication 'Localhost and trusted host bypass' (adds the capability-stamp / app-mount skip and its scenarios) — both requirements this change also MODIFIES (cap narrowing). Its deltas are written on older text; this change copies its condition (e), sentence and scenarios into its own MODIFIED blocks on top of the shipped legacy-aware text, so whichever archives second must re-copy the block."
  - change: device-key-mutual-check
