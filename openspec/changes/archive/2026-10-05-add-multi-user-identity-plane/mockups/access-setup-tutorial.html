<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup: Access setup tutorial — roles, providers, users, remote sign-in, pairing (D26)</title>
<style>
  /* Tokens copied from login-logout.html (= packages/client/src/index.css). */
  :root {
    --bg-primary:#0a0a0a; --bg-secondary:#141414; --bg-tertiary:#1e1e1e; --bg-surface:#2a2a2a;
    --bg-hover:rgba(255,255,255,.06); --bg-overlay:rgba(0,0,0,.6);
    --text-primary:#e5e5e5; --text-secondary:#b0b0b0; --text-tertiary:#919191; --text-muted:#585858;
    --border-primary:#252525; --border-secondary:#333; --border-subtle:rgba(255,255,255,.06);
    --accent-solid:#2563eb; --accent-soft:#1d3a63; --accent-text:#60a5fa;
    --accent-green:#22c55e; --accent-yellow:#eab308; --accent-red:#ef4444;
    --radius:.5rem;
  }
  [data-theme="light"] {
    --bg-primary:#fff; --bg-secondary:#fafafa; --bg-tertiary:#f0f0f0; --bg-surface:#e0e0e0;
    --bg-hover:rgba(0,0,0,.04); --bg-overlay:rgba(0,0,0,.3);
    --text-primary:#1a1a1a; --text-secondary:#444; --text-tertiary:#636363; --text-muted:#aaa;
    --border-primary:#e0e0e0; --border-secondary:#ccc; --border-subtle:rgba(0,0,0,.06);
    --accent-solid:#2563eb; --accent-soft:#dbeafe; --accent-text:#1d4ed8;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg-primary); color:var(--text-primary); font-size:14px; }
  button, input, select { font:inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent-text); outline-offset:2px; }
  [hidden] { display:none !important; }
  code, pre, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }

  /* Review toolbar (not product) */
  .review { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; padding:.5rem .75rem; background:var(--bg-secondary); border-bottom:1px solid var(--border-primary); font-size:12px; }
  .review button { border:1px solid var(--border-secondary); background:var(--bg-tertiary); color:var(--text-secondary); border-radius:999px; padding:.25rem .65rem; cursor:pointer; }
  .review button[aria-pressed="true"] { background:var(--accent-solid); border-color:var(--accent-solid); color:#fff; }
  .review .sep { flex:1; }
  .note { padding:.5rem .75rem; font-size:12px; color:var(--text-tertiary); border-bottom:1px solid var(--border-primary); }

  /* Layout: steps rail | screen | artifacts */
  .layout { flex:1; display:grid; grid-template-columns:260px minmax(0,1fr) 340px; min-height:0; }
  @media (max-width:1100px){ .layout { grid-template-columns:220px minmax(0,1fr); } .artifacts { grid-column:1 / -1; border-left:0; border-top:1px solid var(--border-primary); } }
  @media (max-width:720px){ .layout { grid-template-columns:1fr; } .rail { border-right:0; border-bottom:1px solid var(--border-primary); } }

  .rail { border-right:1px solid var(--border-primary); background:var(--bg-secondary); padding:.75rem .5rem; overflow:auto; }
  .rail h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:.9rem .5rem .35rem; font-weight:600; }
  .rail h2:first-child { margin-top:0; }
  .step-btn { display:flex; gap:.55rem; align-items:flex-start; width:100%; text-align:left; background:none; border:0; color:var(--text-secondary); padding:.45rem .5rem; border-radius:var(--radius); cursor:pointer; }
  .step-btn:hover { background:var(--bg-hover); }
  .step-btn[aria-current="step"] { background:var(--accent-soft); color:var(--text-primary); }
  .step-btn .num { flex:none; width:1.4rem; height:1.4rem; border-radius:999px; display:grid; place-items:center; font-size:11px; background:var(--bg-surface); color:var(--text-secondary); }
  .step-btn[data-done="true"] .num { background:var(--accent-green); color:#000; }
  .step-btn[aria-current="step"] .num { background:var(--accent-solid); color:#fff; }
  .step-btn small { display:block; color:var(--text-muted); font-size:11px; margin-top:.1rem; }

  .stage { padding:1rem 1.25rem 2rem; overflow:auto; }
  .stage-head { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:.25rem; }
  .stage-head h1 { font-size:18px; margin:0; }
  .why { color:var(--text-tertiary); margin:.25rem 0 1rem; max-width:70ch; line-height:1.45; }
  .badge { font-size:11px; padding:.1rem .45rem; border-radius:999px; border:1px solid var(--border-secondary); color:var(--text-secondary); }
  .badge.role-admin { border-color:#7c3aed; color:#c4b5fd; }
  .badge.role-user { border-color:var(--accent-solid); color:var(--accent-text); }
  .badge.role-device { border-color:var(--accent-yellow); color:var(--accent-yellow); }
  .badge.shipped { border-color:var(--accent-green); color:var(--accent-green); }
  .badge.planned { border-color:var(--accent-yellow); color:var(--accent-yellow); border-style:dashed; }

  /* Fake window chrome */
  .win { border:1px solid var(--border-secondary); border-radius:10px; overflow:hidden; background:var(--bg-secondary); box-shadow:0 8px 24px rgba(0,0,0,.25); margin-bottom:1rem; }
  .win-bar { display:flex; align-items:center; gap:.5rem; padding:.4rem .6rem; background:var(--bg-tertiary); border-bottom:1px solid var(--border-primary); font-size:12px; color:var(--text-tertiary); }
  .dots { display:flex; gap:4px; } .dots i { width:9px; height:9px; border-radius:50%; background:var(--bg-surface); display:block; }
  .url { flex:1; background:var(--bg-primary); border:1px solid var(--border-primary); border-radius:999px; padding:.15rem .6rem; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--text-secondary); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .url b { color:var(--accent-green); font-weight:normal; }
  .win-body { padding:1rem; }
  .win.term .win-body { background:#050505; color:#d4d4d4; font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap; line-height:1.5; }
  .term .p { color:var(--accent-green); } .term .c { color:var(--text-muted); } .term .y { color:var(--accent-yellow); } .term .bl { color:var(--accent-text); }

  /* Settings-ish UI */
  .settings { display:grid; grid-template-columns:170px 1fr; gap:0; min-height:280px; }
  .settings nav { border-right:1px solid var(--border-primary); padding:.5rem; font-size:13px; }
  .settings nav div { padding:.35rem .5rem; border-radius:6px; color:var(--text-tertiary); }
  .settings nav div.on { background:var(--bg-hover); color:var(--text-primary); }
  .settings section { padding:.75rem 1rem; }
  .settings h3 { margin:0 0 .5rem; font-size:14px; }
  .row { display:grid; grid-template-columns:150px 1fr; gap:.5rem; align-items:center; margin:.45rem 0; }
  .row label { color:var(--text-tertiary); font-size:12.5px; }
  .input { background:var(--bg-primary); border:1px solid var(--border-secondary); border-radius:6px; padding:.35rem .5rem; color:var(--text-primary); width:100%; }
  .input.ro { color:var(--text-secondary); background:var(--bg-tertiary); }
  .copy { display:flex; gap:.35rem; } .copy .input { flex:1; }
  .btn { border:1px solid var(--border-secondary); background:var(--bg-tertiary); color:var(--text-primary); border-radius:6px; padding:.35rem .7rem; cursor:pointer; white-space:nowrap; }
  .btn.primary { background:var(--accent-solid); border-color:var(--accent-solid); color:#fff; }
  .btn.ok { background:var(--accent-green); border-color:var(--accent-green); color:#000; }
  .btn.danger { color:var(--accent-red); }
  .card { border:1px solid var(--border-primary); border-radius:var(--radius); padding:.75rem; margin:.6rem 0; background:var(--bg-primary); }
  .card-h { display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; }
  .card-h strong { flex:1; }
  .toggle { width:34px; height:19px; border-radius:999px; background:var(--accent-green); position:relative; display:inline-block; }
  .toggle::after { content:""; position:absolute; right:2px; top:2px; width:15px; height:15px; border-radius:50%; background:#fff; }
  .toggle.off { background:var(--bg-surface); } .toggle.off::after { right:auto; left:2px; }
  .callout { border-left:3px solid var(--accent-yellow); background:rgba(234,179,8,.08); padding:.5rem .7rem; border-radius:0 6px 6px 0; font-size:12.5px; color:var(--text-secondary); margin:.6rem 0; }
  .callout.ok { border-color:var(--accent-green); background:rgba(34,197,94,.08); }
  .callout.info { border-color:var(--accent-text); background:rgba(96,165,250,.08); }
  .callout.bad { border-color:var(--accent-red); background:rgba(239,68,68,.08); }

  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t th, table.t td { text-align:left; padding:.4rem .45rem; border-bottom:1px solid var(--border-primary); }
  table.t th { color:var(--text-muted); font-weight:500; font-size:11.5px; }
  .pill { font-size:11px; border-radius:999px; padding:.05rem .45rem; background:var(--bg-surface); color:var(--text-secondary); }
  .pill.operate { background:#4c1d95; color:#ddd6fe; } .pill.control { background:var(--accent-soft); color:var(--accent-text); } .pill.observe { background:#1f2937; color:#9ca3af; }
  .pill.pending { background:rgba(234,179,8,.15); color:var(--accent-yellow); } .pill.active { background:rgba(34,197,94,.15); color:var(--accent-green); }

  /* Login page / provider pages */
  .center { display:grid; place-items:center; padding:2rem 1rem; }
  .login-box { width:min(340px,100%); text-align:center; }
  .logo { width:44px; height:44px; border-radius:10px; background:var(--accent-solid); margin:0 auto .75rem; display:grid; place-items:center; color:#fff; font-weight:700; }
  .prov { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; margin:.4rem 0; padding:.55rem; border-radius:6px; border:1px solid var(--border-secondary); background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer; }
  .muted { color:var(--text-muted); font-size:12px; }
  .gh { background:#f6f8fa; color:#1f2328; border-radius:8px; padding:1rem; max-width:420px; margin:0 auto; font-size:13px; }
  .gh .btn { background:#1f883d; border-color:#1f883d; color:#fff; }
  .gh ul { padding-left:1.1rem; color:#59636e; }

  /* QR + codes */
  .qr { width:132px; height:132px; background:
      repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/22px 22px; border:8px solid #fff; border-radius:6px; }
  .bigcode { font-family:ui-monospace,Menlo,monospace; font-size:26px; letter-spacing:.15em; color:var(--text-primary); }
  .phone { width:220px; border:2px solid var(--border-secondary); border-radius:22px; padding:1rem .75rem; background:var(--bg-primary); text-align:center; }
  .flex { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-start; }
  .arrow { align-self:center; color:var(--text-muted); font-size:20px; }

  /* Artifacts panel */
  .artifacts { border-left:1px solid var(--border-primary); background:var(--bg-secondary); padding:.75rem; overflow:auto; }
  .artifacts h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 .5rem; font-weight:600; }
  .art { border:1px solid var(--border-primary); border-radius:var(--radius); margin-bottom:.6rem; background:var(--bg-primary); }
  .art-h { display:flex; gap:.4rem; align-items:center; padding:.35rem .55rem; border-bottom:1px solid var(--border-primary); font-size:11.5px; color:var(--text-secondary); }
  .art-h .kind { font-size:10px; padding:0 .35rem; border-radius:4px; background:var(--bg-surface); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.04em; }
  .art-h .kind.secret { background:rgba(239,68,68,.18); color:var(--accent-red); }
  .art-h .kind.mem { background:rgba(96,165,250,.15); color:var(--accent-text); }
  .art-h .kind.file { background:rgba(34,197,94,.15); color:var(--accent-green); }
  .art pre { margin:0; padding:.5rem .55rem; white-space:pre-wrap; word-break:break-all; color:var(--text-secondary); font-size:11.5px; line-height:1.45; }
  .art .where { padding:.3rem .55rem; font-size:11px; color:var(--text-muted); border-top:1px solid var(--border-subtle); }
  .hl { color:var(--accent-yellow); }

  .nav { display:flex; justify-content:space-between; gap:.5rem; margin-top:1rem; }
  .flow { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--text-tertiary); white-space:pre; overflow:auto; background:var(--bg-primary); border:1px solid var(--border-primary); border-radius:var(--radius); padding:.6rem; margin:.5rem 0 1rem; }
</style>
</head>
<body>

<div class="review" role="toolbar" aria-label="Mockup review controls">
  <strong style="margin-right:.25rem">Access setup tutorial</strong>
  <span class="muted">Track:</span>
  <button data-filter="all" aria-pressed="true">All</button>
  <button data-filter="admin" aria-pressed="false">Admin</button>
  <button data-filter="user" aria-pressed="false">Remote user</button>
  <button data-filter="device" aria-pressed="false">Device (pairing)</button>
  <span class="sep"></span>
  <button id="theme" aria-pressed="false">Light theme</button>
</div>
<div class="note">
  Mockup for D26 (social-login broker) + shipped device pairing. Badges: <span class="badge shipped">shipped</span> exists today ·
  <span class="badge planned">planned</span> D26 / task 18.22. Right panel = every key, token and record the step creates, and where it lives.
  Values are fake. Not part of the product.
</div>

<div class="layout">
  <nav class="rail" aria-label="Tutorial steps" id="rail"></nav>
  <main class="stage" id="stage" tabindex="-1"></main>
  <aside class="artifacts" aria-label="Keys and records created by this step">
    <h2>Created by this step</h2>
    <div id="arts"></div>
  </aside>
</div>

<script>
const BASE = "https://dash.example.com";
const STEPS = [
/* ───────────────────────── ADMIN ───────────────────────── */
{ id:"roles", track:"admin", group:"0 · Who does what", title:"Roles & tiers", sub:"Read first", status:"planned",
  why:"Three actors. A <b>user</b> is a person who signs in (GitHub / Google / OIDC). A <b>device</b> has no person behind it (headless bridge, kiosk) and is paired once. Every principal carries a tier; the route→tier map decides what it may call.",
  screen:`
  <table class="t">
    <tr><th>Tier</th><th>Can</th><th>Typical</th></tr>
    <tr><td><span class="pill observe">observe</span></td><td>Read sessions, transcripts, status</td><td>QA team, stakeholders</td></tr>
    <tr><td><span class="pill control">control</span></td><td>+ prompt, abort, spawn sessions</td><td>Developers</td></tr>
    <tr><td><span class="pill operate">operate</span></td><td>+ settings, restart, packages, users, pairing</td><td>Admin (you)</td></tr>
  </table>
  <div class="flow">Admin (operate) ──configures──▶ Provider (GitHub/Google) + Allowlist
                                  │
     Remote user ──signs in──▶ dashboard issues OWN token {sub, tier}
     Electron / CLI / MCP ──same sign-in, no pairing──▶ token
     Device w/o person ──QR pairing + typed code──▶ device bearer (tier)</div>
  <div class="callout info">Rule: network position is never identity. A trusted IP does not grant a tier; a sign-in or a pairing does.</div>`,
  arts:[] },

{ id:"base", track:"admin", group:"1 · Admin setup (on the host)", title:"Set a stable public URL", sub:"Settings › Network", status:"shipped",
  why:"OAuth providers only redirect back to a URL registered in advance. An ephemeral tunnel URL changes on restart and breaks every sign-in. Pick a reserved tunnel, a Tailscale name or your own domain.",
  screen:`
  <div class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">http://localhost:8000/settings/network</span></div>
  <div class="settings"><nav><div>General</div><div class="on">Network</div><div>Sign-in providers</div><div>Users</div><div>Paired devices</div></nav>
  <section><h3>Public URL</h3>
    <div class="row"><label>Primary tunnel</label><select class="input"><option>zrok — reserved share</option><option>zrok — ephemeral ⚠</option><option>Tailscale serve</option><option>Custom domain</option></select></div>
    <div class="row"><label>Resolved public base</label><input class="input ro" readonly value="${BASE}"></div>
    <div class="row"><label>Auth redirect override</label><input class="input" placeholder="(optional) auth.redirectBaseUrl"></div>
    <div class="callout ok">✓ Stable origin — OAuth callbacks will survive restarts.</div>
    <div class="callout">If you choose <b>ephemeral</b>, sign-in providers are shown disabled with this reason.</div>
  </section></div></div>`,
  arts:[
   {name:"~/.pi/dashboard/config.json", kind:"file", body:`{
  "tunnel": { "provider": "zrok", "reserved": "dash" },
  "auth":   { "redirectBaseUrl": "<span class=hl>${BASE}</span>" }
}`, where:"Mode 0600 (B25). Feeds callback + issuer URL — never the Host header."}
  ]},

{ id:"ghapp", track:"admin", group:"1 · Admin setup (on the host)", title:"Register the OAuth app at GitHub / Google", sub:"Outside the dashboard", status:"planned",
  why:"The dashboard tells you exactly what to paste. You do this once per provider, in the provider's console.",
  screen:`
  <div class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url"><b>https://</b>github.com/settings/applications/new</span></div>
  <div class="win-body"><div class="gh">
    <strong>Register a new OAuth app</strong>
    <p style="margin:.6rem 0 .2rem">Application name</p><input class="input" style="background:#fff;color:#1f2328" value="pi dashboard (robson)">
    <p style="margin:.6rem 0 .2rem">Homepage URL</p><input class="input" style="background:#fff;color:#1f2328" value="${BASE}">
    <p style="margin:.6rem 0 .2rem">Authorization callback URL</p><input class="input" style="background:#fff;color:#1f2328" value="${BASE}/identity/interaction/callback/github">
    <p style="margin:.6rem 0 .2rem">☐ Enable Device Flow <span style="color:#59636e">(not needed — the dashboard runs device flow itself)</span></p>
    <p><button class="btn">Register application</button></p>
  </div></div></div>
  <div class="callout info">Google: Cloud Console › Credentials › OAuth client ID › <i>Web application</i>, same callback with <code>/google</code>. Consent screen: scopes <code>openid email profile</code>.</div>`,
  arts:[
   {name:"From GitHub (copy to step 4)", kind:"secret", body:`Client ID:     Ov23liAbC123xyz
Client secret: <span class=hl>4f9c…e21a</span>  (shown once by GitHub)`, where:"Never leaves the host. Browsers never see it (confidential upstream client)."}
  ]},

{ id:"provider", track:"admin", group:"1 · Admin setup (on the host)", title:"Enable the sign-in provider", sub:"Settings › Sign-in providers", status:"planned",
  why:"Paste the client id + secret. Saving creates the dashboard's own authorization server keys — this is what makes the dashboard the token issuer for every client.",
  screen:`
  <div class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">http://localhost:8000/settings/sign-in</span></div>
  <div class="settings"><nav><div>General</div><div>Network</div><div class="on">Sign-in providers</div><div>Users</div><div>Paired devices</div></nav>
  <section>
    <div class="card"><div class="card-h"><strong>GitHub</strong><span class="toggle"></span></div>
      <div class="row"><label>Client ID</label><input class="input" value="Ov23liAbC123xyz"></div>
      <div class="row"><label>Client secret</label><input class="input" type="password" value="xxxxxxxxxxxxxxxx"></div>
      <div class="row"><label>Callback to register</label><div class="copy"><input class="input ro mono" readonly value="${BASE}/identity/interaction/callback/github"><button class="btn">Copy</button></div></div>
      <div class="row"><label>Scopes</label><span class="mono muted">read:user user:email read:org</span></div>
    </div>
    <div class="card"><div class="card-h"><strong>Google</strong><span class="toggle off"></span></div><span class="muted">Disabled — fill client ID/secret to enable.</span></div>
    <div class="card"><div class="card-h"><strong>Generic OIDC</strong><span class="toggle off"></span></div><span class="muted">Issuer URL + client (Keycloak, Entra, Authentik…)</span></div>
    <div class="callout">Legacy <code>auth.providers.github</code> found. <button class="btn">Import & remove legacy</button> — the two cannot run together (D8).</div>
    <div class="callout">Status: <b>configured, NOT enforced</b>. Add yourself as a user, then run a test sign-in (step 6).</div>
  </section></div></div>`,
  arts:[
   {name:"config.json › plugins.social-login", kind:"file", body:`"upstreams": {
  "github": { "enabled": true,
    "clientId": "Ov23liAbC123xyz",
    "clientSecret": "<span class=hl>4f9c…e21a</span>" }
}
"issuer": "${BASE}/identity"`, where:"0600. Secret masked in UI + API responses."},
   {name:"~/.pi/dashboard/identity/jwks.json", kind:"secret", body:`{ "keys": [ { "kty":"EC", "crv":"P-256",
  "kid":"<span class=hl>2026-10-a</span>", "d":"…private…" } ] }`, where:"Generated on first save. Signs every dashboard token. 0600. Public half at /identity/jwks."},
   {name:"Published (public)", kind:"mem", body:`GET /.well-known/oauth-authorization-server
GET /.well-known/openid-configuration
GET /identity/jwks`, where:"Clients discover endpoints here (Electron, CLI, MCP)."}
  ]},

{ id:"users", track:"admin", group:"1 · Admin setup (on the host)", title:"Add users & assign tiers", sub:"Settings › Users", status:"planned",
  why:"Nobody gets in by default. Add people one by one (GitHub login, Google email) or by group (GitHub org/team, Google Workspace domain). A user appears as 'pending' until their first sign-in links the upstream account.",
  screen:`
  <div class="win"><div class="win-bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">http://localhost:8000/settings/users</span></div>
  <div class="settings"><nav><div>General</div><div>Network</div><div>Sign-in providers</div><div class="on">Users</div><div>Paired devices</div></nav>
  <section>
    <div class="card"><div class="card-h"><strong>Add access</strong></div>
      <div class="row"><label>Who</label><div class="copy"><select class="input" style="max-width:150px"><option>GitHub user</option><option>GitHub org / team</option><option>Google email</option><option>Google domain</option><option>OIDC claim</option></select><input class="input" value="anna-k"></div></div>
      <div class="row"><label>Tier</label><select class="input"><option>observe</option><option selected>control</option><option>operate</option></select></div>
      <div class="row"><label></label><div><button class="btn primary">Add</button> <button class="btn">Copy invite link</button></div></div>
    </div>

let current = 0, filter = "all";
const rail = document.getElementById("rail"), stage = document.getElementById("stage"), arts = document.getElementById("arts");
const ROLE = { admin:["role-admin","Admin"], user:["role-user","Remote user"], device:["role-device","Device"] };

function visible(){ return STEPS.map((s,i)=>[s,i]).filter(([s])=>filter==="all"||s.track===filter); }

function renderRail(){
  rail.innerHTML = ""; let g = null;
  for (const [s,i] of visible()){
    if (s.group!==g){ g=s.group; const h=document.createElement("h2"); h.textContent=g; rail.appendChild(h); }
    const b=document.createElement("button"); b.className="step-btn";
    if (i===current) b.setAttribute("aria-current","step");
    b.dataset.done = String(i<current);
    b.innerHTML = `<span class="num">${i+1}</span><span>${s.title}<small>${s.sub}</small></span>`;
    b.onclick=()=>go(i); rail.appendChild(b);
  }
}
function renderStage(){
  const s=STEPS[current], [rc,rl]=ROLE[s.track], v=visible().map(([,i])=>i), pos=v.indexOf(current);
  stage.innerHTML = `
    <div class="stage-head"><span class="badge ${rc}">${rl}</span><span class="badge ${s.status}">${s.status}</span>
      <span class="muted">Step ${current+1} of ${STEPS.length}</span></div>
    <div class="stage-head"><h1>${s.title}</h1></div>
    <p class="why">${s.why}</p>${s.screen}
    <div class="nav"><button class="btn" ${pos<=0?"disabled":""} id="prev">← Back</button>
      <button class="btn primary" ${pos>=v.length-1?"disabled":""} id="next">Next →</button></div>`;
  document.getElementById("prev").onclick=()=>go(v[pos-1]);
  document.getElementById("next").onclick=()=>go(v[pos+1]);
  arts.innerHTML = s.arts.length ? s.arts.map(a=>`<div class="art"><div class="art-h"><span class="kind ${a.kind}">${a.kind==="secret"?"secret":a.kind==="mem"?"transient":"stored"}</span><span class="mono">${a.name}</span></div><pre>${a.body}</pre><div class="where">${a.where}</div></div>`).join("")
    : `<p class="muted">Nothing is created — orientation step.</p>`;
}
function go(i){ if(i==null||i<0) return; current=i; renderRail(); renderStage(); stage.focus(); }

document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  const v=visible().map(([,i])=>i); if(!v.includes(current)) current=v[0]; renderRail(); renderStage();
});
document.getElementById("theme").onclick=e=>{
  const light=document.documentElement.dataset.theme!=="light";
  document.documentElement.dataset.theme=light?"light":"dark"; e.target.setAttribute("aria-pressed",String(light));
};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select")) return;
  const v=visible().map(([,i])=>i), p=v.indexOf(current);
  if(e.key==="ArrowRight"&&p<v.length-1) go(v[p+1]);
  if(e.key==="ArrowLeft"&&p>0) go(v[p-1]);
});
renderRail(); renderStage();
</script>
