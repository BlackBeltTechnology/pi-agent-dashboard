// Live measurement: line count of each indicator + host row height.
function measure() {
  document.querySelectorAll(".frame").forEach(f => {
    const a = f.querySelector(".yolo"); const out = f.querySelector(".measure");
    if (!a || !out) return;
    const cs = getComputedStyle(a);
    const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.45;
    const inner = a.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(cs.borderTopWidth) - parseFloat(cs.borderBottomWidth);
    const lines = Math.max(1, Math.round(inner / lh));
    const row = a.closest("[data-row]") || a.parentElement;
    const over = a.getBoundingClientRect().right > row.getBoundingClientRect().right + 0.5;
    out.innerHTML = `indicator: <b class="${lines>1?"bad":"good"}">${lines} line${lines>1?"s":""}</b> · ${Math.round(a.getBoundingClientRect().width)}×${Math.round(a.getBoundingClientRect().height)} px · host row ${Math.round(row.getBoundingClientRect().height)} px · overflow: <b class="${over?"bad":"good"}">${over?"yes":"no"}</b>`;
  });
}
