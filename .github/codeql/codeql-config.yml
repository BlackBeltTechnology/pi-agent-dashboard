# Shared CodeQL configuration: read by BOTH the advanced-setup workflow
# (.github/workflows/codeql.yml, `config-file:`) and the local ratchet
# (scripts/codeql-local.mjs, which translates each `paths-ignore` glob into one
# LGTM_INDEX_FILTERS `exclude:` line — the extractor filter that works offline).
#
# Only test, e2e, QA and mockup / design-scratch code is ignored. Non-test
# scripts stay analyzed: publish.yml / nightly.yml run them with publish-scope
# tokens. Every glob must stay expressible as an extractor filter.
#
# Exception: root `spike/**` holds throwaway experiments (smoke tests and the
# docker harness read some of them, e.g. docker/test-entrypoint.sh) and is not
# analyzed. Only the REPOSITORY-ROOT `spike/` is excluded: the extractor filter
# `exclude:spike` is root-anchored, so a nested `packages/x/spike/` stays
# analyzed. The spike gate (change codeql-model-pack-and-mirror) depends on that.
# See change: add-local-codeql-ratchet.
name: pi-dashboard
queries: [] # suite defaults: code-scanning (local) / default (CI)
paths-ignore:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mjs"
  - "**/*.spec.ts"
  - tests/**
  - qa/**
  - "scripts/**/__tests__/**"
  - mockups/**
  - "**/mockups/**"
  - "openspec/changes/**/mockup*"
  - site/design-scratch/**
  - "**/e2e/**"
  - spike/**
