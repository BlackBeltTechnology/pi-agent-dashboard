# CodeQL data extension: the shared cwd guards are path-injection barrier guards.
#
# Modelled predicates (all in packages/shared/src/cwd-guard.ts):
#   - `isAllowedCwd(cwd, known)`        sync boolean guard; cwd is Argument[0].
#   - `admissionAllows(admission, cwd)` sync predicate over the decided async
#     `admitCwd` result (true iff admitted AND bound to `cwd`); cwd is Argument[1].
#     Plugin routes branch on it right after `await admitCwd(...)`.
#   - `tokenAllows(token, cwd)`         the config writer's check of a live
#     request-scoped admission token; cwd is Argument[1].
# `admitCwd` itself is NOT modelled: it spawns git with the cwd before the branch,
# so a CodeQL run must confirm it raises no new `js/path-injection` alert; if it
# does, model `admitCwd` Argument[0] too. See change: harden-plugin-cwd-admission.
#
# `isAllowedCwd(cwd, known)` (packages/shared/src/cwd-guard.ts) admits a
# caller-supplied `cwd` ONLY when it — or the resolved main checkout of the git
# repository it belongs to — is a member of the host's known-folder set
# (session cwds ∪ pinned dirs), both sides realpath-canonicalized. Every
# first-party route that touches disk under a caller-supplied `cwd` branches on
# it first (kb-plugin, mcp-client). CodeQL cannot see through the membership
# test, so without this model every such route reports `js/path-injection`.
#
# Scope: this models exactly that one function. It does not suppress the query.
# See change: improve-kb-settings-sources-and-search.
extensions:
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard.js", "Member[isAllowedCwd].Argument[0]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[isAllowedCwd].Argument[0]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard.js", "Member[admissionAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[admissionAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard.js", "Member[tokenAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[tokenAllows].Argument[1]", "true", "path-injection"]
