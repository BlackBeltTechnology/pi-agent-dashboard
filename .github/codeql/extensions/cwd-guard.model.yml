# CodeQL data extension: the shared cwd guards are path-injection barrier guards.
#
# Modelled predicates (all in packages/shared/src/cwd-guard.ts):
#   - `isAllowedCwd(cwd, known)`        sync boolean guard; cwd is Argument[0].
#   - `admissionAllows(admission, cwd)` sync predicate over the decided async
#     `admitCwd` result (true iff admitted AND bound to `cwd`); cwd is Argument[1].
#     Plugin routes branch on it right after `await admitCwd(...)`.
#   - `tokenAllows(token, cwd)`         the config writer's check of a live
#     request-scoped admission token; cwd is Argument[1].
#   - `admitCwd(cwd, known, opts)`      the guard ITSELF. It must canonicalize the raw cwd
#     (async realpath) and probe git under it BEFORE it can decide, so CodeQL reported
#     `js/path-injection` at that realpath (PR #856). It is therefore modelled as a
#     BARRIER on its own Argument[0]: the argument is the thing being judged, never a
#     value the decision trusts. This only stops taint at the call-site argument node;
#     every consumer still has to branch on `admissionAllows` before touching disk.
# See change: harden-plugin-cwd-admission.
#
# `isAllowedCwd(cwd, known)` (packages/shared/src/cwd-guard.ts) admits a
# caller-supplied `cwd` ONLY when it — or the resolved main checkout of the git
# repository it belongs to — is a member of the host's known-folder set
# (session cwds ∪ pinned dirs), both sides realpath-canonicalized. Every
# first-party route that touches disk under a caller-supplied `cwd` branches on
# it first (kb-plugin, mcp-client). CodeQL cannot see through the membership
# test, so without this model every such route reports `js/path-injection`.
#
# Scope: this models exactly that one function. It does not suppress the query.
# See change: improve-kb-settings-sources-and-search.
#
# `isPortableProjectName(name)` (packages/shared/src/project-name.ts) admits a caller-supplied
# project name ONLY when it is a single portable path segment (no separators, `..`, control
# characters, device names, > 255 bytes). `createProjectDirectory` branches on it before joining
# the name onto the realpath'd projects root, then re-checks realpath containment.
# See change: streamline-first-run.
#
# `containmentAllows(decision, resolved)` (packages/shared/src/containment-guard.ts) is true only when
# the async `evaluateContainment` / `decidePassive` decision (packages/server/src/access/containment-gate.ts)
# ALLOWED and was made for exactly that `resolved` string (strict equality), so it cannot bless any other
# path. `resolved` is Argument[1]; file routes branch on it right after the `await`.
# See change: codeql-file-containment-barrier.
#
# TYPE STRINGS: a type containing a dot MUST be single-quoted (`"'pkg/m.js'"`). CodeQL's
# `parseTypeString` (`('[^']+'|[^.]+)(.*)`) ends the package name at the FIRST dot, so an
# unquoted `pkg/m.js` parses as package `pkg/m` + type `js` and matches nothing — the rows
# silently never applied before this fix. Production imports use the `.js` specifier; the bare
# rows stay as harmless dot-free aliases. Enforced by
# packages/shared/src/__tests__/codeql-model-contract.test.ts.
# See change: codeql-model-pack-and-mirror.
extensions:
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierGuardModel
    data:
      - ["'@blackbelt-technology/pi-dashboard-shared/project-name.js'", "Member[isPortableProjectName].Argument[0]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/project-name", "Member[isPortableProjectName].Argument[0]", "true", "path-injection"]
      - ["'@blackbelt-technology/pi-dashboard-shared/cwd-guard.js'", "Member[isAllowedCwd].Argument[0]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[isAllowedCwd].Argument[0]", "true", "path-injection"]
      - ["'@blackbelt-technology/pi-dashboard-shared/cwd-guard.js'", "Member[admissionAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[admissionAllows].Argument[1]", "true", "path-injection"]
      - ["'@blackbelt-technology/pi-dashboard-shared/cwd-guard.js'", "Member[tokenAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[tokenAllows].Argument[1]", "true", "path-injection"]
      - ["'@blackbelt-technology/pi-dashboard-shared/containment-guard.js'", "Member[containmentAllows].Argument[1]", "true", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/containment-guard", "Member[containmentAllows].Argument[1]", "true", "path-injection"]
  - addsTo:
      pack: codeql/javascript-all
      extensible: barrierModel
    data:
      - ["'@blackbelt-technology/pi-dashboard-shared/cwd-guard.js'", "Member[admitCwd].Argument[0]", "path-injection"]
      - ["@blackbelt-technology/pi-dashboard-shared/cwd-guard", "Member[admitCwd].Argument[0]", "path-injection"]
