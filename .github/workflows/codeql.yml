# CodeQL advanced setup — replaces GitHub's "default setup" so CI and the local
# ratchet (scripts/codeql-local.mjs) share one configuration:
# .github/codeql/codeql-config.yml. Categories are pinned to the exact values
# default setup used, so existing alert dismissals keep matching.
#
# No dependency install and no cache step: build-mode none needs neither, and a
# cache step would add a new actions/cache-poisoning site.
# Not a required check: fork PRs may lack upload permission.
# See change: add-local-codeql-ratchet.
name: CodeQL

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
