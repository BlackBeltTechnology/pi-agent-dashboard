name: Deploy Site

on:
  push:
    branches: [develop]
    paths:
      - "site/**"
      # site/design-scratch/ is the design source the site is drawn FROM, not
      # part of the built site (Astro only builds src/pages and publishes
      # public/). Without this exclusion every mockup iteration would deploy
      # production for no change in output.
      - "!site/design-scratch/**"
      - "packages/shell/**"
      - ".github/workflows/deploy-site.yml"
  # Rebuild and redeploy whenever a new release is published so the
  # Download section surfaces the latest version automatically.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # required so redispatch-on-release can run `gh workflow run`

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # When triggered by `release: published`, the workflow runs on the tag ref
  # (e.g. v0.3.0). The `github-pages` environment's branch/tag protection
  # rules reject deploys from non-default refs, so instead of trying to
  # deploy inline we re-dispatch this same workflow on `develop` (the
  # allowed ref) and let that run do the deploy. All other triggers
  # (push to develop, workflow_dispatch) skip this job and proceed normally.
  redispatch-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Site on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-site.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref develop

  build:
    # Skip when this run was triggered by a release — redispatch-on-release
    # will kick off a fresh run on develop that handles build + deploy.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm for the ROOT workspace install below (the neutral shell). site/
      # itself has NO dependencies since it became a hand-written static page:
      # no npm ci, no astro build, no type check, no bundle budget (there is
      # no bundle). `npm run build` is a copy + reference check.
      - uses: pnpm/action-setup@v4

      - name: Build
        run: npm run build

      # The page carries release data inline, so a stale page is a page with
      # dead download links. This does not block the deploy -- publishing the
      # previous version's links still beats publishing nothing -- but it puts
      # the drift in the log where the release job can be chased.
      - name: Check release data is current
        run: npm run check-release
        continue-on-error: true

      # Neutral device-pairing shell (packages/shell). GitHub Pages allows one
      # site per repo and `site/` owns the pi-dashboard.dev apex, so the shell
      # is published at the SUBPATH `/app/`. Same origin as the apex (path is
      # excluded from the web origin), so the server's built-in
      # `https://pi-dashboard.dev` CORS default covers it unchanged. The shell
      # builds with `base:"./"`, so relative assets resolve under any subpath.
      - name: Install workspace deps (for shell)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build neutral shell
        working-directory: packages/shell
        run: pnpm exec vite build

      - name: Copy shell into site artifact under /app
        working-directory: .
        run: |
          mkdir -p site/dist/app
          cp -r packages/shell/dist/* site/dist/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run if not already configured in
          # repo settings. Requires `permissions: pages: write` (already set).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
