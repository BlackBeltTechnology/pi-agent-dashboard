name: Deploy Site

on:
  push:
    branches: [develop]
    paths:
      - "site/**"
      # site/design-scratch/ is the design source the site is drawn FROM, not
      # part of the built site. Without this exclusion every mockup iteration
      # would deploy production for no change in output.
      - "!site/design-scratch/**"
      - "packages/shell/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# No `release:` trigger on purpose. publish.yml creates the GitHub Release
# with the default Actions token, and GitHub suppresses workflow runs from
# events raised by that token — a release event CANNOT start a run here (it
# never has). The release path is a `site-redeploy` job in publish.yml that
# DISPATCHES this workflow on develop via workflow_dispatch (the documented
# exception that always creates a run). See change: fix-deploy-site-ship-shell
# (design D8).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm for the ROOT workspace install below (the neutral shell). site/
      # itself has NO dependencies since it became a hand-written static page:
      # no npm ci, no astro build, no type check, no bundle budget (there is
      # no bundle). `npm run build` is a copy + reference check.
      - uses: pnpm/action-setup@v4

      - name: Build
        run: npm run build

      # The page carries release data inline, so a stale page is a page with
      # dead download links. This does not block the deploy -- publishing the
      # previous version's links still beats publishing nothing -- but it puts
      # the drift in the log where the release job can be chased.
      - name: Check release data is current
        run: npm run check-release
        continue-on-error: true

      # Neutral device-pairing shell (packages/shell). GitHub Pages allows one
      # site per repo and `site/` owns the pi-dashboard.dev apex, so the shell
      # is published at the SUBPATH `/app/`. Same origin as the apex (path is
      # excluded from the web origin), so the server's built-in
      # `https://pi-dashboard.dev` CORS default covers it unchanged. The shell
      # builds with `base:"./"`, so relative assets resolve under any subpath.
      - name: Install workspace deps (for shell)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build neutral shell
        working-directory: packages/shell
        run: pnpm exec vite build

      - name: Copy shell into site artifact under /app
        working-directory: .
        run: |
          mkdir -p site/dist/app
          cp -r packages/shell/dist/* site/dist/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run if not already configured in
          # repo settings. Requires `permissions: pages: write` (already set).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
