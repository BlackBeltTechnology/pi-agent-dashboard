name: Standalone install smoke (reusable)

# Reusable workflow that runs the full standalone-install-smoke matrix
# (Linux × 8: Node 22/24/25/26 × bookworm-slim/alpine + Windows × 1: Node 22),
# plus two Linux jobs for the Node-native TypeScript loader (change:
# strip-only-native-ts-loader): the EOL Node 23 loader tiers and the Node 26
# in-place upgrade continuity check.
#
# Consumed by:
#   - .github/workflows/ci-smoke.yml  (on-demand manual dispatch)
#   - .github/workflows/publish.yml   (release gate before npm publish)
#
# This workflow MUST NOT publish to npm or create a GitHub Release. It only
# packs the workspace into tarballs, installs into a clean HOME, and asserts
# pi-dashboard bootstrap reaches ready. Publishing remains the sole
# responsibility of publish.yml's `publish` + `github-release`.
#
# See change: gate-publish-on-smoke-and-tests.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (sha or branch) to check out before packing
        type: string
        required: true

# Least-privilege default: jobs that need more declare it at job level.
# Pinned by packages/shared/src/__tests__/workflow-token-cache-contract.test.ts.
# See change: harden-ci-cache-poisoning.
permissions:
  contents: read

jobs:
  # Pack the workspace into tarballs, install into a clean HOME, launch
  # pi-dashboard, assert bootstrap reaches ready. Guards against the v0.5.3
  # regressions captured in docs/repro/. See change:
  # enable-standalone-npm-install task 7.4.
  standalone-install-smoke-linux:
    name: standalone-install-smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node:22-bookworm-slim
            node-version: 22
          - image: node:22-alpine
            node-version: 22
          - image: node:24-bookworm-slim
            node-version: 24
          - image: node:24-alpine
            node-version: 24
          - image: node:25-bookworm-slim
            node-version: 25
          - image: node:25-alpine
            node-version: 25
          - image: node:26-bookworm-slim
            node-version: 26
          - image: node:26-alpine
            node-version: 26
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install base tooling (Debian/Ubuntu)
        if: contains(matrix.image, 'bookworm') || contains(matrix.image, 'debian')
        # bzip2 is required to extract phantomjs-prebuilt's .tar.bz2 at install
        # time (pulled transitively via electron-icon-builder → icon-gen →
        # svg2png). TODO: evict electron-icon-builder to drop deprecated
        # phantomjs from the install graph.
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl bash procps bzip2
      - name: Install base tooling (Alpine)
        if: contains(matrix.image, 'alpine')
        run: apk add --no-cache git ca-certificates curl bash procps bzip2
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # actions/setup-node mounts the host runner's glibc Node into the
      # container and prepends it to PATH. On Alpine (musl) that binary
      # fails to exec with "required file not found". The node:<major>-*
      # images already ship a matching Node, so skip setup-node on Alpine.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: "!contains(matrix.image, 'alpine')"
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The engine-strict override is kept on the pre-26 legs for continuity
      # only. Its stated rationale ("the transitive appdmg engine range
      # fail-fasts on Node 24/25") is FALSE and was corrected in change
      # fix-pi-install-node26-and-omit-dev-build: `appdmg@0.6.6` declares
      # `engines: {node: '>=8.5'}` with `os: [darwin]` — no upper bound, and
      # platform-filtered out of Linux installs entirely. The real historical
      # cause per root `.npmrc` was native compilation of `macos-alias`.
      # A whole-lockfile scan finds exactly one upper-bounded engines range
      # (`>=6 <7 || >=8`), which admits Node 26.
      - name: Install deps (engine-strict override, pre-26 legs)
        if: matrix.node-version != 26
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      # Node 26 legs run WITHOUT the override so the EBADENGINE half of #357 is
      # regression-tested rather than assumed — with the override in place CI
      # cannot distinguish "cap fixed" from "still refused".
      # SCOPE: this leg runs `pnpm install`, whereas pi runs `npm install
      # --omit=dev`; pnpm and npm resolve `engine-strict` through different
      # config cascades. It proves the manifest engines range admits Node 26
      # under a strict installer, NOT the exact pi codepath (that is
      # `qa/tests/15-omit-dev-build.sh` arm 2, end-to-end is the manual M1).
      # If this leg unexpectedly reds, restore the override HERE and record the
      # real blocker in this comment.
      - name: Install deps (engine-strict ON — Node 26 regression gate for #357)
        if: matrix.node-version == 26
        run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run standalone install smoke
        run: bash scripts/test-standalone-npm-install.sh --port 18000

  # Windows counterpart of standalone-install-smoke-linux. Locks down the
  # three Windows-only spawn bugs fixed in 0f2d08aa that escaped CI to a
  # user-reported Windows 11 reproduction:
  #   1. shouldUrlWrapEntry mis-wrapping jiti entries with file:///C:/…
  #      (Node misnormalises triple-slash on the entry argv)
  #   2. runNpmOnce spawn EFTYPE on npm.cmd (CVE-2024-27980 mitigation
  #      requires shell:true for .cmd/.bat shims)
  #   3. nodeScriptToArgv falling back to [resolvedPath] when
  #      registry.resolve("node") fails — spawned cli.js without node.exe
  #      prefix, EFTYPE
  # Uses pwsh (pre-installed on windows-latest) per the repo-lint
  # `no-bash-on-windows.test.ts`. See change: enable-standalone-npm-install
  # task 7.4 sub-bullet 3.
  standalone-install-smoke-windows:
    name: standalone-install-smoke-windows (node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Single Node 22 leg keeps the documented 7-leg gate contract
        # (6 Linux + 1 Windows). Adding 24/25 here triples Windows spend
        # without matching the contract test in no-bash-on-windows.
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # Engine-strict override kept for continuity; see the corrected rationale
      # on standalone-install-smoke-linux (the appdmg justification was false).
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm run build
      - name: Run standalone install smoke
        shell: pwsh
        run: ./scripts/test-standalone-npm-install.ps1 -Port 18000
      - name: Windows introspection smoke (real PowerShell Get-CimInstance, no wmic)
        # Exercises isVirtualMachine + defaultGetCmdline against LIVE PowerShell
        # on a real Windows host (stub unit tests can't) and asserts no wmic /
        # 'not recognized' leak to stderr. See change: replace-wmic-with-powershell.
        shell: pwsh
        run: npx tsx scripts/windows-introspection-smoke.ts
      - name: Windows forbidden grant-subjects smoke (platform-scoped list)
        # The host's %SystemRoot% is listed and no POSIX directory leaks in as
        # drive-rooted junk (C:\etc). Unit tests can only simulate win32 on
        # POSIX. See change: surface-denial-remedy-in-previews (test-plan #E24).
        shell: pwsh
        run: npx tsx scripts/windows-forbidden-subjects-smoke.ts
      - name: Windows boot-parent-liveness smoke (koffi Tier-2 load)
        # Proves boot-parent-liveness Tier-2 (koffi OpenProcess +
        # WaitForSingleObject) loads on a REAL Windows host — unit tests cannot
        # mock koffi/kernel32. Asserts computeBootParentAlive() is boolean and
        # the ACTIVE tier is "tier2" (not the Tier-1 fallback). Guards a silent
        # Windows-wide degrade. See change: electron-attach-ownership-fixes (1b.4).
        shell: pwsh
        run: npx tsx scripts/windows-liveness-smoke.ts

  # EOL Node 23 loader tiers (test-plan #X2). Outside the supported-set matrix
  # above on purpose: Node 23 is EOL and stays out of `engines`, but the
  # Node-native loader still has to boot on it for users who have not moved.
  #   23.1.0 -> tier 3: no `stripTypeScriptTypes`, strips with the bundled `amaro`
  #   23.4.0 -> tier 2: `module.register` + the native stripper (no registerHooks)
  # The workspace is BUILT and PACKED on Node 24 (the toolchain does not support
  # 23.x), then the packed tarballs are installed and booted on the 23.x leg —
  # the same bytes a user installs. `--engine-strict=false` mirrors the user who
  # installs past an engines mismatch. The boot script asserts health 200, no
  # stripTypeScriptTypes ExperimentalWarning / DEP0205 and no MODULE_NOT_FOUND
  # for `amaro` in server.log.
  # See change: strip-only-native-ts-loader (design D4).
  standalone-install-smoke-eol-node23:
    name: standalone-install-smoke-eol-node23 (node ${{ matrix.node-version }}, ${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 23.1.0
            tier: tier 3 (bundled amaro)
          - node-version: 23.4.0
            tier: tier 2 (register + native stripper)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm run build
      - name: Pack workspaces (built on Node 24)
        run: bash scripts/test-standalone-npm-install.sh --pack-only "$RUNNER_TEMP/packs"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install packed tarballs and boot on the EOL Node
        run: |
          node --version
          bash scripts/test-standalone-npm-install.sh --port 18000 \
            --tarballs "$RUNNER_TEMP/packs" --install-arg --engine-strict=false

  # In-place upgrade continuity on Node 26 (test-plan #X7). A server started by
  # the last release that selected jiti on Node 26 keeps `--import <jiti>` in its
  # execArgv and carries it across `POST /api/restart`. Upgrading the install
  # underneath it must not strand it:
  #   restart 1 -> healthy, and EITHER new code runs under the OLD loader (jiti
  #                stays installed as the transitional dependency) with a
  #                foreign-loader warning naming jiti in server.log, OR it
  #                already landed on native-ts-register.mjs: the old server's
  #                /api/restart runs the restart orchestrator from DISK (new
  #                code), whose server-launcher always resolves the native
  #                loader (observed on the 0.9.0 baseline);
  #   restart 2 -> the new server normalizes the restart: healthy + argv names
  #                native-ts-register.mjs.
  # UPGRADE_FROM_VERSION is PINNED to the last pre-change release: a floating
  # `latest` would stop testing the jiti hand-over the moment this change ships.
  # Bump it only to another release whose server still selects jiti on Node 26.
  # See change: strip-only-native-ts-loader (design D5).
  standalone-install-upgrade-continuity:
    name: standalone-install-upgrade-continuity (node 26)
    runs-on: ubuntu-latest
    env:
      UPGRADE_FROM_VERSION: "0.9.0"
      PORT: "18000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # No dependency cache: a restored cache would run before `pnpm install` /
          # `pnpm run build` (CodeQL actions/cache-poisoning).
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack workspaces
        run: bash scripts/test-standalone-npm-install.sh --pack-only "$RUNNER_TEMP/packs"
      - name: Start the previous release, upgrade in place, restart twice
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/pi-dashboard-install"
          cd "$HOME/pi-dashboard-install"
          npm init -y >/dev/null
          BIN="$PWD/node_modules/.bin/pi-dashboard"
          LOG="$HOME/.pi/dashboard/server.log"
          export PI_DASHBOARD_PORT="$PORT"
          trap '"$BIN" stop >/dev/null 2>&1 || true; echo "--- server.log tail ---"; tail -n 80 "$LOG" 2>/dev/null || true' EXIT

          ident() {
            curl -fsS "http://localhost:$PORT/api/health" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.pid+'@'+j.startedAt)})"
          }
          wait_healthy() {
            for _ in $(seq 1 45); do
              ident >/dev/null 2>&1 && return 0
              sleep 2
            done
            echo "FAIL: /api/health never answered 200 within 90s"; return 1
          }
          # argv of the process that answers /api/health (its reported pid). Not
          # "first cli.ts process": a `cli.ts start` launcher (which may still run
          # under the inherited jiti --import) can outlive the spawn briefly.
          server_argv() { local id; id=$(ident); ps -o args= -p "${id%%@*}"; }
          # POST /api/restart, then wait for a NEW process (pid@startedAt changes).
          restart_and_wait() {
            local before; before=$(ident)
            curl -fsS -X POST "http://localhost:$PORT/api/restart" >/dev/null 2>&1 || true
            for _ in $(seq 1 45); do
              sleep 2
              local after; after=$(ident 2>/dev/null || true)
              if [ -n "$after" ] && [ "$after" != "$before" ]; then return 0; fi
            done
            echo "FAIL: no replacement server observed after /api/restart"; return 1
          }

          echo "== install and start the previous release ($UPGRADE_FROM_VERSION) =="
          npm install --no-audit --no-fund \
            "@blackbelt-technology/pi-agent-dashboard@$UPGRADE_FROM_VERSION" \
            "@blackbelt-technology/pi-dashboard-server@$UPGRADE_FROM_VERSION" 2>&1 | tail -3
          "$BIN" start >/dev/null 2>&1 &
          wait_healthy
          ARGV=$(server_argv)
          echo "argv: $ARGV"
          if [[ "$ARGV" != *jiti* ]]; then
            echo "FAIL: premise broken — the previous release is not running under jiti on Node 26"; exit 1
          fi

          echo "== upgrade in place to the packed tarballs =="
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz 2>&1 | tail -3
          node -e "const d=require(process.argv[1]).dependencies||{};if(!d.amaro){console.error('packed shared is missing amaro');process.exit(1)}" \
            "$PWD/node_modules/@blackbelt-technology/pi-dashboard-shared/package.json"

          echo "== restart 1: new code, inherited jiti loader or already native =="
          restart_and_wait
          wait_healthy
          ARGV1=$(server_argv)
          echo "argv: $ARGV1"
          if [[ "$ARGV1" == *native-ts-register.mjs* ]]; then
            echo "restart 1: healthy, already on the native loader (orchestrator ran from disk)"
          elif awk 'tolower($0) ~ /jiti/ && /pi-dashboard stop/ { f = 1 } END { exit !f }' "$LOG"; then
            echo "restart 1: healthy, foreign-loader warning names jiti"
          else
            echo "FAIL (restart 1): neither on the native loader nor a foreign-loader warning naming jiti"; exit 1
          fi

          echo "== restart 2: normalized to the native loader =="
          restart_and_wait
          wait_healthy
          ARGV=$(server_argv)
          echo "argv: $ARGV"
          if [[ "$ARGV" != *native-ts-register.mjs* ]]; then
            echo "FAIL (restart 2): argv does not name native-ts-register.mjs"; exit 1
          fi
          echo "restart 2: healthy, argv names native-ts-register.mjs"
