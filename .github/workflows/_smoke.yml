name: Standalone install smoke (reusable)

# Reusable workflow that runs the full standalone-install-smoke matrix
# (Linux × 8: Node 22/24/25/26 × bookworm-slim/alpine + Windows × 1: Node 22).
#
# Consumed by:
#   - .github/workflows/ci-smoke.yml  (on-demand manual dispatch)
#   - .github/workflows/publish.yml   (release gate before npm publish)
#
# This workflow MUST NOT publish to npm or create a GitHub Release. It only
# packs the workspace into tarballs, installs into a clean HOME, and asserts
# pi-dashboard bootstrap reaches ready. Publishing remains the sole
# responsibility of publish.yml's `publish` + `github-release`.
#
# See change: gate-publish-on-smoke-and-tests.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (sha or branch) to check out before packing
        type: string
        required: true

jobs:
  # Pack the workspace into tarballs, install into a clean HOME, launch
  # pi-dashboard, assert bootstrap reaches ready. Guards against the v0.5.3
  # regressions captured in docs/repro/. See change:
  # enable-standalone-npm-install task 7.4.
  standalone-install-smoke-linux:
    name: standalone-install-smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node:22-bookworm-slim
            node-version: 22
          - image: node:22-alpine
            node-version: 22
          - image: node:24-bookworm-slim
            node-version: 24
          - image: node:24-alpine
            node-version: 24
          - image: node:25-bookworm-slim
            node-version: 25
          - image: node:25-alpine
            node-version: 25
          - image: node:26-bookworm-slim
            node-version: 26
          - image: node:26-alpine
            node-version: 26
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install base tooling (Debian/Ubuntu)
        if: contains(matrix.image, 'bookworm') || contains(matrix.image, 'debian')
        # bzip2 is required to extract phantomjs-prebuilt's .tar.bz2 at install
        # time (pulled transitively via electron-icon-builder → icon-gen →
        # svg2png). TODO: evict electron-icon-builder to drop deprecated
        # phantomjs from the install graph.
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl bash procps bzip2
      - name: Install base tooling (Alpine)
        if: contains(matrix.image, 'alpine')
        run: apk add --no-cache git ca-certificates curl bash procps bzip2
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # actions/setup-node mounts the host runner's glibc Node into the
      # container and prepends it to PATH. On Alpine (musl) that binary
      # fails to exec with "required file not found". The node:<major>-*
      # images already ship a matching Node, so skip setup-node on Alpine.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: "!contains(matrix.image, 'alpine')"
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # The engine-strict override is kept on the pre-26 legs for continuity
      # only. Its stated rationale ("the transitive appdmg engine range
      # fail-fasts on Node 24/25") is FALSE and was corrected in change
      # fix-pi-install-node26-and-omit-dev-build: `appdmg@0.6.6` declares
      # `engines: {node: '>=8.5'}` with `os: [darwin]` — no upper bound, and
      # platform-filtered out of Linux installs entirely. The real historical
      # cause per root `.npmrc` was native compilation of `macos-alias`.
      # A whole-lockfile scan finds exactly one upper-bounded engines range
      # (`>=6 <7 || >=8`), which admits Node 26.
      - name: Install deps (engine-strict override, pre-26 legs)
        if: matrix.node-version != 26
        run: pnpm install --frozen-lockfile --config.engine-strict=false
      # Node 26 legs run WITHOUT the override so the EBADENGINE half of #357 is
      # regression-tested rather than assumed — with the override in place CI
      # cannot distinguish "cap fixed" from "still refused".
      # SCOPE: this leg runs `pnpm install`, whereas pi runs `npm install
      # --omit=dev`; pnpm and npm resolve `engine-strict` through different
      # config cascades. It proves the manifest engines range admits Node 26
      # under a strict installer, NOT the exact pi codepath (that is
      # `qa/tests/15-omit-dev-build.sh` arm 2, end-to-end is the manual M1).
      # If this leg unexpectedly reds, restore the override HERE and record the
      # real blocker in this comment.
      - name: Install deps (engine-strict ON — Node 26 regression gate for #357)
        if: matrix.node-version == 26
        run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run standalone install smoke
        run: bash scripts/test-standalone-npm-install.sh --port 18000

  # Windows counterpart of standalone-install-smoke-linux. Locks down the
  # three Windows-only spawn bugs fixed in 0f2d08aa that escaped CI to a
  # user-reported Windows 11 reproduction:
  #   1. shouldUrlWrapEntry mis-wrapping jiti entries with file:///C:/…
  #      (Node misnormalises triple-slash on the entry argv)
  #   2. runNpmOnce spawn EFTYPE on npm.cmd (CVE-2024-27980 mitigation
  #      requires shell:true for .cmd/.bat shims)
  #   3. nodeScriptToArgv falling back to [resolvedPath] when
  #      registry.resolve("node") fails — spawned cli.js without node.exe
  #      prefix, EFTYPE
  # Uses pwsh (pre-installed on windows-latest) per the repo-lint
  # `no-bash-on-windows.test.ts`. See change: enable-standalone-npm-install
  # task 7.4 sub-bullet 3.
  standalone-install-smoke-windows:
    name: standalone-install-smoke-windows (node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Single Node 22 leg keeps the documented 7-leg gate contract
        # (6 Linux + 1 Windows). Adding 24/25 here triples Windows spend
        # without matching the contract test in no-bash-on-windows.
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # Engine-strict override kept for continuity; see the corrected rationale
      # on standalone-install-smoke-linux (the appdmg justification was false).
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm run build
      - name: Run standalone install smoke
        shell: pwsh
        run: ./scripts/test-standalone-npm-install.ps1 -Port 18000
      - name: Windows introspection smoke (real PowerShell Get-CimInstance, no wmic)
        # Exercises isVirtualMachine + defaultGetCmdline against LIVE PowerShell
        # on a real Windows host (stub unit tests can't) and asserts no wmic /
        # 'not recognized' leak to stderr. See change: replace-wmic-with-powershell.
        shell: pwsh
        run: npx tsx scripts/windows-introspection-smoke.ts
      - name: Windows boot-parent-liveness smoke (koffi Tier-2 load)
        # Proves boot-parent-liveness Tier-2 (koffi OpenProcess +
        # WaitForSingleObject) loads on a REAL Windows host — unit tests cannot
        # mock koffi/kernel32. Asserts computeBootParentAlive() is boolean and
        # the ACTIVE tier is "tier2" (not the Tier-1 fallback). Guards a silent
        # Windows-wide degrade. See change: electron-attach-ownership-fixes (1b.4).
        shell: pwsh
        run: npx tsx scripts/windows-liveness-smoke.ts
