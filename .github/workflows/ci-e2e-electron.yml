name: CI Electron E2E

# Playwright-Electron suite (native-surface flows the web-client E2E and unit
# tests cannot reach): zombie-adoption modal, Doctor version-skew row, tray
# foreign row. Packages the app (electron-forge package) then runs the specs.
# Matrix: ubuntu-latest (POSIX zombie branch, under xvfb) + windows-latest (the
# win32 `decideIsZombie` branch — bootParentAlive-only — in the REAL app; task
# 7.4b detection safety net) + macos-latest (darwin native-surface path, #531).
#
# Cadence (change: run-electron-e2e-native-surface, add-missing-ci-legs): the
# `electron-e2e` matrix is keyed on `github.event_name` ONLY (defined on every
# event), so GitHub-hosted macOS minutes (10x billing) never land on the PR path:
#
#   event                      ubuntu  windows  macOS  job-object-windows  runtime-overlay-e2e
#   pull_request (path filter)   x       x        -           x                    x
#   workflow_dispatch (any ref)  x       x        x           x                    x
#   schedule (nightly, default)  -       -        x           -                    -
#
# Opt a PR in (any PR, incl. an Electron major bump outside the path filter):
#   gh workflow run ci-e2e-electron.yml --ref <branch>
# There is deliberately NO `labeled` trigger: an unrelated label event would
# join the per-ref concurrency group and cancel the in-flight run.
# ADVISORY — not a required check (no branch-protection gate); no matrix leg is
# `continue-on-error` (a darwin regression must turn the run red, not hide);
# job-object-windows alone is `continue-on-error`. macOS is arm64 only (the app
# is packaged and run on the same runner, so arch matches by construction).
# COVERAGE GAP (#531): while the `test.fixme(process.platform === "darwin", …/issues/531)`
# quarantine in tests/e2e-electron/zombie-adoption.electron.spec.ts stands, the
# macOS leg does NOT cover zombie-adoption (all three of its tests hang on
# darwin); it covers the remaining native-surface specs (Doctor version-skew,
# tray foreign row). Exit criteria are recorded on #531.
# Locked by packages/shared/src/__tests__/e2e-electron-workflow-contract.test.ts.
# See change: electron-attach-ownership-fixes (harness), run-electron-e2e-native-surface (cadence).

on:
  workflow_dispatch:
  # Nightly, macOS only (see the matrix expression); every other job is gated
  # off `schedule` below.
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches: [develop]
    paths:
      - "packages/electron/**"
      - "tests/e2e-electron/**"
      - "playwright.electron.config.ts"
      - ".github/workflows/ci-e2e-electron.yml"
      - "packages/server/src/runtime-overlay/**"
      - "scripts/runtime-e2e-registry.mjs"
      - "scripts/generate-runtime-lock.mjs"
      - "scripts/lib/runtime-release.mjs"
      - "scripts/nightly-verdaccio-serve.mjs"
      - "scripts/nightly-verdaccio-publish.mjs"

concurrency:
  group: ci-e2e-electron-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: jobs that need more declare it at job level.
# Pinned by packages/shared/src/__tests__/workflow-token-cache-contract.test.ts.
# See change: harden-ci-cache-poisoning.
permissions:
  contents: read

jobs:
  electron-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(
          github.event_name == 'schedule' && '["macos-latest"]' ||
          github.event_name == 'workflow_dispatch' && '["ubuntu-latest","windows-latest","macos-latest"]' ||
          '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm re-resolves the full platform optional-dep tree from
      # pnpm-lock.yaml, so the npm/cli#4828 OS-split clean-install fallback is
      # gone — one cross-platform install step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Package the app for this OS (bundled Node skipped when absent; the E2E
      # attaches to a fake server, so no real server spawn is needed).
      - name: Package Electron app
        run: pnpm --filter @blackbelt-technology/pi-dashboard-electron run package

      # Electron needs Chromium's system libraries; ubuntu-latest images no
      # longer ship them all. install-deps pulls libnss3/libgbm/libatk/etc.
      # without downloading a browser binary (Electron uses its own).
      - name: Install Electron system libraries (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium

      # ubuntu-24.04 (noble) blocks unprivileged user namespaces via AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), which breaks Chromium/
      # Electron launch even with --no-sandbox. Relax it for the runner.
      - name: Allow unprivileged user namespaces (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Linux needs a virtual display (xvfb); Windows runners have a desktop
      # session, so Electron launches directly. Playwright uses the packaged
      # app's own Electron binary (no chromium download needed).
      - name: Run Electron E2E under xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:e2e:electron
        env:
          CI: "1"
      # Windows + macOS: both have a desktop session, so Electron launches
      # directly. `!= 'Linux'` (not `== 'Windows'`) so the macOS leg actually
      # runs specs instead of packaging the app and going green on nothing.
      - name: Run Electron E2E (Windows, macOS)
        if: runner.os != 'Linux'
        run: pnpm run test:e2e:electron
        env:
          CI: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron-${{ matrix.os }}
          path: playwright-report-electron
          retention-days: 14

  # Job Object kill-on-close (task 7.4a) — spawn-mode (NOT the fake-server
  # attach specs): the app must boot a real server so the taskkill /F cascade
  # can be observed. Separate job so it never shares :8000 with the E2E specs.
  # ── Runtime overlay update cycle vs a local registry (test-plan X10–X12) ──
  # Loopback Verdaccio serves the runtime closure at base (= app version, so
  # bundle-server installs from it), good (`latest`, with runtime-lock.json)
  # and broken (server exits at boot). The app is packaged WITH a bundled
  # server (the electron-e2e job above packages without one, so these specs
  # skip there). ADVISORY like the rest of this workflow.
  # See change: electron-runtime-release-pipeline (tasks 3.1–3.4).
  runtime-overlay-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      REGISTRY: http://localhost:4873
      PW_RUNTIME_REGISTRY: http://localhost:4873
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Node.js binary
        run: |
          cd packages/electron
          source scripts/_node-version.sh
          bash scripts/download-node.sh "$BUNDLED_NODE_VERSION" linux x64

      - name: Build client
        run: pnpm run build

      - name: Start Verdaccio (throwaway storage)
        run: |
          npm install -g verdaccio
          echo "VERDACCIO_CONFIG=$(node scripts/runtime-e2e-registry.mjs config --dir "$RUNNER_TEMP/verdaccio")" >> "$GITHUB_ENV"

      - name: Serve Verdaccio
        run: node scripts/nightly-verdaccio-serve.mjs

      - name: Publish base runtime (the app's own version)
        run: node scripts/runtime-e2e-registry.mjs publish --release base

      - name: Bundle dashboard server (installs from Verdaccio)
        env:
          npm_config_registry: http://localhost:4873
          GIT_TARGET_ARCH: x64
        run: |
          node packages/electron/scripts/bundle-server.mjs
          node packages/electron/scripts/assert-runnable-bundle.mjs

      - name: Package Electron app
        run: pnpm --filter @blackbelt-technology/pi-dashboard-electron run package

      - name: Publish good + broken runtime releases
        run: |
          node scripts/runtime-e2e-registry.mjs publish --release good
          node scripts/runtime-e2e-registry.mjs publish --release broken

      - name: Install Electron system libraries
        run: pnpm exec playwright install-deps chromium

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run runtime overlay E2E under xvfb
        run: xvfb-run -a pnpm exec playwright test --config playwright.electron.config.ts runtime-overlay-update
        env:
          CI: "1"
          PW_ELECTRON_GLOBAL_TIMEOUT_MS: "3600000"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron-runtime-overlay
          path: playwright-report-electron
          retention-days: 14

  job-object-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # Advisory: exercising the Job Object cascade needs the packaged app's FULL
    # spawn path to boot a real server, which a lightweight `electron-forge
    # package` on a GHA runner does not reliably provide (INFRA: never brought a
    # server up). Deep real-launch validation belongs in the qa VM smoke
    # (qa/tests, cf. 08-electron-real-launch.sh). Kept here to attempt the
    # cascade + surface a true FAIL, without blocking the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      # Bundle Node so the packaged app can actually SPAWN a server (the attach
      # E2E jobs don't need this, but the Job Object cascade requires a real
      # server boot, not the execpath fallback). Mirrors _electron-build.yml.
      - name: Download Node.js binary (Windows)
        shell: pwsh
        run: |
          $version = (Select-String -Path packages/electron/scripts/_node-version.sh -Pattern 'BUNDLED_NODE_VERSION="([^"]+)"').Matches[0].Groups[1].Value
          $arch = "x64"
          $url = "https://nodejs.org/dist/$version/node-$version-win-$arch.zip"
          $outDir = "packages/electron/resources/node"
          New-Item -ItemType Directory -Force -Path $outDir
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath temp-node
          Copy-Item "temp-node/node-$version-win-$arch/node.exe" "$outDir/"
          Copy-Item -Recurse "temp-node/node-$version-win-$arch/node_modules" "$outDir/"
          Remove-Item -Recurse -Force temp-node, node.zip
      - name: Package Electron app
        run: pnpm --filter @blackbelt-technology/pi-dashboard-electron run package
      - name: Job Object kill-on-close smoke (taskkill /F cascade)
        shell: pwsh
        run: pnpm exec tsx scripts/windows-job-object-smoke.ts
