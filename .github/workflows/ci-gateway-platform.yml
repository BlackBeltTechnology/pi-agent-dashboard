name: Gateway transport (cross-platform)

# The gateway's transport is decided BY THE PLATFORM, so a single-OS gate
# cannot see most of it: POSIX gets a unix socket and no TCP port at all,
# Windows has no socket path and falls back to loopback + token. Each side is
# the other's blind spot, and until now only the POSIX side was ever run.
#
# Deliberately NOT part of `ci.yml`, which is a cheap per-PR safety net on one
# runner. This boots a real dashboard on three operating systems; it belongs on
# a dispatch, next to `ci-smoke.yml`, and on pushes that touch the transport.
#
# tasks 5.1, 5.5, 5.7, 12.53, 13.8
# See change: add-pi-gateway-transport-identity.

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "packages/shared/src/dashboard-paths.ts"
      - "packages/server/src/pi/pi-gateway.ts"
      - "packages/server/src/lifecycle/**"
      - "packages/extension/src/endpoint-resolution.ts"
      - "packages/extension/src/bridge.ts"
      - "qa/tests/28-gateway-windows.ps1"
      - "qa/tests/29-gateway-posix-no-tcp.sh"
      # Pid-target kill safety (scope-pids-to-namespace).
      - "packages/server/src/session/pid-target.ts"
      - "packages/server/src/spawn-process/session-terminator.ts"
      - "packages/server/src/browser-handlers/session-action-handler.ts"
      - "packages/shared/src/pid-namespace.ts"
      - "qa/tests/54-pid-target.sh"
      - "qa/tests/54-windows-pid-target.ps1"
      - "qa/tests/lib/pid-target-probe.ts"
      # Restored headless pid identity (guard-restored-headless-identity).
      - "packages/server/src/spawn-process/headless-pid-registry.ts"
      - "packages/server/src/spawn-process/restored-identity.ts"
      - "qa/tests/57-restored-pid-identity.sh"
      - "qa/tests/57-restored-pid-identity.ps1"
      - "qa/tests/lib/restored-pid-identity-probe.ts"
      - ".github/workflows/ci-gateway-platform.yml"

# Least-privilege default: jobs that need more declare it at job level.
# Pinned by packages/shared/src/__tests__/workflow-token-cache-contract.test.ts.
# See change: harden-ci-cache-poisoning.
permissions:
  contents: read

jobs:
  posix:
    name: no bridge TCP port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The client's vite build (run by `packages/client` prepare on install)
    # outgrew Node 22's default heap: OOM (exit 134) on macos-latest, run
    # 39965852941. Same ceiling as _electron-build.yml (26d3ec6ce).
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The arm calls `pi-dashboard` on PATH. Running from source via the bin
      # wrapper (native strip-only loader) keeps CI testing THIS checkout rather than a published build.
      - name: Shim pi-dashboard to this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/usr/bin/env bash\nexec node "%s/packages/server/bin/pi-dashboard.mjs" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/shim/pi-dashboard"
          chmod +x "$RUNNER_TEMP/shim/pi-dashboard"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Default start binds no bridge TCP port
        run: bash qa/tests/29-gateway-posix-no-tcp.sh
      # X80/X81: non-local pids are never signalled (X81 needs root + unshare).
      # See change: scope-pids-to-namespace.
      - name: Pid target — non-local pids never signalled
        run: bash qa/tests/54-pid-target.sh
      # X9/X10: a recycled restored pid is never signalled; a genuine orphan
      # still is. See change: guard-restored-headless-identity.
      - name: Restored headless pid identity
        run: bash qa/tests/57-restored-pid-identity.sh

  windows:
    name: loopback fallback + credential ACLs (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm run build
      - name: Gateway transport + identity on Windows
        shell: pwsh
        env:
          QA_REPO_ROOT: ${{ github.workspace }}
        run: ./qa/tests/28-gateway-windows.ps1
      # X82–X86: WSL pids never taskkilled; legacy native pi stoppable (Q8).
      # See change: scope-pids-to-namespace.
      - name: Pid target on Windows
        shell: pwsh
        env:
          QA_REPO_ROOT: ${{ github.workspace }}
        run: ./qa/tests/54-windows-pid-target.ps1
      # X11/X12: no start-time probe on win32 ⇒ a restored pid is unverifiable:
      # never 7-day-killed, never signalled by an unattended stop.
      # See change: guard-restored-headless-identity.
      - name: Restored headless pid identity on Windows
        shell: pwsh
        env:
          QA_REPO_ROOT: ${{ github.workspace }}
        run: ./qa/tests/57-restored-pid-identity.ps1
