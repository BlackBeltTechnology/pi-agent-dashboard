name: CI

# Cheap PR safety net: lint + test + build on Node 22.
# The standalone-install-smoke matrix moved to `_smoke.yml` (reusable),
# triggered manually via `ci-smoke.yml` or automatically as the release
# gate inside `publish.yml`. See change: gate-publish-on-smoke-and-tests.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm re-resolves the full platform optional-dep tree from pnpm-lock.yaml,
      # so the npm/cli#4828 clean-install fallback (macOS-generated lockfile
      # missing @rollup/rollup-linux-x64-gnu on ubuntu) is no longer needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Hard-gates Tier A (error-severity) regressions; Tier B/C (warn) only annotate.
      - name: Biome static analysis (Tier A gate, warn-tier annotate)
        run: pnpm exec biome lint . --reporter=github
      - run: pnpm test
      - run: pnpm run build
