name: CI

# PR + develop-push safety net on Node 22, as parallel jobs (change:
# speed-up-ci-affected-tests, D5): `ci` (guards, lint, typecheck, Biome, build)
# runs beside `select`, whose affected-test selection drives `unit` (4 shards),
# `real-process` and `ci-scenarios`; `ci-result` aggregates and checks the
# selection's expectations. Wall time = the slowest job, not the sum. The full
# suite runs nightly (nightly-tests.yml), on `workflow_dispatch`, and on the
# next push to a PR labelled `ci:full`.
# The standalone-install-smoke matrix moved to `_smoke.yml` (reusable),
# triggered manually via `ci-smoke.yml` or automatically as the release
# gate inside `publish.yml`. See change: gate-publish-on-smoke-and-tests.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # Always a FULL run (the selector's `--full`). Dispatch on a PR branch for an
  # immediate full run; the `ci:full` label takes effect on the next push.
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; develop pushes (grouped by SHA) never are.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── affected-test selection ────────────────────────────────────────────────
  # Change: speed-up-ci-affected-tests (D5). Computes which vitest files the
  # diff can affect (vitest's own import graph + path literals + package
  # fallback + checked-in data under scripts/test-selection/) and records the
  # decision as the `test-selection` artifact and the job summary — the only
  # evidence of what a run skipped. Any selector error, all-zero or
  # non-ancestor base yields `mode: full`.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      has_real_process: ${{ steps.select.outputs.has_real_process }}
      ci_scenarios: ${{ steps.select.outputs.ci_scenarios }}
    steps:
      # Full history for BOTH event kinds: a shallow clone has no merge-base
      # (PR) and no `before` commit (push), which would force every run full.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select affected tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/select-affected-tests.mjs --full --reason "workflow_dispatch" --out selection.json
          elif [ "$FULL_LABEL" = "true" ]; then
            node scripts/select-affected-tests.mjs --full --reason "ci:full label on the pull request" --out selection.json
          elif [ "$EVENT" = "pull_request" ]; then
            node scripts/select-affected-tests.mjs --base "origin/$BASE_REF" --merge-base --out selection.json
          else
            node scripts/select-affected-tests.mjs --base "$BEFORE" --out selection.json
          fi

      - name: Upload test selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: selection.json
          retention-days: 14
          if-no-files-found: error

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm re-resolves the full platform optional-dep tree from pnpm-lock.yaml,
      # so the npm/cli#4828 clean-install fallback (macOS-generated lockfile
      # missing @rollup/rollup-linux-x64-gnu on ubuntu) is no longer needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Single-source openspec-version gate: fail on server↔extension floor drift
      # on develop, not only at release. See change: provision-openspec-cli-in-sessions.
      - name: Verify release dependency shape
        run: node scripts/verify-release-deps.mjs
      # Spec-integrity gate. The openspec-version gate above checks the CLI, not
      # the specs it reads. In that blind spot 80 of 546 main specs had drifted
      # into unparseable states (delta headers copied verbatim by the archive
      # path), hiding 384 requirement blocks from validate/list/show/archive.
      # A change that archives into a corrupt spec now fails here instead of
      # rotting. Reproduce locally with `npm run spec:validate`.
      # See change: repair-corrupted-main-specs.
      - name: Validate OpenSpec main specs
        run: npm run spec:validate
      # Skill frontmatter guard. Errors (missing/empty/unparseable `description`
      # — pi drops the skill) block the PR; warnings (pi's length/charset limits
      # and the repository description budget) only annotate.
      # See change: fix-skill-discovery-parity.
      - name: Skill frontmatter guard
        run: node scripts/check-skill-frontmatter.mjs
      # Fixed-tick wait guard. Bans the "await a bare-resolve setTimeout as a
      # barrier, then assert one-shot" pattern in client tests — the scheduling
      # race that made local runs rotate red while CI stayed green. Deliberate
      # timer yields opt out per occurrence with an inline comment naming the
      # reason. See change: make-test-suite-deterministic.
      - name: Fixed-tick wait guard
        run: node scripts/check-fixed-tick-waits.mjs
      # Portability gate on committed `.pi/settings.json`. `pi install <path>`
      # and `pi config` both WRITE the resolved absolute path, so the
      # machine-specific form is the tooling's default output, not a typo. The
      # repo shipped `/Users/robson/...` long enough that kb-extension silently
      # failed to load for every other developer. A relative source resolves
      # against the settings file's own directory, so `".."` is the repo root
      # everywhere. See issue #371.
      - name: No machine-specific paths in .pi/settings.json
        run: node scripts/check-pi-settings-paths.mjs
      # Publish-correctness gate. Stricter than Biome's noUndeclaredDependencies:
      # it derives each workspace's shipped file set from `npm pack --dry-run`
      # and refuses a devDependency as justification for a shipped import,
      # because npm does not install devDependencies for a consumer. Catches the
      # manifest regression before release rather than after publication.
      # See change: cleanup-undeclared-dependencies.
      - name: Verify published imports are declared
        run: node scripts/verify-published-imports.mjs
      # Dynamic install-load check (change: fix-browser-plugin-vendor-specifier-resolution).
      # The static check above proves every shipped import is DECLARED; it cannot
      # prove the import RESOLVES — tsconfig `paths`, a bundler alias and
      # JITI_TSCONFIG_PATHS all satisfy a static check while failing a consumer.
      # This packs the changed plugins (+ browser-plugin, the guard's own subject)
      # with their first-party workspace deps from the working tree, installs them
      # OUTSIDE the repo, and imports each server entry under node+jiti with the
      # env var unset and no repo tsconfig reachable. Scoped to changed plugins so
      # the leg stays inside the per-PR budget (test-plan P2); the nightly job runs
      # every workspace. See change: fix-browser-plugin-vendor-specifier-resolution.
      - name: Plugin install-load (changed plugins, + browser-plugin)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/verify-plugin-install-load.mjs --changed "origin/${{ github.base_ref }}"
      # kb engine freshness gate. dist/ is gitignored, so a CI build is fresh by
      # construction and can never observe lag; the COMMITTED engine-fingerprint
      # can. A commit that edits packages/kb src without rebuilding fails here
      # instead of shipping a `kb` bin that runs a week-old engine against the
      # fresh kb_search tool. See change: fix-kb-eval-measurement-integrity.
      - name: kb dist freshness (engine fingerprint)
        run: node scripts/check-kb-dist-fresh.mjs
      - run: pnpm run lint
      # Typechecks tests/e2e + guards the reap-fixture import. The root tsconfig
      # only includes `packages/*/src`, so before change
      # fix-e2e-harness-memory-exhaustion NOTHING under tests/ was ever seen by
      # tsc. That matters now that `tests/e2e/fixtures.ts` is the single import
      # surface for all 87 specs: a missing `export type` there breaks every
      # spec at once while the import guard still passes.
      - name: Typecheck + guard the browser-E2E suite
        run: pnpm run lint:e2e
      # Hard-gates Tier A (error-severity) regressions; Tier B/C (warn) only annotate.
      - name: Biome static analysis (Tier A gate, warn-tier annotate)
        run: pnpm exec biome lint . --reporter=github
      # Build and fail on the mechanical warnings removed by
      # `fix-vite-build-warnings`, plus the @mdi/js dynamic-import warning
      # removed by `shrink-client-index-chunk`. The oversized-chunk (>700 kB)
      # aggregate warning stays OUT of scope (monaco is the floor) and must NOT
      # fail this gate.
      - name: Build (fail on regressed warnings)
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/build.log
          fail=0
          if grep -q "Unexpected token" /tmp/build.log; then
            echo "::error::CSS parse error (Unexpected token) re-appeared in the build log"; fail=1
          fi
          if grep -q "Circular chunk" /tmp/build.log; then
            echo "::error::Circular chunk warning re-appeared in the build log"; fail=1
          fi
          if grep -qE "(PdfPreview\.tsx|known-servers-api\.ts) is dynamically imported" /tmp/build.log; then
            echo "::error::PdfPreview / known-servers-api dynamic-import warning re-appeared"; fail=1
          fi
          if grep "dynamic import will not move module into another chunk" /tmp/build.log | grep -q "@mdi/js"; then
            echo "::error::@mdi/js dynamic-import warning re-appeared (harden-ios-safari-memory-and-ws-diagnostics)"; fail=1
          fi
          exit $fail
      # Second publish-imports run, on the BUILT tree. The first run (above) sees
      # an unbuilt tree, so the root's shipped `packages/dist/` bundle output was
      # never analysed. It carries no workspace manifest, so it gets no
      # reachable-workspace credit: any bare import there is a consumer break.
      # See change: check-root-package-imports.
      - name: Verify published imports on the built tree
        run: node scripts/verify-published-imports.mjs

  # ── selector-driven test jobs ───────────────────────────────────────────────
  # Each proves it ran what it was assigned (verify-executed): a filter that
  # matched nothing must never read as a green shard. An empty shard skips its
  # steps and succeeds. `enumerated=false` (the selector could not list tests)
  # falls back to `vitest --shard` over everything.
  unit:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-selection
      - name: Read shard assignment
        id: shard
        run: node scripts/test-selection/assigned.mjs selection.json "unit-${{ matrix.shard }}" assigned.txt
      - if: steps.shard.outputs.empty != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.shard.outputs.empty != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Scripts ON: packages/client's `prepare` builds dist/, which the bundle
      # budget tests need (they return early without it — see the assertion).
      - if: steps.shard.outputs.empty != 'true'
        run: pnpm install --frozen-lockfile
      # deck3d browser rows (mermaid harvest, check, snapshot) are opt-in behind
      # `describe.skipIf(!chromiumAvailable())`. Install chromium so they run.
      - name: Install chromium (deck3d browser tests)
        if: steps.shard.outputs.empty != 'true'
        run: npx playwright install chromium --with-deps
      - name: Assert the built client exists (bundle-budget tests need it)
        if: steps.shard.outputs.empty != 'true'
        run: test -f packages/client/dist/index.html || { echo "::error::packages/client/dist/index.html missing — bundle-budget tests would pass vacuously"; exit 1; }
      - name: vitest (assigned files)
        if: steps.shard.outputs.empty != 'true'
        run: |
          if [ "${{ steps.shard.outputs.enumerated }}" = "true" ]; then
            mapfile -t FILES < assigned.txt
            pnpm run test:parallel "${FILES[@]}"
          else
            pnpm run test:parallel --shard=${{ matrix.shard }}/4
          fi
      - name: Verify every assigned file executed
        if: steps.shard.outputs.empty != 'true'
        run: node scripts/test-selection/verify-executed.mjs selection.json "unit-${{ matrix.shard }}" test-results/vitest.json
      # `if: always()` on purpose: the RED run is the one whose report you need.
      # Triage recipe: .pi/skills/ci-troubleshoot/SKILL.md.
      - name: Upload vitest JSON report
        if: always() && steps.shard.outputs.empty != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-unit-${{ matrix.shard }}
          path: test-results/vitest.json
          retention-days: 14
          if-no-files-found: warn

  # The real-process phase (change: isolate-real-process-tests) on its own
  # runner: never concurrent with the parallel projects on one machine.
  # maxWorkers 2 and one CI retry come from its config.
  real-process:
    needs: select
    if: needs.select.outputs.has_real_process == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-selection
      - name: Read assignment
        id: files
        run: node scripts/test-selection/assigned.mjs selection.json real-process assigned.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest real-process phase
        run: |
          if [ "${{ steps.files.outputs.enumerated }}" = "true" ]; then
            mapfile -t FILES < assigned.txt
            pnpm run test:real-process "${FILES[@]}"
          else
            pnpm run test:real-process
          fi
      - name: Verify every assigned file executed
        run: node scripts/test-selection/verify-executed.mjs selection.json real-process test-results/vitest-real-process.json
      # A retried pass shows as `status: passed` WITH a retained
      # `failureMessages` entry (vitest 4 has no `retryCount` field).
      - name: Upload vitest JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-real-process
          path: test-results/vitest-real-process.json
          retention-days: 14
          if-no-files-found: warn

  # `ci`-level packaging scenarios (RUN_CI_SCENARIOS=1): only the gated files,
  # never the whole `scripts` project. Held out of the unit shards because they
  # shell out to `npm pack`/`npm publish --dry-run` across every workspace and
  # their CPU spike starves unrelated 5s-timeout tests. Skipped only for an
  # OpenSpec-only diff (root docs ship in the package, so docs diffs count).
  ci-scenarios:
    needs: select
    if: needs.select.outputs.ci_scenarios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-selection
      - name: Read assignment
        run: node scripts/test-selection/assigned.mjs selection.json ci-scenarios assigned.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CI-level publish scenarios (gated files, RUN_CI_SCENARIOS=1)
        run: |
          mapfile -t FILES < assigned.txt
          pnpm run test:ci-scenarios "${FILES[@]}"
      - name: Verify every assigned file executed
        run: node scripts/test-selection/verify-executed.mjs selection.json ci-scenarios test-results/vitest.json
      - name: Upload vitest JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-ci-scenarios
          path: test-results/vitest.json
          retention-days: 14
          if-no-files-found: warn

  # ── required Docker gate ───────────────────────────────────────────────────
  # Change: fix-browser-plugin-vendor-specifier-resolution (test-plan X12).
  #
  # The image was the ONE install mode that worked before the change, and only
  # through the two crutches the change deletes: `docker/entrypoint.sh` execs the
  # wrapper, which stamped `JITI_TSCONFIG_PATHS`, and `Dockerfile` copies
  # `tsconfig.base.json` into the image. With both gone the image has to resolve
  # the vendored relay the way npm / managed / Electron now do — package-relative
  # specifiers and nothing else. A build that succeeds proves nothing about
  # resolution, so this boots the container and reads the server's own plugin log
  # (the same `[plugin-loader]` lines the operator saw when this was broken).
  #
  # Runs on every PR and on every push to develop, so it is a required check:
  # a regression here ships a browser plugin that is dead in three install modes.
  docker-plugin-load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boot the image and assert the browser plugin loads
        env:
          # GitHub-hosted runners refuse the entrypoint's `mount -t overlay`
          # (see the browser-E2E shards), so copy mode is the sanctioned
          # fallback. The Fake faucet is what ENABLES the plugin
          # (`defaultEnabled: false` in its manifest) so the loader actually
          # attempts it — a disabled plugin "loads nothing" successfully.
          TEST_COPY_MODE: "1"
          PI_BROWSER_RELAY_FAKE: "1"
        run: node scripts/verify-docker-plugin-load.mjs

  # Quick-tier Python behaviour of the music-production skills plus the
  # video-production footage-redaction script. The deep tier (essentia,
  # beat_this, demucs, torch) is multi-GB and is NEVER installed here; those
  # tests self-skip. See change: add-music-production-skills (D10).
  music-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Create the quick-tier venv
        run: |
          uv venv -p 3.14
          uv pip install -r packages/music-production/requirements-core.txt pytest

      - name: pytest (music-production + footage-redaction)
        run: .venv/bin/python -m pytest packages/music-production/tests packages/video-production/tests/redaction

  # ── aggregate ────────────────────────────────────────────────────────────────
  # One check that means "this run proved what it had to". Fails when `select`
  # did not succeed, when any job failed or was cancelled, or when a job the
  # selection EXPECTED to run was skipped. A skip counts as success only for a
  # test job the selection did not expect.
  ci-result:
    needs: [select, ci, unit, real-process, ci-scenarios, docker-plugin-load, music-pytest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-selection
      - name: Check every expected job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/test-selection/check-result.mjs selection.json
