name: CI

# Cheap PR safety net: lint + test + build on Node 22.
# The standalone-install-smoke matrix moved to `_smoke.yml` (reusable),
# triggered manually via `ci-smoke.yml` or automatically as the release
# gate inside `publish.yml`. See change: gate-publish-on-smoke-and-tests.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm re-resolves the full platform optional-dep tree from pnpm-lock.yaml,
      # so the npm/cli#4828 clean-install fallback (macOS-generated lockfile
      # missing @rollup/rollup-linux-x64-gnu on ubuntu) is no longer needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Single-source openspec-version gate: fail on server↔extension floor drift
      # on develop, not only at release. See change: provision-openspec-cli-in-sessions.
      - name: Verify release dependency shape
        run: node scripts/verify-release-deps.mjs
      # Skill frontmatter guard. Errors (missing/empty/unparseable `description`
      # — pi drops the skill) block the PR; warnings (pi's length/charset limits
      # and the repository description budget) only annotate.
      # See change: fix-skill-discovery-parity.
      - name: Skill frontmatter guard
        run: node scripts/check-skill-frontmatter.mjs
      # Publish-correctness gate. Stricter than Biome's noUndeclaredDependencies:
      # it derives each workspace's shipped file set from `npm pack --dry-run`
      # and refuses a devDependency as justification for a shipped import,
      # because npm does not install devDependencies for a consumer. Catches the
      # manifest regression before release rather than after publication.
      # See change: cleanup-undeclared-dependencies.
      - name: Verify published imports are declared
        run: node scripts/verify-published-imports.mjs
      - run: pnpm run lint
      # Hard-gates Tier A (error-severity) regressions; Tier B/C (warn) only annotate.
      - name: Biome static analysis (Tier A gate, warn-tier annotate)
        run: pnpm exec biome lint . --reporter=github
      - run: pnpm test
      # Build and fail on the mechanical warnings removed by
      # `fix-vite-build-warnings`, plus the @mdi/js dynamic-import warning
      # removed by `shrink-client-index-chunk`. The oversized-chunk (>700 kB)
      # aggregate warning stays OUT of scope (monaco is the floor) and must NOT
      # fail this gate.
      - name: Build (fail on regressed warnings)
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/build.log
          fail=0
          if grep -q "Unexpected token" /tmp/build.log; then
            echo "::error::CSS parse error (Unexpected token) re-appeared in the build log"; fail=1
          fi
          if grep -q "Circular chunk" /tmp/build.log; then
            echo "::error::Circular chunk warning re-appeared in the build log"; fail=1
          fi
          if grep -qE "(PdfPreview\.tsx|known-servers-api\.ts) is dynamically imported" /tmp/build.log; then
            echo "::error::PdfPreview / known-servers-api dynamic-import warning re-appeared"; fail=1
          fi
          if grep "dynamic import will not move module into another chunk" /tmp/build.log | grep -q "@mdi/js"; then
            echo "::error::@mdi/js dynamic-import warning re-appeared (shrink-client-index-chunk)"; fail=1
          fi
          exit $fail
