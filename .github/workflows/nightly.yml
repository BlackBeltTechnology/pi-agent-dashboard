name: Nightly Verdaccio build

# Scheduled release rehearsal that answers "would tonight's develop produce a
# correct release?" WITHOUT any public npm write. Jobs:
#   resolve         the throwaway nightly version slug
#   verify-publish  `npm@latest` canary: the release's own npm, pnpm install,
#                   build, then every workspace published to ONE loopback
#                   Verdaccio (gates no job)
#   electron        6 legs (_electron-build.yml), each with its own loopback
#                   Verdaccio and the real bundle `npm install` against it
#   smoke           the release gate's standalone-install smoke (_smoke.yml)
#   knip            whole-graph dead-code ratchet
#   install-load    every shipped plugin loads from a published install
#   report          `nightly-report.mjs --jobs-only`: one `nightly` issue,
#                   opened on a red scheduled night, closed on the first green
#                   scheduled one; a dispatch writes the step summary only and
#                   a re-run attempt may open or comment, never close
#
# HARD safety contract (locked by
# packages/shared/src/__tests__/nightly-workflow-contract.test.ts):
#   - NO public `npm publish`: every publish here goes to http://localhost:4873
#     (scripts/nightly-verdaccio-publish.mjs, --registry + a throwaway token)
#   - NO GitHub Release (softprops/action-gh-release)
#   - NO tag push, NO version-bump commit
#
# See changes: add-nightly-verdaccio-build, schedule-release-rehearsal.

on:
  # 04:13 UTC, after the night's nightly-tests.yml has typically finished and
  # before the European working day; minute 13 avoids the top-of-hour schedule
  # load GitHub documents as a cause of delayed or dropped runs. A design
  # choice, not a spec rule (design D1 of schedule-release-rehearsal).
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch: {}

# No run group on purpose (design D6 of schedule-release-rehearsal): a group
# shared with a scheduled run lets a manual dispatch or a re-run cancel, hold or
# replace tonight's run, and a red night would then have no report. Every run
# starts on its own; each Verdaccio is a loopback on its own VM and no job
# writes shared state.

permissions:
  contents: read

jobs:
  # ── resolve: compute the throwaway nightly version slug ────────────────────
  # <base>-nightly.<YYYYMMDD>.<sha7> where <base> = NEXT PATCH of the current
  # package.json version (0.6.1 → 0.6.2). Next-patch (not verbatim) so the
  # nightly sorts ABOVE the last release: a X.Y.Z-nightly.* prerelease sorts
  # BELOW X.Y.Z. Patch is the minimal forward step; the base is a Verdaccio-only
  # label never consumed publicly. See design Decision 3.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.slug.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute nightly version slug
        id: slug
        shell: bash
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          # next patch of the X.Y.Z core (ignore any prerelease suffix)
          base=$(node -e "const m=/^(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1]); if(!m)process.exit(1); console.log(\`\${m[1]}.\${m[2]}.\${Number(m[3])+1}\`)" "$current")
          stamp=$(date -u +%Y%m%d)
          sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          version="${base}-nightly.${stamp}.${sha7}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9a-f]{7}$ ]]; then
            echo "::error::computed version '$version' is not a nightly slug"
            exit 1
          fi
          echo "Nightly version: $version (base $base, from $current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── verify-publish: `npm@latest` canary with a real loopback publish ───────
  # Runs the rehearsal's copies of the commands the release `publish` job runs
  # after `npm install -g npm@latest` (publish.yml): npm pkg set, build, then
  # runtime-lock generation and a per-package `npm publish` through
  # scripts/nightly-verdaccio-publish.mjs, all to a loopback Verdaccio
  # (http://localhost:4873, a throwaway token, --no-provenance). Nothing here
  # reaches the public registry. It gates no job: an `npm@latest` breakage
  # shows as this job red while electron/smoke/knip/install-load still run
  # (design D3/D8 of schedule-release-rehearsal). Spike run 45153362930:
  # green in 6 min 5 s under npm 12.2.3.
  verify-publish:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # pnpm, like every other job: the repo has no package-lock.json, so
      # an npm-cache install could never run and skipped the electron matrix.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # The release job upgrades npm to latest before it publishes
      # (publish.yml); doing the same here is what makes npm drift show up on
      # develop instead of at tag time.
      - name: Upgrade npm like the release publish job (publish.yml)
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Set nightly version
        run: npm pkg set "version=${{ needs.resolve.outputs.version }}" --workspaces --include-workspace-root
      - name: Sync inter-package dep specifiers
        run: node scripts/sync-versions.js
      # publish.yml:185 and _electron-build.yml:263 refresh pnpm-lock.yaml the
      # same way; verify-lockfile-versions.mjs (step (d) of the publish script)
      # reads pnpm-lock.yaml and fails on the pre-bump specifiers without it.
      - name: Refresh pnpm-lock.yaml with the bumped versions
        run: pnpm install --lockfile-only
      - run: pnpm run build
      - name: Install Verdaccio
        # Pinned: Verdaccio 7 rejects the fixed fake `_authToken` the publish
        # script uses (E401). Runs under npm@latest, as the electron legs'
        # install runs under the runner's npm.
        run: npm install -g verdaccio@6.11.1
      - name: Start Verdaccio
        env:
          REGISTRY: http://localhost:4873
        run: node scripts/nightly-verdaccio-serve.mjs
      - name: Publish workspaces to Verdaccio
        env:
          REGISTRY: http://localhost:4873
          NIGHTLY_VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/nightly-verdaccio-publish.mjs

  # ── knip: whole-graph dead-code ratchet ────────────────────────────────────
  # Nightly, never ci.yml: the scan is whole-graph (~8s) and its verdict does
  # not depend on the PR's diff. Nightly runs AFTER merge, so this job DETECTS
  # a regression; the job that PREVENTS one is the ship-it enforcer step.
  # Fails on a class above its baseline (not continue-on-error) so a regression
  # is visible in the nightly report rather than buried in the log.
  knip:
    name: knip dead-code ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2 so the baseline can be diffed against the previous commit.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An unrooted graph reports live files as dead, so the config is verified
      # against the manifests before its verdict is trusted.
      - name: Verify knip.json roots every manifest-declared entry
        run: node scripts/knip-config.mjs

      - name: Dead-code ratchet
        run: node scripts/knip-ratchet.mjs

      # The ship enforcer rejects a raised ceiling on the way IN; this catches
      # one that already landed. Compared against HEAD~1, not origin/develop —
      # nightly runs ON develop, so origin/develop is this very tree and the
      # comparison would be vacuous.
      - name: Baseline was not raised
        run: node scripts/knip-ratchet.mjs --check-baseline-diff HEAD~1

  # ── install-load: every plugin loads from a published install ─────────────
  # The static publish-correctness check lives in ci.yml; this is the dynamic
  # half. Every plugin workspace with a `server` entry is packed with its
  # first-party workspace deps from the working tree and imported OUTSIDE the
  # repo under node + the native strip-only loader with JITI_TSCONFIG_PATHS unset and no repo tsconfig
  # reachable — the mode where the old alias layers did not exist, which is why
  # the browser plugin failed to load for npm / managed / Electron users.
  # Budget: whole leg < 12 min (test-plan P1).
  # See change: fix-browser-plugin-vendor-specifier-resolution.
  install-load:
    name: plugin install-load (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every shipped plugin loads from a published install
        run: node scripts/verify-plugin-install-load.mjs

  # ── electron: full matrix against a per-leg Verdaccio ──────────────────────
  # Delegates to the shared build. registry_url triggers the Verdaccio
  # round-trip inside _electron-build.yml. It does not wait for verify-publish:
  # that job is the `npm@latest` canary and the legs run on the runner's npm, so
  # gating them on it would skip the whole Electron rehearsal for as long as
  # npm@latest is broken (design D3). NO publish/github-release/tag jobs
  # anywhere in this workflow (task 4.6).
  electron:
    needs: [resolve]
    uses: ./.github/workflows/_electron-build.yml
    with:
      version:                 ${{ needs.resolve.outputs.version }}
      ref:                     ${{ github.sha }}
      legs:                    all
      source_only_bundle:      false
      registry_url:            http://localhost:4873
      # Exercise the release path (runtime lock generated against the per-leg
      # Verdaccio → npm ci → audit) on all six legs every night.
      # See change: pin-electron-bundle-dependency-tree (design D5).
      release_lock:            true
      artifact_retention_days: 7
      use_dependency_cache:    true  # dev/nightly only; see harden-ci-cache-poisoning

  # ── smoke: the release gate's standalone-install smoke ─────────────────────
  # Same reusable workflow the tag gate runs (publish.yml). It packs the working
  # tree at `ref` and installs it into a clean HOME; it cannot target the
  # Verdaccio registry (no registry input), so it rehearses the release's
  # install path, not "install the published nightly" (design D4).
  smoke:
    uses: ./.github/workflows/_smoke.yml
    with:
      ref: ${{ github.sha }}

  # ── report: one `nightly` issue, written only by a scheduled run ───────────
  # `needs` lists every other job and `if: always()` keeps the report alive
  # when one fails, is skipped or is cancelled (all count as red). The verdict
  # comes from NEEDS_JSON, the failed legs from the run's jobs API; see
  # scripts/test-selection/nightly-report.mjs (design D2).
  report:
    needs: [resolve, verify-publish, knip, install-load, electron, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Report the night
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/test-selection/nightly-report.mjs --jobs-only --no-close-on-rerun --label nightly --name "Nightly Verdaccio build"
