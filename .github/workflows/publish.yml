name: Release

# Two ways to fire this workflow:
#
#   1. Push a tag matching `v*`. The `resolve` job extracts the version
#      from the tag, the release-gate (`ci-checks` + `smoke`) runs,
#      `tag-and-push` is SKIPPED (the tag is already present), then
#      publish + electron + github-release run.
#
#   2. Click "Run workflow" in the GitHub Actions UI (workflow_dispatch)
#      and type the version string (e.g. "0.4.1"). The `resolve` job
#      resolves the version string, the release-gate runs against the
#      branch HEAD sha, then `tag-and-push` bumps every workspace
#      package.json, runs scripts/sync-versions.js, promotes [Unreleased]
#      in CHANGELOG.md to a dated [vX.Y.Z] section, commits + tags +
#      pushes the branch, then publish + electron + github-release run
#      against the freshly-pushed tag.
#
# See change: gate-publish-on-smoke-and-tests.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        type: string
        required: true

jobs:
  # ── resolve: pure version resolution (no side effects) ────────────────────
  # Splits the legacy monolithic `prepare` job. The bump/commit/tag/push
  # steps moved to `tag-and-push` (runs only on workflow_dispatch). The
  # `outputs.ref` is the sha the release-gate will test — `github.sha` on
  # both paths (the tag's commit on tag-push, the branch HEAD on dispatch).
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version:       ${{ steps.resolve.outputs.version }}
      tag:           ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      ref:           ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ github.event.inputs.version }}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
              echo "::error::'$version' is not valid semver (X.Y.Z[-prerelease])"
              exit 1
            fi
            if git ls-remote --tags origin "v$version" | grep -q "v$version$"; then
              echo "::error::tag v$version already exists on origin"
              exit 1
            fi
            tag="v$version"
          fi
          # Detect SemVer prerelease (anything with a `-` suffix on the
          # X.Y.Z core, e.g. `0.4.5-rc.1`). Prereleases publish to npm
          # under the `next` dist-tag and surface as GitHub `prerelease:
          # true` Releases. Stable versions keep `latest` + regular
          # Release. See change: eliminate-bash-on-windows-runners (D6).
          is_prerelease=$([[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]] && echo true || echo false)
          echo "Resolved: version=$version tag=$tag is_prerelease=$is_prerelease"
          echo "version=$version"             >> "$GITHUB_OUTPUT"
          echo "tag=$tag"                     >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

  # ── release-gate: ci-checks (lint+test+build) ─────────────────────────────
  # Mirrors `ci.yml`'s `ci` job, but runs at release time against the
  # resolved ref. Fans out in parallel with `smoke`. See change:
  # gate-publish-on-smoke-and-tests.
  ci-checks:
    needs: [resolve]
    runs-on: ubuntu-latest
    # Budget must cover install + lint + the FULL suite + build. `ci.yml` runs
    # the same work with no timeout at all (GitHub default 360) and takes ~27
    # minutes at 16.7k tests. This job was capped at 15, so once the suite grew
    # past that the release gate could not pass: v0.8.0 was killed mid-`pnpm
    # test` at 15m15s and reported as `cancelled` (GitHub marks a timed-out job
    # cancelled, not failed — it does NOT look like a test failure). Keep this
    # comfortably above ci.yml's real duration; it still bounds a genuine hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  # ── release-gate: smoke (standalone-install-smoke matrix) ─────────────────
  # Calls the reusable `_smoke.yml` with the resolved ref. Fans out in
  # parallel with `ci-checks`. See change: gate-publish-on-smoke-and-tests.
  smoke:
    needs: [resolve]
    uses: ./.github/workflows/_smoke.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  # ── tag-and-push: bump + commit + tag + push (dispatch only) ──────────────
  # Runs ONLY on workflow_dispatch. On tag-push entry the tag is already
  # present; this job is skipped and downstream `needs:` treat the skip as
  # success. Runs AFTER the release-gate (`ci-checks` + `smoke`) so a
  # failing gate leaves no commit, no tag, no npm artifact. See change:
  # gate-publish-on-smoke-and-tests.
  tag-and-push:
    needs: [resolve, ci-checks, smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Bump workspace versions
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version \
            --workspaces \
            --include-workspace-root

      - name: Sync inter-package dep specifiers
        shell: bash
        run: node scripts/sync-versions.js

      - name: Regenerate pnpm-lock.yaml with bumped versions
        shell: bash
        run: |
          # The workspace graph changed (every package.json's version +
          # cross-ref specifiers were bumped). The lockfile must be
          # regenerated so its recorded specifiers match, otherwise strict
          # prerelease semver causes consumer installs to fall back to the
          # registry on every install. See change: fix-release-lockfile-drift.
          pnpm install --lockfile-only

      - name: Verify lockfile matches workspace versions
        shell: bash
        run: node scripts/verify-lockfile-versions.mjs

      - name: Promote CHANGELOG, commit, tag, push
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          if grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md already contains a section for ${VERSION}"
            exit 1
          fi
          TODAY="$today" python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          today = os.environ["TODAY"]
          p = pathlib.Path("CHANGELOG.md")
          src = p.read_text()
          replacement = (
              "## [Unreleased]\n\n"
              "### Added\n\n"
              "### Changed\n\n"
              "### Fixed\n\n"
              f"## [{version}] - {today}\n"
          )
          new = re.sub(r"^## \[Unreleased\]\s*\n", replacement, src, count=1, flags=re.MULTILINE)
          if new == src:
              raise SystemExit("Could not find '## [Unreleased]' heading in CHANGELOG.md")
          p.write_text(new)
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${VERSION}"

  # ── npm publish (OIDC / Trusted Publisher — no NPM_TOKEN secret) ──────────
  # `needs:` includes the full release-gate (`ci-checks` + `smoke`) plus
  # `tag-and-push`. On tag-push entry `tag-and-push` is skipped; GitHub
  # Actions treats a skipped `needs:` as blocking unless the dependent
  # job has an explicit `if:` that evaluates `needs.*.result`. The `if:`
  # below allows `tag-and-push` to be either `success` (dispatch path)
  # or `skipped` (tag-push path), while still requiring `ci-checks` and
  # `smoke` to be green. See change: gate-publish-on-smoke-and-tests.
  publish:
    needs: [resolve, ci-checks, smoke, tag-and-push]
    if: >-
      ${{ !cancelled()
      && needs.ci-checks.result == 'success'
      && needs.smoke.result == 'success'
      && (needs.tag-and-push.result == 'success' || needs.tag-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm-publish  # Matches npm Trusted Publisher config;
                              # acts as a required-reviewer gate if configured.
    permissions:
      contents: write
      id-token: write  # Required for OIDC token exchange with npm registry.
    steps:
      - uses: actions/checkout@v4
        with:
          # Always check out the resolved tag so dispatch-cut releases
          # publish the freshly-bumped tree, not the branch tip we may
          # have moved past.
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing requires npm CLI ≥ 11.5.1 for the OIDC provenance
      # exchange. Dependency installation is now pnpm's job (blockExoticSubdeps
      # handles the transitive git dep @electron/node-gyp), so the old EALLOWGIT
      # pin to 11.12.1 is no longer needed — float to @latest, which guarantees
      # the OIDC floor. npm survives here only for `npm publish --provenance`.
      # See change: adopt-pnpm-for-dev-ci (§8.3).
      - name: Upgrade npm for trusted publishing (OIDC ≥ 11.5.1)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Set version from resolved tag
        run: npm version "${{ needs.resolve.outputs.version }}" --no-git-tag-version --allow-same-version --workspaces --include-workspace-root

      - name: Sync inter-package dep specifiers to bumped version
        run: node scripts/sync-versions.js

      - run: pnpm run build

      - name: "Publish to npm (idempotent, ordered: sub-packages first, root last)"
        # Replaces the old `npm publish --workspaces --include-workspace-root` call.
        #
        # Why per-package loop instead of bulk --workspaces:
        #  1. Idempotency — already-published versions are skipped (so a re-run
        #     after a partial-publish failure resumes cleanly instead of failing
        #     on "cannot publish over previously published").
        #  2. Ordering — the root metapackage @blackbelt-technology/pi-agent-dashboard
        #     declares the sub-packages as dependencies; publishing it last
        #     ensures the registry already serves matching sub-package versions
        #     by the time the root tarball lands.
        #  3. Brand-new package isolation — @blackbelt-technology/dashboard-plugin-runtime
        #     has never been published; if Trusted Publisher / OIDC config is missing
        #     for it, the failure is contained without rolling back the 4 stable
        #     sub-package publishes that ran first.
        #
        # Failure mode: any single non-skip publish failure marks the whole step
        # failed (FAIL=1) but lets the loop finish so the logs show every
        # package's outcome. Each failure is classified: an OIDC / trusted-
        # publisher signature in npm's output emits a `::error::<pkg> —
        # trusted publisher likely missing` annotation and lands the package
        # in a gap report written to $GITHUB_STEP_SUMMARY, so one release run
        # tells you exactly which packages still need a Trusted Publisher.
        run: |
          set -uo pipefail
          # Ordering invariant: a package MUST appear AFTER every
          # @blackbelt-technology/* package it depends on, so the registry
          # already serves the matching version when the consumer publishes.
          # The root metapackage is published LAST. See contract test
          # packages/shared/src/__tests__/publish-allowlist-complete.test.ts
          # which enforces every non-private workspace appears here.
          PACKAGES=(
            "@blackbelt-technology/pi-dashboard-shared"
            "@blackbelt-technology/pi-dashboard-bus-client"
            "@blackbelt-technology/pi-dashboard-extension"
            "@blackbelt-technology/pi-dashboard-server"
            "@blackbelt-technology/pi-dashboard-web"
            "@blackbelt-technology/dashboard-plugin-runtime"
            "@blackbelt-technology/pi-dashboard-client-utils"
            "@blackbelt-technology/pi-dashboard-flows-plugin"
            "@blackbelt-technology/pi-dashboard-plugin-skill"
            "@blackbelt-technology/pi-dashboard-roles-plugin"
            "@blackbelt-technology/pi-dashboard-flows-anthropic-bridge-plugin"
            "@blackbelt-technology/pi-dashboard-subagents-plugin"
            "@blackbelt-technology/pi-dashboard-goal-plugin"
            "@blackbelt-technology/pi-dashboard-automation-plugin"
            "@blackbelt-technology/pi-dashboard-quota-plugin"
            "@blackbelt-technology/pi-dashboard-grammar-plugin"
            "@blackbelt-technology/pi-image-fit-extension"
            "@blackbelt-technology/pi-dashboard-nano-banana"
            "@blackbelt-technology/pi-dashboard-video-production"
            "@blackbelt-technology/frontend-mockup-loop"
            "@blackbelt-technology/pi-dashboard-kb"
            "@blackbelt-technology/pi-dashboard-kb-extension"
            "@blackbelt-technology/pi-dashboard-kb-plugin"
            "@blackbelt-technology/pi-dashboard-hermes-memory-plugin"
            "@blackbelt-technology/pi-dashboard-blackhole-plugin"
            "@blackbelt-technology/pi-dashboard-mcp-server-plugin"
            "@blackbelt-technology/pi-dashboard-document-converter"
            "@blackbelt-technology/anti-slop-frontend"
            "@blackbelt-technology/pi-dashboard-eng-disciplines"
            "@blackbelt-technology/pi-dashboard-authoring-toolkit"
            "@blackbelt-technology/pi-dashboard-apple-tools"
            "@blackbelt-technology/pi-dashboard-video-transcription"
            "@blackbelt-technology/pi-dashboard-session-distiller"
            "@blackbelt-technology/pi-dashboard-distill-session-knowledge"
            "@blackbelt-technology/pi-dashboard-code-review-toolkit"
            "@blackbelt-technology/pi-dashboard-frontend-patterns"
            "@blackbelt-technology/pi-dashboard-openspec-workflow"
            "@blackbelt-technology/pi-dashboard-cost-estimator"
            "@blackbelt-technology/pi-dashboard-forms-bpmn"
            "@blackbelt-technology/pi-dashboard-context-budget"
            "@blackbelt-technology/pi-agent-dashboard"
          )
          VERSION="${{ needs.resolve.outputs.version }}"
          PRERELEASE="${{ needs.resolve.outputs.is_prerelease }}"
          # Prereleases publish to the `next` dist-tag so consumers running
          # plain `npm install <pkg>` keep getting the last stable release.
          # Stable releases use the default `latest` dist-tag (no override).
          # See change: eliminate-bash-on-windows-runners (D6).
          TAG_ARG=""
          if [ "$PRERELEASE" = "true" ]; then TAG_ARG="--tag next"; fi
          FAIL=0
          FAILED_TP=()     # failures whose signature = missing trusted-publisher / OIDC config
          FAILED_OTHER=()  # failures for any other reason
          # Disable set -e for the publish loop: each package's rc is captured
          # explicitly (PIPESTATUS) and handled below, so a single failure must
          # NOT abort the loop. Without this, `set -euo pipefail` exits at the
          # first failing `npm publish | tee`, so the gap report never lists more
          # than one package. Re-enabled after the loop.
          set +e
          for pkg in "${PACKAGES[@]}"; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$pkg@$VERSION already published — skip"
              continue
            fi
            echo "::group::Publishing $pkg@$VERSION (is_prerelease=$PRERELEASE)"
            if [ "$pkg" = "@blackbelt-technology/pi-agent-dashboard" ]; then
              npm publish --provenance --access public $TAG_ARG 2>&1 | tee /tmp/pub.log; rc=${PIPESTATUS[0]}
            else
              npm publish --workspace="$pkg" --provenance --access public $TAG_ARG 2>&1 | tee /tmp/pub.log; rc=${PIPESTATUS[0]}
            fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              FAIL=1
              # OIDC / trusted-publisher signatures: the id-token exchange is
              # rejected, or npm cannot authenticate the provenance publish.
              if grep -qiE 'oidc|trusted publish|id-token|unable to authenticate|ENEEDAUTH|could not (get|retrieve|read).*(oidc|token)' /tmp/pub.log; then
                echo "::error::$pkg — publish failed; Trusted Publisher likely NOT configured (OIDC token exchange rejected). Add it: npmjs.com → $pkg → Settings → Trusted Publisher (repo ${GITHUB_REPOSITORY}, workflow publish.yml, environment npm-publish)."
                FAILED_TP+=("$pkg")
              else
                echo "::error::$pkg — publish failed (non-OIDC error; see the group log above)."
                FAILED_OTHER+=("$pkg")
              fi
            fi
          done
          set -e
          # Gap report → job summary (renders on the run's Summary tab).
          {
            echo "## npm publish — Trusted Publisher gap report"
            echo ""
            if [ "${#FAILED_TP[@]}" -eq 0 ] && [ "${#FAILED_OTHER[@]}" -eq 0 ]; then
              echo "✅ All packages published (or already up-to-date). No Trusted Publisher gaps detected."
            else
              if [ "${#FAILED_TP[@]}" -gt 0 ]; then
                echo "### ❌ Trusted Publisher likely MISSING (${#FAILED_TP[@]})"
                for p in "${FAILED_TP[@]}"; do echo "- \`$p\`"; done
                echo ""
                echo "Fix each: npmjs.com → package → **Settings → Trusted Publisher** — repo \`${GITHUB_REPOSITORY}\`, workflow \`publish.yml\`, environment \`npm-publish\`."
                echo ""
              fi
              if [ "${#FAILED_OTHER[@]}" -gt 0 ]; then
                echo "### ⚠️ Other publish failures (${#FAILED_OTHER[@]})"
                for p in "${FAILED_OTHER[@]}"; do echo "- \`$p\`"; done
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      # Post-release registry assertion. The publish loop reports its own
      # failures, but "publish exited zero" is not the same as "the version is
      # resolvable". Assert the registry actually serves <version> for every
      # non-private workspace, so a silently-missing package is caught here
      # rather than by a consumer's install.
      # See change: cleanup-undeclared-dependencies (test-plan R1).
      - name: Verify every non-private workspace resolves on the registry
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Captured into a variable, not piped through process substitution:
          # a failure inside `< <(...)` does NOT fail `mapfile`, so a broken
          # discovery would yield an empty set and the loop below would report a
          # successful registry assertion having checked nothing.
          names_text="$(node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const base = path.join(process.cwd(), 'packages');
            const out = [];
            for (const d of fs.readdirSync(base)) {
              const p = path.join(base, d, 'package.json');
              if (!fs.existsSync(p)) continue;
              const m = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (m.private === true) continue;
              out.push(m.name);
            }
            out.push(JSON.parse(fs.readFileSync('package.json', 'utf8')).name);
            console.log(out.join('\n'));
          ")"
          if [ -z "$names_text" ]; then
            echo "::error::workspace discovery returned no package names; refusing to report a vacuous pass"
            exit 1
          fi
          mapfile -t names <<< "$names_text"
          echo "Asserting ${#names[@]} package(s) resolve at ${VERSION}"
          missing=()
          for name in "${names[@]}"; do
            # The registry is eventually consistent, and `npm view` will serve a
            # CACHED packument that predates a version published seconds ago.
            # v0.8.0's first run failed here naming a package that was in fact
            # published — the raw registry API showed the version while `npm
            # view` still 404'd. A single unretried lookup therefore turns a
            # healthy release into a red gate and skips electron + the GitHub
            # Release. Revalidate with --prefer-online and back off before
            # declaring anything missing. Costs nothing when the version is
            # already visible: the loop breaks on the first attempt.
            actual=""
            for attempt in 1 2 3 4 5; do
              actual=$(npm view --prefer-online "${name}@${VERSION}" version 2>/dev/null || true)
              [ "$actual" = "$VERSION" ] && break
              [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
            done
            if [ "$actual" != "$VERSION" ]; then
              echo "::error::${name} does not resolve at ${VERSION} on the registry (npm view returned '${actual:-<nothing>}')"
              missing+=("$name")
            else
              echo "ok  ${name}@${VERSION}"
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::${#missing[@]} package(s) did not resolve at ${VERSION}"
            exit 1
          fi

  # ── Electron builds (parallel) ────────────────────────────────
  # MUST `needs: [resolve, publish]` — the bundled server's `npm install`
  # in `bundle-server.mjs` resolves `@blackbelt-technology/*` sub-packages
  # from the public npm registry, which only have the just-bumped version
  # available after `publish` finishes uploading. Gating on `publish`
  # closes the ETARGET race that broke release run #34. See change:
  # publish-fix-macos. Locked by
  # `packages/shared/src/__tests__/publish-workflow-contract.test.ts`.
  electron:
    needs: [resolve, publish]
    # On the tag-push path `tag-and-push` is SKIPPED, and a skipped job in the
    # needs-ancestry poisons the DEFAULT `if: success()` — GitHub then skips
    # `electron` (and `github-release`) even when `publish` is green. Mirror the
    # explicit skip-tolerant guard `publish` already uses so the release's
    # installer + GitHub Release stages survive the skipped `tag-and-push`.
    # See change: gate-publish-on-smoke-and-tests.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    # All matrix/steps moved to .github/workflows/_electron-build.yml so the
    # same definition serves both this release flow AND the on-demand CI
    # workflow (.github/workflows/ci-electron.yml). See change:
    # add-ci-electron-on-demand-build.
    #
    # CRITICAL: do NOT remove `needs: [resolve, publish]` — the registry-
    # availability gate is still required for release builds (the bundled
    # server's `npm install` resolves @blackbelt-technology/* from npm).
    # See packages/shared/src/__tests__/publish-workflow-contract.test.ts.
    uses: ./.github/workflows/_electron-build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      ref:     ${{ needs.resolve.outputs.tag }}
      legs:                    all
      source_only_bundle:      false
      artifact_retention_days: 90

  # ── GitHub Release (waits for all builds) ─────────────────────
  github-release:
    if: ${{ always() && needs.electron.result == 'success' }}
    needs: [resolve, publish, electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -u
          version="${{ needs.resolve.outputs.version }}"
          echo "Extracting notes for version: ${version}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found — using fallback body"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for full notes.\n' "${GITHUB_REPOSITORY}" > release-notes.md
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capture content from '## [<version>]' up to (but not including) the next '## [' heading or EOF.
          awk -v ver="${version}" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for ${version} — using fallback body"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for full notes.\n' "${GITHUB_REPOSITORY}" > release-notes.md
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi
          # Append the static first-launch-unblocking footer (Windows
          # SmartScreen + macOS Gatekeeper workarounds) so every release —
          # whether the body comes from CHANGELOG.md or the GitHub-generated
          # fallback — surfaces the workarounds for unsigned/un-notarized
          # binaries. Edit `.github/release-notes-footer.md` to update;
          # delete the file (or this step) once Authenticode signing AND
          # macOS notarization both ship. See changes:
          # `windows-authenticode-signing`, `macos-notarization` (planned).
          if [ -f .github/release-notes-footer.md ]; then
            printf '\n\n' >> release-notes.md
            cat .github/release-notes-footer.md >> release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      - name: Drop builder-debug logs (avoid asset basename collision)
        # Each electron matrix leg emits a builder-debug.yml; multiple
        # legs uploading the same basename cause softprops/action-gh-release
        # to 404 on the asset-update API, failing the step even though all
        # real artifacts uploaded successfully. The debug logs are not
        # user-facing release artifacts.
        run: find electron-* -name builder-debug.yml -delete || true

      # The arm64 + x64 macOS legs each emit their own latest-mac.yml (one DMG
      # in files[]). softprops dedups release assets by basename, so without a
      # merge one arch's metadata silently overwrites the other's. Merge into a
      # single latest-mac.yml whose files[] lists every DMG, and drop the
      # duplicates so only the merged file uploads.
      # See change: fix-electron-auto-update-pipeline (ci-cd-pipeline spec).
      # ⚠️ CI-VALIDATE: confirm electron-updater resolves the merged file on a
      # native arm64 Mac (picks the right files[] entry).
      - name: Merge macOS update metadata (arm64 + x64 → one latest-mac.yml)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MAC_YML < <(find electron-darwin-* -name 'latest-mac.yml' 2>/dev/null || true)
          if [ "${#MAC_YML[@]}" -le 1 ]; then
            echo "${#MAC_YML[@]} latest-mac.yml found — no merge needed"; exit 0
          fi
          python3 -m pip install --quiet pyyaml
          # The merge lives in scripts/merge-latest-mac.py (not an inline
          # heredoc) so its semantics — notably the minimumSystemVersion
          # agreement check that keeps the update gate independent of glob
          # order — are covered by a test. See change: upgrade-electron-runtime.
          python3 scripts/merge-latest-mac.py "${MAC_YML[@]}"

      # The merged file is what electron-updater actually reads, so assert the
      # OS gate survived the merge here rather than trusting the per-leg
      # intermediate. test-plan U6. See change: upgrade-electron-runtime.
      - name: Assert the macOS update gate survived the merge
        shell: bash
        run: |
          set -euo pipefail
          # `|| true`: with no electron-darwin-* dir the glob stays literal and
          # find exits 1, which pipefail propagates through `head` — killing the
          # step under `set -e` BEFORE the guard below can skip cleanly. Same
          # guard the merge step above already uses.
          MERGED=$(find electron-darwin-* -name 'latest-mac.yml' 2>/dev/null | head -1 || true)
          if [ -z "$MERGED" ]; then
            echo "No latest-mac.yml present (no darwin artifacts) — nothing to assert"; exit 0
          fi
          EXPECTED=$(node -e "import('./packages/electron/scripts/macos-floor.mjs').then(m=>console.log(m.UPDATE_MINIMUM_SYSTEM_VERSION))")
          VALUE=$(sed -n 's/^minimumSystemVersion:[[:space:]]*//p' "$MERGED" | head -1)
          if [ "$VALUE" != "$EXPECTED" ]; then
            echo "::error::$MERGED has minimumSystemVersion='$VALUE', expected '$EXPECTED'. Below-floor macOS clients would be offered an artifact their OS refuses to launch."
            cat "$MERGED"
            exit 1
          fi
          echo "OK merged latest-mac.yml carries minimumSystemVersion: $VALUE"

      # Fail the release if any platform produced an installer but no matching
      # update-metadata file — a partial upload would brick that platform's
      # auto-update channel. See change: fix-electron-auto-update-pipeline.
      - name: Assert update metadata present for each installer
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() { # <installer-glob> <metadata-name> <label>
            if find electron-* -type f -name "$1" 2>/dev/null | grep -q .; then
              if ! find electron-* -type f -name "$2" 2>/dev/null | grep -q .; then
                echo "::error::$3 installer present but $2 is missing"; fail=1
              fi
            fi
          }
          check '*.exe' 'latest.yml' 'Windows'
          check '*.dmg' 'latest-mac.yml' 'macOS'
          check '*.AppImage' 'latest-linux.yml' 'Linux'
          exit $fail

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: electron-*/**/*
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.fallback == 'true' }}
          # Production tags (no SemVer prerelease segment) publish immediately so
          # electron-updater's default GitHub provider — which queries
          # /releases/latest and excludes drafts — can resolve them. Pre-release
          # tags stay drafts so a maintainer can eyeball artifacts before
          # flipping to published. See change: fix-electron-auto-update-pipeline
          # (ci-cd-pipeline spec: "Production tags publish GitHub Releases").
          draft: ${{ needs.resolve.outputs.is_prerelease == 'true' }}
          # Prereleases (anything with a SemVer prerelease segment, e.g.
          # `0.4.5-rc.1`) surface as GitHub `prerelease: true` Releases
          # so they don't appear as the latest release on the repo page
          # and tooling that filters by prerelease state classifies them
          # correctly. The literal-string comparison is required because
          # Actions stringifies job outputs. See change:
          # eliminate-bash-on-windows-runners (D6).
          prerelease: ${{ needs.resolve.outputs.is_prerelease == 'true' }}

  # ── Site redeploy (dispatched — release events cannot start runs) ─────
  # publish.yml creates the GitHub Release with the default Actions token,
  # and GitHub suppresses workflow runs from events raised by that token, so
  # `release: published` triggers on sync-release-version.yml /
  # deploy-site.yml CANNOT start runs (verified: never have in this repo).
  # workflow_dispatch is the documented exception that always creates a run.
  # This terminal job is therefore the release path for the site: dispatch
  # sync-release-version.yml (rewrites the download block on develop), WAIT
  # for that run to complete, then dispatch deploy-site.yml. The wait is
  # load-bearing: a back-to-back dispatch lets the deploy check out develop
  # before the download-block commit lands, and the page renders either way,
  # so the race is invisible. --ref develop is load-bearing too: the
  # github-pages environment rejects deploys from a tag ref.
  # See change: fix-deploy-site-ship-shell (design D8).
  site-redeploy:
    needs: [github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # required so this job can run `gh workflow run`
    steps:
      - name: Dispatch sync-release-version.yml on develop and wait for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run sync-release-version.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref develop
          # The run registers asynchronously; bound the lookup to runs created
          # AFTER our dispatch timestamp so we never watch a stale manual run.
          run_id=""
          for _ in $(seq 1 30); do
            sleep 5
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-release-version.yml/runs?event=workflow_dispatch&per_page=5" \
              --jq "[.workflow_runs[] | select(.created_at > \"$before\")][0].id" 2>/dev/null || true)
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::sync-release-version run did not register within 150s"
            exit 1
          fi
          echo "Watching sync-release-version run $run_id"
          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15

      - name: Dispatch deploy-site.yml on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-site.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref develop
