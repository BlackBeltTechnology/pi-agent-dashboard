name: Sync Release Version

# run-name embeds the optional `correlation` dispatch input so publish.yml's
# site-redeploy job can bind its wait to the exact run IT dispatched (never a
# concurrent manual run). See change: fix-deploy-site-ship-shell.
run-name: "sync-release-version ${{ inputs.correlation || 'manual' }}"

# Rewrites the download block in `site/index.html` from the latest release and
# commits it to develop.
#
# The site used to be Astro and fetched this at build time into
# `site/src/data/latest-release.json`. It is now a hand-written static page, so
# the release data lives INLINE in the markup and this workflow is the only
# thing that keeps it true. Same script a human runs locally:
# `npm run sync-release -w site`.
#
# Trigger: `workflow_dispatch` ONLY.
#   - Normal path: publish.yml's `site-redeploy` job dispatches this workflow
#     (binding its wait to the `correlation` input), then dispatches
#     `deploy-site.yml` as a separate step.
#   - There is deliberately NO `release:` trigger. Pipeline releases are
#     created under the default Actions token, whose events start no
#     workflow; a prerelease published by hand from its draft WOULD start a
#     run, but that run is incomplete: this workflow commits with
#     GITHUB_TOKEN, and a GITHUB_TOKEN push cannot start `deploy-site.yml`
#     (its `paths:` filter never sees this commit). So the site would not
#     redeploy.
#
# Manual recovery (hand-published draft, or a retroactively edited release):
# TWO dispatches from the Actions UI —
#   1. dispatch `sync-release-version` (this workflow), wait for it to commit;
#   2. dispatch `deploy-site`.
# See change: fix-ci-pipeline-followups.

on:
  workflow_dispatch:
    inputs:
      correlation:
        description: 'Unique token embedded in the run name; used by publish.yml site-redeploy to bind its wait to this exact run'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-release-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a token that can push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rewrite download block from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node site/design-scratch/scripts/sync-release.mjs

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet site/index.html; then
            echo "No change — skipping commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/index.html
          git commit -m "chore(site): sync download block to ${GITHUB_REF_NAME:-manual-refresh}"
          git push origin HEAD:develop
