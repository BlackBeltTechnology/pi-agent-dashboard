services:
  dashboard:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    environment:
      - PI_SANDBOX=1
    volumes:
      - ../seed/active-project:/home/pi/.pi/agent/sessions-seed:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:8000/api/health && curl -sf http://localhost:9222/json/version"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
